site_name: TorchTPU Documentation
# Only uncomment when ready to publish
# repo_url: https://github.com/google-pytorch/torch_tpu
docs_dir: docs
strict: true  # Fail the build if there are any warnings

theme:
  name: material
  logo: images/logo.png
  favicon: images/favicon.png
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-2
        name: Switch to system preference
  features:
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow

exclude_docs: |
    /README.md
    developers/**
    notebooks/**
    source/**
    **/BUILD
    public_apis.md

nav:
  - Home: index.md
  - Get started with TorchTPU:
    - intro_to_torchtpu.md
    - get_started_on_a_vm.md
    - get_started_on_gke.md
    - feature_set.md
    - api_reference.md
    - faq.md
  - Deep dives:
    - how_torchtpu_works.md
    - torchtpu_execution_model.md
    - torchtpu_memory_model.md
    - distributed_support.md
    - custom_kernels.md
    - dynamic_shapes.md
  - Case studies:
    - case_studies_flux.md
    - case_studies_muse_glimmer_30b_inference.md
    - case_studies_muse_glimmer_30b_training.md
    - case_studies_fsdp.md
  - Analyze your workload:
    - numerical_precision.md
    - performance_profiling_with_xprof.md
#    - tpu_monitoring.md

plugins:
  - search
  - same-dir
  - meta
  - glightbox
  - open-in-new-tab
  - table-reader

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  # For content tabs
  - pymdownx.superfences
  - pymdownx.tabbed:
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      alternate_style: true
  # For code highlighting
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  # For emoji and icons
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # For in page [TOC] (not sidebar)
  - toc:
      permalink: true
  # For math rendering
  - mdx_math:
      enable_dollar_delimiter: true

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/MathJax.js?config=TeX-AMS_HTML

use_directory_urls: true

