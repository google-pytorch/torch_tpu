site_name: TorchTPU Documentation
# Only uncomment when ready to publish
repo_url: https://github.com/google-pytorch/torch_tpu
docs_dir: docs
strict: true  # Fail the build if there are any warnings

theme:
  name: material
  logo: images/logo.png
  favicon: images/favicon.png
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-2
        name: Switch to system preference
  features:
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow

exclude_docs: |
    /README.md
    developers/**
    notebooks/**
    source/**
    **/BUILD
    public_apis.md

hooks:
  - mkdocs_hooks.py

nav:
  - Home: index.md
  - Get started with TorchTPU:
    - intro_to_torchtpu.md
    - get_started_on_a_vm.md
    - get_started_on_gke.md
    - feature_set.md
    - api_reference.md
    - faq.md
  - In-depth:
    - how_torchtpu_works.md
    - torchtpu_execution_model.md
    - torchtpu_memory_model.md
    - distributed_support.md
    - custom_kernels.md
    - dynamic_shapes.md
  - Case studies:
    - case_studies_flux.md
    - case_studies_muse_glimmer_30b_inference.md
    - case_studies_muse_glimmer_30b_training.md
    - case_studies_fsdp.md
  - Analyze your workload:
    - numerical_precision.md
    - performance_profiling_with_xprof.md

plugins:
  - search
  - same-dir
  - meta
  - glightbox
  - open-in-new-tab
  - table-reader
  # Translations live next to the English page as `<page>.<locale>.md`.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Home: ホーム
            Get started with TorchTPU: TorchTPU を使ってみる
            In-depth: 詳細
            Case studies: ケーススタディ
            Analyze your workload: ワークロードを分析する
        - locale: ko
          name: 한국어
          build: true
          nav_translations:
            Home: 홈
            Get started with TorchTPU: TorchTPU 시작하기
            In-depth: 심층 분석
            Case studies: 사례 연구
            Analyze your workload: 워크로드 분석
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Get started with TorchTPU: TorchTPU 入门
            In-depth: 深入了解
            Case studies: 案例研究
            Analyze your workload: 分析工作负载
        - locale: pt-BR
          name: Português (Brasil)
          build: true
          nav_translations:
            Home: Início
            Get started with TorchTPU: Primeiros passos com o TorchTPU
            In-depth: Detalhes técnicos
            Case studies: Estudos de caso
            Analyze your workload: Analise sua carga de trabalho
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Get started with TorchTPU: Primeros pasos con TorchTPU
            In-depth: Información detallada
            Case studies: Casos prácticos
            Analyze your workload: Analiza tu carga de trabajo
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Get started with TorchTPU: Premiers pas avec TorchTPU
            In-depth: Approfondissement
            Case studies: Études de cas
            Analyze your workload: Analyser votre charge de travail
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Home: Startseite
            Get started with TorchTPU: Erste Schritte mit TorchTPU
            In-depth: Details
            Case studies: Fallstudien
            Analyze your workload: Arbeitslast analysieren
        - locale: it
          name: Italiano
          build: true
          nav_translations:
            Home: Home
            Get started with TorchTPU: Inizia a utilizzare TorchTPU
            In-depth: Approfondimenti
            Case studies: Casi di studio
            Analyze your workload: Analizza il tuo carico di lavoro


markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  # For content tabs
  - pymdownx.superfences
  - pymdownx.tabbed:
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      alternate_style: true
  # For code highlighting
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  # For emoji and icons
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # For in page [TOC] (not sidebar)
  - toc:
      permalink: true
  # For math rendering
  - mdx_math:
      enable_dollar_delimiter: true

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/MathJax.js?config=TeX-AMS_HTML

use_directory_urls: true

extra:
 analytics:
   provider: google
   property: G-GLVPZ2PKWX
