# Jupyter Book configuration. See https://jupyterbook.org/customize/config.html
title: TorchTPU Documentation
author: Google LLC
only_build_toc_files: true

execute:
  # Notebooks are executed manually on a TPU VM and committed with their
  # outputs (see docs/README.md); CI must never try to execute them.
  execute_notebooks: "off"

exclude_patterns:
  # Markdown files are the jupytext source of truth for review; the paired
  # .ipynb files (with outputs) are what gets rendered.
  - notebooks/*.md
  - README.md

repository:
  url: https://github.com/google-pytorch/torch_tpu
  path_to_book: docs
  branch: main

html:
  use_repository_button: true
  use_issues_button: false

# TODO: enable the "Open in Colab" launch button once torch_tpu is publicly
# pip-installable (the wheel currently requires gcloud-authenticated access
# to Artifact Registry, so the notebooks cannot run on a Colab runtime yet).
# launch_buttons:
