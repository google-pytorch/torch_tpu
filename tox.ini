# This file configures `tox`, an automation tool for managing isolated execution
# environments. We use it here to provide a hermetic, reproducible environment
# for our C++ CIs (formatting and static analysis).
#
# Instead of forcing contributors to manually install `clang-format` and
# `clang-tidy` globally via OS-specific package managers (apt, brew), tox
# dynamically builds an isolated sandbox. It automatically installs the exact
# required versions from PyPI and executes the tools seamlessly across all
# operating systems.
#
# Details on configuration formatting can be found at:
# https://tox.wiki/en/latest/config.html

[tox]
envlist = lint, tidy-lint
requires = tox-uv
skipsdist = True

[testenv:lint]
description = Run clang-format check on target branch modifications
deps =
    clang-format
allowlist_externals =
    ci/tools/clang_format.sh
passenv =
    BASE_SHA
commands =
    ci/tools/clang_format.sh lint

[testenv:format]
description = Apply clang-format fixes to modified files automatically
deps =
    clang-format
allowlist_externals =
    ci/tools/clang_format.sh
passenv =
    BASE_SHA
commands =
    ci/tools/clang_format.sh format

[testenv:tidy-lint]
description = Run clang-tidy static analysis on target branch modifications
deps =
    clang-tidy
allowlist_externals =
    ci/tools/clang_tidy.sh
passenv =
    BASE_SHA
    BUILD_DIR
commands =
    ci/tools/clang_tidy.sh lint

[testenv:tidy-fix]
description = Apply clang-tidy auto-fixes to modified files
deps =
    clang-tidy
allowlist_externals =
    ci/tools/clang_tidy.sh
passenv =
    BASE_SHA
    BUILD_DIR
commands =
    ci/tools/clang_tidy.sh fix
