    cloud.google.com/gke-tpu-topology: 4x4x4
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: tpu7x-rf
spec:
  nodeLabels:
    cloud.google.com/gke-tpu-accelerator: tpu7x
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: tpu-cluster-queue
spec:
  cohortName: tpu-shared-reservation
  flavorFungibility:
    whenCanBorrow: MayStopSearch
    whenCanPreempt: TryNextFlavor
  namespaceSelector: {}
  preemption:
    borrowWithinCohort:
      policy: Never
    reclaimWithinCohort: Never
    withinClusterQueue: Never
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources:
    - google.com/tpu
    # Small-to-large best-fit packing to protect the 64-chip slice:
    flavors:
    - name: rf-4chip
      resources:
      - borrowingLimit: 80
        name: google.com/tpu
        nominalQuota: 80
    - name: rf-8chip
      resources:
      - borrowingLimit: 80
        name: google.com/tpu
        nominalQuota: 80
    - name: rf-16chip
      resources:
      - borrowingLimit: 80
        name: google.com/tpu
        nominalQuota: 80
    - name: rf-32chip
      resources:
      - borrowingLimit: 80
        name: google.com/tpu
        nominalQuota: 80
    - name: rf-64chip
      resources:
      - borrowingLimit: 80
        name: google.com/tpu
        nominalQuota: 80
  stopPolicy: None
---
