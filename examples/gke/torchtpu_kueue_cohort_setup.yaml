# Public Reference Kueue Cohort Setup manifest for GKE TPU v7x (Trillium) clusters.
#
# Purpose:
# 1. Defines an 80-chip shared reservation cohort (cohortName: tpu-shared-reservation) across five heterogeneous
#    TPU slice topologies: 4-chip (2x2x1), 8-chip (2x2x2), 16-chip (2x2x4), 32-chip (2x4x4), and 64-chip (4x4x4).
# 2. Configures nominalQuota: 80 for each ResourceFlavor, allowing workloads across different slice sizes to borrow
#    from the shared pool while protecting against GKE autoscaler quota exhaustion.
# 3. Uses small-to-large best-fit flavor ordering in universal ClusterQueue tpu-cluster-queue to pack smaller jobs
#    and protect large multi-node (64-chip) slice availability.
# 4. Configures Kubernetes PriorityClasses (high, medium, low, lowest) to manage preemption and queuing priority.
# 5. Establishes LocalQueue lq and multislice-queue as universal default entrypoint queues for XPK workloads and
#    standard Kubernetes jobs. Workloads submitted with label kueue.x-k8s.io/queue-name: lq are automatically
#    admitted into ClusterQueue tpu-cluster-queue and routed to the matching ResourceFlavor based on nodeSelector
#    topology labels.
#
# Placeholder variables to customize:
# - <YOUR_4CHIP_NODEPOOL_NAME>: Name of your GKE 4-chip TPU node pool (e.g. your-v7x-4chip-nodepool).
# - <YOUR_64CHIP_NODEPOOL_NAME>: Name of your GKE 64-chip TPU node pool (e.g. your-v7x-64chip-nodepool).

apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high
value: 100000
globalDefault: false
description: "High priority for critical TorchTPU benchmarks and verification runs."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: medium
value: 50000
globalDefault: true
description: "Default priority for general TorchTPU interactive development and testing."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: low
value: 10000
globalDefault: false
description: "Low priority for background exploratory jobs."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: lowest
value: 1000
globalDefault: false
description: "Lowest priority for preemptible or opportunistic runs."
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: rf-4chip
spec:
  nodeLabels:
    cloud.google.com/gke-nodepool: <YOUR_4CHIP_NODEPOOL_NAME>
    cloud.google.com/gke-tpu-accelerator: tpu7x
    cloud.google.com/gke-tpu-topology: 2x2x1
---
