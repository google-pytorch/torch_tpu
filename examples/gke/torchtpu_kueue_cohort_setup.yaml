    cloud.google.com/gke-tpu-topology: 2x4x4
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: rf-64chip
spec:
  nodeLabels:
    cloud.google.com/gke-nodepool: <YOUR_64CHIP_NODEPOOL_NAME>
