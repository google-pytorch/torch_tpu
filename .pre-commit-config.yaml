repos:
  - repo: local
    hooks:
      # Regenerates docs/notebooks/NAME.ipynb when docs/NAME.md changes, and
      # all notebooks when pyproject.toml (which sets the version) changes.
      # The script skips docs not listed in NOTEBOOK_SOURCES in
      # tools/generate_doc_notebooks.py.
      - id: generate-doc-notebooks
        name: Generate docs notebooks with Jupytext
        language: python
        additional_dependencies: [jupytext==1.19.6]
        entry: tools/generate_doc_notebooks.py
        files: ^(docs/[^/]+\.md|pyproject\.toml)$
