syntax = "proto3";

package torch_tpu.precompiled_kernels.proto;

import "third_party/tensorflow/compiler/xla/xla_data.proto";

// Schema for precompiled TPU kernel bundles.
//
// A Bundle contains precompiled TPU executables along with their logical
// signatures and physical parameter bindings for a specific device architecture
// and PJRT platform version.
//
// Example: 2D Dynamic Elementwise Add (aten::add.out)
//
// Consider a precompiled kernel for binary addition of rank-2 tensors of shape
// [M, N] (F32) producing an output of shape [M, N] (F32):
//
//   Kernel {
//     op: "aten::add.out"
//     inputs: [
//       Tensor { dtype: F32, dims: [symbol: "m", symbol: "n"] },  // Tensor 0
//       (A) Tensor { dtype: F32, dims: [symbol: "m", symbol: "n"] }   // Tensor
//       1 (B)
//     ]
//     outputs: [
//       Tensor { dtype: F32, dims: [symbol: "m", symbol: "n"] }   // Tensor 2
//       (C)
//     ]
//     parameters: [
//       Parameter { role: INPUT,              tensor: 0 },  // Arg 0: buffer
//       for input A Parameter { role: INPUT,              tensor: 1 },  // Arg
//       1: buffer for input B Parameter { role: OUTPUT,             tensor: 2
//       },  // Arg 2: private buffer for output C Parameter { role:
//       RUNTIME_DIMENSIONS, tensor: 0 }   // Arg 3: [M, N] extents as S32[2]
//     ]
//     executable: <serialized PJRT executable bytes>
//   }
//
// Tensor Indexing Convention:
//   - Indices 0 .. inputs.size() - 1 refer to logical inputs.
//   - Indices inputs.size() .. inputs.size() + outputs.size() - 1 refer to
//     logical outputs.

// Symbols express equality across tensors; constants constrain specializations.
message Dimension {
  oneof extent {
    string symbol = 1;
    int64 size = 2;
  }
}

message Tensor {
  xla.PrimitiveType dtype = 1;
  repeated Dimension dims = 2;
}

// Tensor indices address logical inputs followed by logical outputs.
//
// Version-1 execution contract:
// - Tensor buffers are passed in parameters order.
// - OUTPUT parameters provide private output storage, which the corresponding
//   results must alias.
// - RUNTIME_DIMENSIONS parameters provide runtime dimensions as rank-length
//   s32 buffers.
message Parameter {
  enum Role {
    ROLE_UNSPECIFIED = 0;
    INPUT = 1;  // Borrow a caller buffer; never donate it.
    OUTPUT =
        2;  // Allocate private storage donated to the corresponding result.
    RUNTIME_DIMENSIONS = 3;  // Supply the tensor's extents as S32[rank].
  }
  Role role = 1;
  uint32 tensor = 2;
}

message Kernel {
  string op = 1;
  repeated Tensor inputs = 2;
  repeated Tensor outputs = 3;
  repeated Parameter parameters = 4;
  bytes executable = 5;
}

// One execution contract version and chip target for every executable in the
// bundle.
message Bundle {
  // Versions the bundle metadata and kernel execution contract: metadata
  // interpretation, parameter bindings and execution conventions.
  uint32 format_version = 1;

  // Precompiled kernel entries available in this bundle.
  repeated Kernel kernels = 2;

  // Target device hardware kind (e.g. "TPU v6e", "TPU v7").
  string device_kind = 3;

  // Exact PJRT platform version, including compiler and chip identity.
  string platform_version = 4;
}
