# TODO: b/431034055 - add build-system when OSS build working
[project]
name = "torch_tpu"
version = "0.1.1"
license = "Apache-2.0"
license-files = ["LICENSE"]

dependencies = [
    "torch==2.10.0+cpu",
    "numpy",
    "absl-py",
    "libtpu",
    "portpicker",
    "tensorboard",
    "frozendict",
    "immutabledict",
]

[project.optional-dependencies]
dev = [
    "accelerate",
    "etils[epath]",
    "expecttest",
    "jax >= 0.9.2",
    "transformers",
]

test = [
    "pillow",
    "scipy",
    "numpy",
    "timm",
    "torchvision",
    "transformers",
]

benchmark = [
    "fairscale",
    "flax",
    "grain",
    "llama-models",
    "tensorflow-datasets",
    "tensorboardX",
]

examples = [
    "datasets",
    "pillow",
    "tqdm",
    "huggingface_hub",
    "transformers",
    "diffusers",
    "peft",
    "torchvision",
    "llama_models",
    "fairscale",
    "grain",
    "tensorflow_datasets",
    "accelerate",
    "jax",
    "matplotlib",
    "tqdm",
    "flax",
    "tensorboardx",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
