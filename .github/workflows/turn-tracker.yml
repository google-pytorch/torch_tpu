name: Turn Tracker

"on":
  issues:
    types: [opened, reopened, transferred]
  issue_comment:
    types: [created]
  # `pull_request_target` grants a write token to label PRs from forks.
  # Safe because `actions/checkout` checks out the base branch, never PR code.
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: turn-tracker-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  track-turn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tracker script
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          ref: main
          sparse-checkout: tools
          persist-credentials: false
      - name: Process Turn State
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          ./tools/turn_tracker.py
