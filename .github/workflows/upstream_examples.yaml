# TODO(b/540442277): Migrate to run on nightly tests.

name: CI - Upstream PyTorch Examples

on:
  # Enable remote connections. Add a workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 7 * * *' # Run automatically every day at 0:00 AM PDT

permissions:
  contents: read
  pull-requests: read
  issues: read

# Cancel old jobs when they are replaced by new runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch
  cancel-in-progress: ${{ github.ref != 'main' }}

jobs:
  run_examples:
    name: "PyTorch examples on ${{ matrix.job_info.name || matrix.job_info.runner }}"
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci:upstream-tests')
    strategy:
      fail-fast: false
      matrix:
        job_info: [
          {
            name: "TPU v7",
            runner: "linux-x86-tpu7x-224-4tpu",
            config: "ci_tpu_v7",
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" --test_env=TORCH_TPU_INTERNAL_TORCH_EXAMPLES_DIR=$GITHUB_WORKSPACE/pytorch_examples --test_env=PYTHONPATH=$GITHUB_WORKSPACE/pytorch_examples',
            target: "//tests:run_upstream_example_regression_tpu //tests:run_upstream_example_fx_invert_tpu //tests:run_upstream_example_fx_module_tracer_tpu //tests:run_upstream_example_dcgan_tpu",
          },
          {
            name: "TPU v7(GAT)",
            runner: "linux-x86-tpu7x-224-4tpu",
            config: "ci_tpu_v7",
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" --test_env=TORCH_TPU_INTERNAL_TORCH_EXAMPLES_DIR=$GITHUB_WORKSPACE/pytorch_examples --test_env=PYTHONPATH=$GITHUB_WORKSPACE/pytorch_examples',
            target: "//tests:run_upstream_example_gat_tpu",
          },
          {
            name: "TPU v7 (MNIST)",
            runner: "linux-x86-tpu7x-224-4tpu",
            config: "ci_tpu_v7",
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" --test_env=TORCH_TPU_INTERNAL_TORCH_EXAMPLES_DIR=$GITHUB_WORKSPACE/pytorch_examples --test_env=PYTHONPATH=$GITHUB_WORKSPACE/pytorch_examples',
            target: "//tests:run_upstream_example_mnist_tpu //tests:run_upstream_example_mnist_forward_forward_tpu //tests:run_upstream_example_siamese_network_tpu //tests:run_upstream_example_vae_tpu",
          },
          {
            name: "TPU v7(bsds300)",
            runner: "linux-x86-tpu7x-224-4tpu",
            config: "ci_tpu_v7",
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" --test_env=TORCH_TPU_INTERNAL_TORCH_EXAMPLES_DIR=$GITHUB_WORKSPACE/pytorch_examples --test_env=PYTHONPATH=$GITHUB_WORKSPACE/pytorch_examples',
            target: "//tests:run_upstream_example_super_resolution_tpu",
          },
          {
            name: "TPU v7(imagenet)",
            runner: "linux-x86-tpu7x-224-4tpu",
            config: "ci_tpu_v7",
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" --test_env=TORCH_TPU_INTERNAL_TORCH_EXAMPLES_DIR=$GITHUB_WORKSPACE/pytorch_examples --test_env=PYTHONPATH=$GITHUB_WORKSPACE/pytorch_examples',
            target: "//tests:run_upstream_example_imagenet_tpu",
          },
          {
            name: "TPU v7(fast_neural_style)",
            runner: "linux-x86-tpu7x-224-4tpu",
            config: "ci_tpu_v7",
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" --test_env=TORCH_TPU_INTERNAL_TORCH_EXAMPLES_DIR=$GITHUB_WORKSPACE/pytorch_examples --test_env=PYTHONPATH=$GITHUB_WORKSPACE/pytorch_examples',
            target: "//tests:run_upstream_example_fast_neural_style_tpu",
          },
        ]
    # Use self-hosted runners. For a Linux runner, a corresponding container image used for the
    # workflow is required.
    # See go/ml-github-actions/getting_started/using_runners.md#supported-runner-scale-set.
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest"

    steps:
      - name: Checkout TorchTPU
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0

      # Enable remote connections. Add a waiting step.
      # See go/ml-github-actions:connect#add-waiting-step.
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}

      - name: Checkout PyTorch Examples
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0
        with:
          repository: pytorch/examples
          path: pytorch_examples

      - name: Run Bazel Test
        run: bazel test --config=${{ matrix.job_info.config }} ${{ matrix.job_info.extra_flags }} ${{ matrix.job_info.target }}
