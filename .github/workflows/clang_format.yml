# This workflow enforces the Google C++ Style Guide on all Pull Requests accoring to clang-format.
# It ensures that unformatted C++ code cannot be merged into the main branch.

name: Clang Format

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Cancel old jobs when a contributor pushes new commits to their PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'main' }}

jobs:
  run_clang_format:
    name: Clang format check
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR HEAD
        uses: actions/checkout@v5

      - name: Fetch PR Base Commit
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}

      # uv is a blazing-fast, single-binary replacement for pip, pipx, and virtualenv written in
      # Rust.
      # Modern Linux runners (Ubuntu 23.04+) enforce PEP 668 ("Externally Managed Environments").
      # This blocks standard 'pip install' commands from modifying the global system Python
      # interpreter to prevent OS instability. 'uv' natively works around this safely and cleanly by
      # utilizing fully isolated virtual environments under the hood.
      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true

      # Instead of installing 'nox' system-wide (which violates PEP 668), we use 'uvx' (uv's fast
      # tool-runner equivalent to pipx) to run it in a temporary, isolated sandbox environment
      # without touching or dirtying the host runner's global python paths.
      - name: Run Clang Format via Nox
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uvx nox -s lint
