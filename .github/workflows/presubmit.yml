name: CI - Presubmit

on:
  # Enable remote connections. Add a workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
      override_base_sha:
        description: 'Override Base SHA for bazel-diff (optional)'
        required: false
        type: string
      override_current_sha:
        description: 'Override Current SHA for bazel-diff (optional)'
        required: false
        type: string
      run_rbe_presubmit:
        description: 'Run the presubmit on RBE'
        required: false
        type: boolean
        default: false
      rbe_region:
        description: 'RBE region for the RBE presubmit'
        type: choice
        default: 'auto'
        options:
          - 'auto'
          - 'us-west1'
          - 'us-central1'
          - 'us-east1'
          - 'asia-southeast1'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  issues: read

# Cancel old jobs when they are replaced by new runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch. Note this must be
  # `github.ref_name`, not `github.ref`, which is `refs/heads/main` on main.
  # See https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#github-context for more details.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  run_tests:
    name: "Presubmit on ${{ matrix.job_info.name || matrix.job_info.runner }}"
    # Available self-hosted runners.
    strategy:
      fail-fast: false
      matrix:
        job_info: [
          {
            name: "CPU",
            runner: "linux-x86-n4-16",
            config: "ci_cpu_presubmit",
            extra_flags: "",
          },
          {
            runner: "linux-x86-ct5lp-224-8tpu",
            config: "ci_tpu_v5_presubmit",
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"',
          },
          # TODO(gunhyun): Re-enable once we have more quota.
          # {
          #   runner: "linux-x86-ct6e-180-8tpu",
          #   config: "ci_tpu_v6_presubmit",
          #   extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"',
          # },
          {
            runner: "linux-x86-tpu7x-224-4tpu",
            config: "ci_tpu_v7_presubmit",
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"',
          }
        ]
    # Use self-hosted runners. For a Linux runner, a corresponding container image used for the
    # workflow is required.
    # See go/ml-github-actions/getting_started/using_runners.md#supported-runner-scale-set.
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:30a9cf2ed330736957b3256dd3df69a13a556ae46626e9ad2ba205fa7a3c0051"  # Tag infrastructure-public-image-f0ac56f68949 (built 2026-09-21)
      # Disable ipc isolation to prevent shm limit issues.
      options: --ipc=host

    steps:
      # Clone the GitHub repository to runner's environment $GITHUB_WORKSPACE, making its files
      # accessible for workflow to use. Otherwise, the workflow cannot find the files (e.g. ls -lR
      # will return "total 0").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Keep the current commit's first parent fetchable
          # to resolve bazel-diff base SHA below.
          fetch-depth: 2

      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories:
      # https://github.blog/open-source/git/git-security-vulnerability-announced/#cve-2022-24765.
      # Tell Git explicitly to trust the workspace `/__w/torch_tpu/torch_tpu` inside this ephemeral
      # container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Enable remote connections. Add a waiting step.
      # See go/ml-github-actions:connect#add-waiting-step.
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run Impacted Tests via bazel-diff
        uses: ./.github/actions/bazel-diff
        with:
          base_sha: ${{ inputs.override_base_sha }}
          current_sha: ${{ inputs.override_current_sha || github.sha }}
          bazel_config: ${{ matrix.job_info.config }}
          extra_bazel_flags: ${{ matrix.job_info.extra_flags }}
          test_all: ${{ contains(github.event.pull_request.labels.*.name, 'ci:disable-bazel-diff') }}

  # Shadow run that doesn't gate submit. Runs on every same-repo PR, never on
  # fork PRs, and on workflow_dispatch only when `run_rbe_presubmit` is set.
  rbe_presubmit:
    name: "Presubmit on RBE"
    timeout-minutes: 120
    if: inputs.run_rbe_presubmit || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: linux-x86-n4-16
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:30a9cf2ed330736957b3256dd3df69a13a556ae46626e9ad2ba205fa7a3c0051"  # Tag infrastructure-public-image-f0ac56f68949 (built 2026-09-21)
      options: --ipc=host

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}

      - name: Select RBE Region
        id: rbe_region
        env:
          RBE_REGION: ${{ inputs.rbe_region || 'auto' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Set the RBE_CENTRAL1_PERCENT repo variable to 0 to keep every PR
          # in us-west1, e.g. during a us-central1 TPU stockout.
          CENTRAL1_PERCENT: ${{ vars.RBE_CENTRAL1_PERCENT || '50' }}
        run: |
          region="$RBE_REGION"
          if [[ "$region" == "auto" ]]; then
            if [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] && [[ "$CENTRAL1_PERCENT" =~ ^[0-9]+$ ]] && (( 10#$PR_NUMBER % 100 < 10#$CENTRAL1_PERCENT )); then
              region="us-central1"
            else
              region="us-west1"
            fi
          fi
          case "$region" in
            us-west1) flags="" ;;
            us-central1) flags="--config=rbe_central1_instance" ;;
            us-east1) flags="--config=rbe_east1_instance" ;;
            asia-southeast1) flags="--config=rbe_asia_se1_instance" ;;
            *)
              echo "Unsupported RBE region: $region" >&2
              exit 1
              ;;
          esac
          echo "Selected RBE region: $region (${flags:-default instance})"
          echo "extra_bazel_flags=$flags" >> "$GITHUB_OUTPUT"

      - name: Run Impacted Tests via bazel-diff
        uses: ./.github/actions/bazel-diff
        with:
          base_sha: ${{ inputs.override_base_sha }}
          current_sha: ${{ inputs.override_current_sha || github.sha }}
          bazel_config: "ci_rbe_presubmit"
          extra_bazel_flags: ${{ steps.rbe_region.outputs.extra_bazel_flags }}
          test_all: ${{ contains(github.event.pull_request.labels.*.name, 'ci:disable-bazel-diff') }}
