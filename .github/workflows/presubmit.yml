name: CI - Presubmit

on:
  # Enable remote connections. Add a workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  issues: read

# Cancel old jobs when they are replaced by new runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch
  cancel-in-progress: ${{ github.ref != 'main' }}

jobs:
  build_on_cpu:
    name: Build on CPU
    runs-on: "linux-x86-n2-16"
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest"
    steps:
      - uses: actions/checkout@v5

      - name: Build Targets and Populate Disk Cache
        run: |
          bazel build --config=ci_cpu --disk_cache=/tmp/bazel_disk_cache //...
          bazel build --config=ci_tpu --disk_cache=/tmp/bazel_disk_cache //...

      - name: Compress Bazel Disk Cache
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zstd || (apt-get update -qq && apt-get install -y --no-install-recommends zstd)
          echo "Compressing Bazel disk cache..."
          # ONLY tarball the disk cache binary blobs, NOT the Bazel install base
          tar -I 'zstd -T0 -1' -cf disk_cache.tar.zst -C /tmp bazel_disk_cache/

      - name: Upload Disk Cache Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazel-disk-cache
          path: disk_cache.tar.zst
          retention-days: 1 # Only needed to pass to the next job
          compression-level: 0 # Prevents GitHub from wasting CPU double-zipping the archive

  run_tests:
    name: "Presubmit on ${{ matrix.job_info.runner }}"
    needs: build_on_cpu
    strategy:
      fail-fast: false
      matrix:
        job_info: [
          {
            runner: "linux-x86-n2-16",
            config: "ci_cpu",
            extra_flags: "",
          },
          {
            runner: "linux-x86-ct5lp-224-8tpu",
            config: "ci_tpu",
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"',
          },
        ]
    # Use self-hosted runners. For a Linux runner, a corresponding container image used for the
    # workflow is required.
    # See go/ml-github-actions/getting_started/using_runners.md#supported-runner-scale-set.
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest"

    steps:
      # Clone the GitHub repository to runner's environment $GITHUB_WORKSPACE, making its files
      # accessible for workflow to use. Otherwise, the workflow cannot find the files (e.g. ls -lR
      # will return "total 0").
      - uses: actions/checkout@v5

      # Enable remote connections. Add a waiting step.
      # See go/ml-github-actions:connect#add-waiting-step.
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}

      # Download the pre-compiled bazel disk cache artifact
      - name: Download Disk Cache
        uses: actions/download-artifact@v4
        with:
          name: bazel-disk-cache
          path: .

      # Unpack the cache. 
      - name: Restore Bazel Disk Cache
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zstd || (apt-get update -qq && apt-get install -y --no-install-recommends zstd)
          echo "Extracting Bazel disk cache..."
          tar -I 'zstd -T0' -xf disk_cache.tar.zst -C /tmp

      # Run the test command, pointing it to the restored local disk cache.
      - name: Run Bazel Test
        run: |
          bazel test --config=${{ matrix.job_info.config }} ${{ matrix.job_info.extra_flags }} --disk_cache=/tmp/bazel_disk_cache //...