name: CI - Presubmit

on:
  # Enable remote connections. Add a workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
      override_base_sha:
        description: 'Override Base SHA for bazel-diff (optional)'
        required: false
        type: string
      override_current_sha:
        description: 'Override Current SHA for bazel-diff (optional)'
        required: false
        type: string
      run_rbe_presubmit:
        description: 'Run the presubmit on RBE'
        required: false
        type: boolean
        default: true
      rbe_region:
        description: 'RBE region for the RBE presubmit'
        type: choice
        default: 'auto'
        # TODO: b/567928058 - Re-add us-east1 and asia-southeast1 once they
        # have 4-chip v5e pools.
        options:
          - 'auto'
          - 'us-west1'
          - 'us-central1'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  issues: read

# Cancel old jobs when they are replaced by new runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch. Note this must be
  # `github.ref_name`, not `github.ref`, which is `refs/heads/main` on main.
  # See https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#github-context for more details.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  run_tests:
    name: "Presubmit on ${{ matrix.job_info.name || matrix.job_info.runner }}"
    # Available self-hosted runners.
    strategy:
      fail-fast: false
      matrix:
        job_info:
          - name: CPU
            runner: linux-x86-n4-16
            config: ci_cpu_presubmit
            extra_flags: ''
          - runner: linux-x86-ct5lp-224-8tpu
            config: ci_tpu_v5_presubmit
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"'
          # TODO(gunhyun): Re-enable once we have more quota.
          # - runner: linux-x86-ct6e-180-8tpu
          #   config: ci_tpu_v6_presubmit
          #   extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"'
          - runner: linux-x86-tpu7x-224-4tpu
            config: ci_tpu_v7_presubmit
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"'
    # Each call computes the diff for its own config on a CPU runner, then claims
    # `runner` only if that config selects an impacted test.
    uses: ./.github/workflows/presubmit_runner.yml
    with:
      runner: ${{ matrix.job_info.runner }}
      bazel_config: ${{ matrix.job_info.config }}
      extra_bazel_flags: ${{ matrix.job_info.extra_flags }}
      test_all: ${{ contains(github.event.pull_request.labels.*.name, 'ci:disable-bazel-diff') }}
      halt_for_connection: ${{ inputs.halt-for-connection }}
      base_sha: ${{ inputs.override_base_sha }}
      current_sha: ${{ inputs.override_current_sha || github.sha }}

  # Aggregator job checked by Copybara. `test` jobs are skipped on purpose when
  # a config selects no impacted test, and a skipped job cannot be told apart
  # from one skipped because `compute` failed or was cancelled. A reusable
  # workflow call, however, only ends in `success` when every job inside it
  # either succeeded or was skipped by its own `if:`, so gating on the calls'
  # aggregate result fails presubmit on any error without claiming a runner.
  # The newest-dependencies job must pass too; otherwise a failure there (e.g.
  # in //tests/api:tt_apis_test) doesn't block submission.
  # The RBE job and its self-hosted fallback are gated here rather than as
  # separate Copybara check runs so that a red RBE run does not block a merge
  # once the fallback has passed. A skipped RBE job on a fork PR or an
  # opted-out dispatch is still a pass.
  presubmit_tests_passed:
    name: "Presubmit"
    needs: [run_tests, tpu_v5_newest_deps, rbe_presubmit, rbe_tpu_v5_fallback]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check presubmit results
        env:
          RUN_TESTS_RESULT: ${{ needs.run_tests.result }}
          NEWEST_DEPS_RESULT: ${{ needs.tpu_v5_newest_deps.result }}
          RBE_EXPECTED: ${{ inputs.run_rbe_presubmit || github.event.pull_request.head.repo.full_name == github.repository }}
          RBE_RESULT: ${{ needs.rbe_presubmit.result }}
          RBE_FALLBACK_RESULT: ${{ needs.rbe_tpu_v5_fallback.result }}
        run: |
          echo "run_tests: ${RUN_TESTS_RESULT}"
          echo "tpu_v5_newest_deps: ${NEWEST_DEPS_RESULT}"
          echo "rbe_expected: ${RBE_EXPECTED}"
          echo "rbe_presubmit: ${RBE_RESULT}"
          echo "rbe_tpu_v5_fallback: ${RBE_FALLBACK_RESULT}"
          if [[ "${RUN_TESTS_RESULT}" != "success" ]]; then
            echo "::error::Presubmit did not succeed (result: ${RUN_TESTS_RESULT})"
            exit 1
          fi
          if [[ "${NEWEST_DEPS_RESULT}" != "success" ]]; then
            echo "::error::Presubmit on TPU v5 (newest deps) did not succeed (result: ${NEWEST_DEPS_RESULT})"
            exit 1
          fi
          if [[ "${RBE_FALLBACK_RESULT}" == "failure" || "${RBE_FALLBACK_RESULT}" == "cancelled" ]]; then
            echo "::error::Presubmit on RBE fallback did not succeed (result: ${RBE_FALLBACK_RESULT})"
            exit 1
          fi
          if [[ "${RBE_EXPECTED}" == "true" && "${RBE_RESULT}" != "success" && "${RBE_FALLBACK_RESULT}" != "success" ]]; then
            echo "::error::Presubmit on RBE did not succeed (rbe_presubmit: ${RBE_RESULT}, fallback: ${RBE_FALLBACK_RESULT})"
            exit 1
          fi

  # Runs CPU, single-chip, and 4-chip TPU v5e presubmit tests on RBE. Runs on
  # every same-repo PR, never on fork PRs, and on workflow_dispatch when
  # `run_rbe_presubmit` is set. Set the RBE_PRESUBMIT_ENABLED repo variable to
  # `false` during an RBE outage to skip RBE and run the fallback job instead.
  rbe_presubmit:
    name: "Presubmit on RBE"
    timeout-minutes: 120
    if: >-
      vars.RBE_PRESUBMIT_ENABLED != 'false' &&
      (inputs.run_rbe_presubmit || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: linux-x86-n4-16
    outputs:
      bazel_exit_code: ${{ steps.bazel_diff.outputs.exit_code }}
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:dddf008479144c57182b56a6d00bfc1f38f8f2ef206e2bc26ff6c0a401ded47e"  # Tag infrastructure-public-image-083516c6af6a (built 2026-10-13)
      options: --ipc=host

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}

      - name: Select RBE Region
        id: rbe_region
        shell: bash
        env:
          RBE_REGION: ${{ inputs.rbe_region || 'auto' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Set the RBE_CENTRAL1_PERCENT repo variable to 0 to keep every PR
          # in us-west1, e.g. during a us-central1 TPU stockout.
          CENTRAL1_PERCENT: ${{ vars.RBE_CENTRAL1_PERCENT || '50' }}
        run: |
          region="$RBE_REGION"
          if [[ "$region" == "auto" ]]; then
            if [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] && [[ "$CENTRAL1_PERCENT" =~ ^[0-9]+$ ]] && (( (10#$PR_NUMBER * 61) % 100 < 10#$CENTRAL1_PERCENT )); then
              region="us-central1"
            else
              region="us-west1"
            fi
          fi
          # Note: the us-central1 instance is named `default_instance` (created
          # before regional suffixes were added for west1, east1, and asia_se1).
          case "$region" in
            us-west1) instance="" ;;
            us-central1) instance="default_instance" ;;
            *)
              echo "Unsupported RBE region: $region" >&2
              exit 1
              ;;
          esac
          if [[ -n "$instance" ]]; then
            flags="--remote_executor=grpcs://${region}-remotebuildexecution.googleapis.com --remote_instance_name=projects/rbe-tpu-oss/instances/${instance} --//:_rbe_region=${region}"
          else
            flags=""
          fi
          echo "Selected RBE region: $region (${flags:-default instance})"
          echo "extra_bazel_flags=$flags" >> "$GITHUB_OUTPUT"

      - name: Run Impacted Tests via bazel-diff
        id: bazel_diff
        uses: ./.github/actions/bazel-diff
        with:
          base_sha: ${{ inputs.override_base_sha }}
          current_sha: ${{ inputs.override_current_sha || github.sha }}
          bazel_config: "ci_rbe_presubmit"
          extra_bazel_flags: ${{ steps.rbe_region.outputs.extra_bazel_flags }}
          test_all: ${{ contains(github.event.pull_request.labels.*.name, 'ci:disable-bazel-diff') }}

  # Runs the single-chip and 4-chip TPU v5e presubmit tests on the self-hosted
  # 8-chip runner only when RBE itself is unavailable: RBE was skipped by the
  # RBE_PRESUBMIT_ENABLED kill switch, timed out (which GitHub reports as
  # `cancelled`), or exited with one of these Bazel infrastructure codes
  # (https://bazel.build/run/scripts#exit-codes):
  #   34 REMOTE_ERROR: the remote executor or cache failed or was unreachable.
  #   36 LOCAL_ENVIRONMENTAL_ERROR: a local host or credential/environment error
  #      prevented Bazel from completing the RBE invocation.
  #   38 TRANSIENT_BUILD_EVENT_SERVICE_UPLOAD_ERROR: the ResultStore upload
  #      timed out.
  #   39 REMOTE_CACHE_EVICTED: remote cache errors that survived Bazel's own
  #      retries.
  #   45 PERSISTENT_BUILD_EVENT_SERVICE_UPLOAD_ERROR: the ResultStore backend
  #      rejected or dropped the upload.
  # A genuine build (1) or test (3) failure on RBE does not claim an 8-chip
  # runner. The exit code comes from Bazel only for the build and test commands
  # run_bazel_diff.py executes directly; a failure inside bazel-diff's own hash
  # generation exits with 1, so for an outage that breaks even `cquery` use the
  # RBE_PRESUBMIT_ENABLED kill switch.
  rbe_tpu_v5_fallback:
    name: "Presubmit on linux-x86-ct5lp-224-8tpu (RBE fallback)"
    needs: rbe_presubmit
    if: >-
      !cancelled() &&
      (inputs.run_rbe_presubmit || github.event.pull_request.head.repo.full_name == github.repository) && (
        needs.rbe_presubmit.result == 'skipped' ||
        needs.rbe_presubmit.result == 'cancelled' ||
        (needs.rbe_presubmit.result == 'failure' &&
         contains(fromJSON('["34", "36", "38", "39", "45"]'), needs.rbe_presubmit.outputs.bazel_exit_code))
      )
    uses: ./.github/workflows/presubmit_runner.yml
    with:
      runner: linux-x86-ct5lp-224-8tpu
      bazel_config: ci_tpu_v5_rbe_fallback
      extra_bazel_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"'
      test_all: ${{ contains(github.event.pull_request.labels.*.name, 'ci:disable-bazel-diff') }}
      halt_for_connection: ${{ inputs.halt-for-connection }}
      base_sha: ${{ inputs.override_base_sha }}
      current_sha: ${{ inputs.override_current_sha || github.sha }}

  # Runs the tests tagged `requires-newest-deps` (e.g. //tests/api:tt_apis_test,
  # since tests/api/tt_apis.yaml tracks the public APIs with the newest
  # supported dependencies) with those dependencies. The other jobs exclude
  # them.
  tpu_v5_newest_deps:
    name: "Presubmit on TPU v5 (newest deps)"
    runs-on: linux-x86-ct5lp-224-8tpu
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:30a9cf2ed330736957b3256dd3df69a13a556ae46626e9ad2ba205fa7a3c0051"  # Tag infrastructure-public-image-f0ac56f68949 (built 2026-09-21)
      options: --ipc=host

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}

      - name: Use newest dependencies lock
        run: cp requirements/requirements_3_14_latest.txt requirements/requirements_3_14.txt

      - name: Run tests that require the newest dependencies
        run: bazel test --config=ci_tpu_v5_newest_deps --run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" //...

      # E.g. the test outputs of tt_apis_test have the up-to-date tt_apis.yaml
      # and public_apis.md.
      - name: Upload Test Logs on Failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: bazel-testlogs-newest-deps
          path: bazel-testlogs/
          retention-days: 7
