# Publishes docs/developers/dashboard/ to
# https://google-pytorch.github.io/torch_tpu/developers/dashboard/ (and the site
# root) on every push to main that changes it, or on demand via "Run workflow".
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/developers/dashboard/**"
      - ".github/workflows/dashboard_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - run: |
          mkdir -p _site/developers
          cp -r docs/developers/dashboard _site/developers/
          cp -r docs/developers/dashboard/. _site/
      - uses: actions/upload-pages-artifact@0252fc4ba7626f0298f0cf00902a25c6afc77fa8  # v3.0.0
      - id: deployment
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e  # v4.0.0
