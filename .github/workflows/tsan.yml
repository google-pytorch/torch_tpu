name: ThreadSanitizer (TSan) Build and Test

on:
  # Enable remote connections. Add a workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 8 * * *'  # Run automatically every day at 1:00 AM PDT (8:00 AM UTC)

permissions:
  contents: read
  pull-requests: read
  issues: read

# Cancel old jobs when they are replaced by new runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch
  cancel-in-progress: ${{ github.ref != 'main' }}

jobs:
  run_tests:
    name: "TSan Build and Test on ${{ matrix.job_info.name || matrix.job_info.runner }}"
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci:tsan')
    strategy:
      matrix:
        job_info: [
          {
            name: "CPU",
            runner: "linux-x86-n4-16",
            config: "ci_cpu",
          }
        ]
    # Use self-hosted runners. For a Linux runner, a corresponding container image used for the
    # workflow is required.
    # See go/ml-github-actions/getting_started/using_runners.md#supported-runner-scale-set.
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest"
    steps:
      # Clone the GitHub repository to runner's environment $GITHUB_WORKSPACE, making its files
      # accessible for workflow to use. Otherwise, the workflow cannot find the files (e.g. ls -lR
      # will return "total 0").
      - uses: actions/checkout@v5

      # Enable remote connections. Add a waiting step.
      # See go/ml-github-actions:connect#add-waiting-step.
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}

      # C++ native binaries are compiled by Clang with the TSan runtime statically embedded.
      - name: Run C++ Tests (Static TSan)
        run: |
          bazel test //... \
            --config=${{ matrix.job_info.config }} \
            --config=tsan_cc \
            --test_lang_filters=cc

      # Python tests require the dynamic shared wrapper and the custom hermetic interpreter to
      # inject the TSan runtime globally before Python's dlopen hides the symbols.
      - name: Run Python Tests (Dynamic TSan + Hermetic Python)
        run: |
          bazel test //... \
            --config=${{ matrix.job_info.config }} \
            --config=tsan_py \
            --test_lang_filters=py \
            --run_under=//ci/configs:tsan_wrapper
