name: CI - Nightly on TPU

on:
  # Enable remote connections.
  # Step 1: Add a workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Stagger schedule to 15 past the hour to avoid contention with other nightly workflows.
    # Run once daily at 22:15 America/Los_Angeles.
    - cron: "15 22 * * *"
      timezone: "America/Los_Angeles"

permissions:
  contents: read
  pull-requests: read

# Cancel old jobs when they are replaced by new runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch. Note this must be
  # `github.ref_name`, not `github.ref`, which is `refs/heads/main` on main.
  # See https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#github-context for more details.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  run_tests:
    name: "Nightly on ${{ matrix.job_info.runner }} (Python ${{ matrix.job_info.python_version }})"
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci:tpu-nightly')
    # Available self-hosted runners.
    strategy:
      fail-fast: false
      matrix:
        # Keep TPU v5 python_version entries in sync with SUPPORTED_PYTHON_VERSIONS
        # in bazel/supported_python_versions.bzl.
        job_info: [
          {
            runner: "linux-x86-ct6e-180-8tpu",
            config: "ci_tpu_nightly",
            python_version: "3.14",
            container: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:30a9cf2ed330736957b3256dd3df69a13a556ae46626e9ad2ba205fa7a3c0051",  # Tag infrastructure-public-image-f0ac56f68949 (built 2026-09-21)
          },
          {
            runner: "linux-x86-ct5lp-224-8tpu",
            config: "ci_tpu_v5_nightly",
            python_version: "3.11",
            container: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:30a9cf2ed330736957b3256dd3df69a13a556ae46626e9ad2ba205fa7a3c0051",  # Tag infrastructure-public-image-f0ac56f68949 (built 2026-09-21)
          },
          {
            runner: "linux-x86-ct5lp-224-8tpu",
            config: "ci_tpu_v5_nightly",
            python_version: "3.12",
            container: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:30a9cf2ed330736957b3256dd3df69a13a556ae46626e9ad2ba205fa7a3c0051",  # Tag infrastructure-public-image-f0ac56f68949 (built 2026-09-21)
          },
          {
            runner: "linux-x86-ct5lp-224-8tpu",
            config: "ci_tpu_v5_nightly",
            python_version: "3.13",
            container: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:30a9cf2ed330736957b3256dd3df69a13a556ae46626e9ad2ba205fa7a3c0051",  # Tag infrastructure-public-image-f0ac56f68949 (built 2026-09-21)
          },
          {
            runner: "linux-x86-ct5lp-224-8tpu",
            config: "ci_tpu_v5_nightly",
            python_version: "3.14",
            container: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:30a9cf2ed330736957b3256dd3df69a13a556ae46626e9ad2ba205fa7a3c0051",  # Tag infrastructure-public-image-f0ac56f68949 (built 2026-09-21)
          },
          {
            runner: "linux-x86-ct5lp-224-8tpu",
            config: "ci_tpu_v5_nightly",
            python_version: "3.15",
            container: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:30a9cf2ed330736957b3256dd3df69a13a556ae46626e9ad2ba205fa7a3c0051",  # Tag infrastructure-public-image-f0ac56f68949 (built 2026-09-21)
          },
        ]
    # Use self-hosted runners. For a Linux runner, a corresponding container image used for the
    # workflow is required.
    # See go/ml-github-actions/getting_started/using_runners.md#supported-runner-scale-set.
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: ${{ matrix.job_info.container }}
      # Disable ipc isolation to prevent shm limit issues.
      options: --ipc=host
    steps:
      - run: echo "Start running tests."
      # Clone the GitHub repository to runner's environment $GITHUB_WORKSPACE, making its files
      # accessible for workflow to use. Otherwise, the workflow cannot find the files (e.g. ls -lR
      # will return "total 0").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Enable remote connections.
      # Step 2: Add a waiting step.
      # See go/ml-github-actions:connect#add-waiting-step.
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      # Split `bazel build` and `bazel test` into two invocations so `build`
      # compiles on RBE (tensorflow-testing) and `test` reads/writes cached
      # TestRunner results in ml-oss-rbe-testing.
      - name: Run Bazel tests
        run: |
          # Tests tagged with `manual` are dropped. Only using config `${{ matrix.job_info.config }}`
          # and flag `--test_tag_filters` to get tests tagged with `nonightly` is not enough as
          # there are some tests implicitly getting the `manual` tag from `notap` or `nolocal`.
          TEST_TARGETS=$(bazel query 'tests(//...) except attr("tags", "nonightly", tests(//...))' | tr '\n' ' ')
          # TEST_TARGETS is a space-separated target list that must word-split,
          # and this runs under `sh`, so a bash array is not an option.
          # shellcheck disable=SC2086
          bazel build \
            --config="${{ matrix.job_info.config }}" \
            --repo_env=HERMETIC_PYTHON_VERSION="${{ matrix.job_info.python_version }}" \
            --run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" \
            ${TEST_TARGETS}
          # shellcheck disable=SC2086
          bazel test \
            --config="${{ matrix.job_info.config }}" \
            --repo_env=HERMETIC_PYTHON_VERSION="${{ matrix.job_info.python_version }}" \
            --run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" \
            ${TEST_TARGETS}

# TODO(b/558939987): consider re-enabling failure notifications
# once OSS builds stabilize.
