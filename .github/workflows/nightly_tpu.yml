name: CI - Nightly on TPU

on:
  # Enable remote connections.
  # Step 1: Add a workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Stagger schedule to 45 past the hour to avoid contention with other 4-hour workflows.
    # Run every 4 hours every day. Scheduled workflows run in UTC by default.
    - cron: "45 */4 * * *"

permissions:
  contents: read
  pull-requests: read

# Cancel old jobs when they are replaced by new runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch
  cancel-in-progress: ${{ github.ref != 'main' }}

jobs:
  run_tests:
    name: "Nightly on ${{ matrix.job_info.name || matrix.job_info.runner }}"
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci:tpu-nightly')
    # Available self-hosted runners.
    strategy:
      matrix:
        job_info: [
          {
            runner: "linux-x86-ct6e-180-8tpu",
            container: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:480f397c57207671315a27173ccec790ea9c66ef030af96cbe6ac9b4a6613996",  # Tag infrastructure-public-image-2c74567ee8e0
          }
        ]
    # Use self-hosted runners. For a Linux runner, a corresponding container image used for the
    # workflow is required.
    # See go/ml-github-actions/getting_started/using_runners.md#supported-runner-scale-set.
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: ${{ matrix.job_info.container }}
      # Disable ipc isolation to prevent shm limit issues.
      options: --ipc=host
    steps:
      - run: echo "Start running tests."
      # Clone the GitHub repository to runner's environment $GITHUB_WORKSPACE, making its files
      # accessible for workflow to use. Otherwise, the workflow cannot find the files (e.g. ls -lR
      # will return "total 0").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Enable remote connections.
      # Step 2: Add a waiting step.
      # See go/ml-github-actions:connect#add-waiting-step.
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      # We don't need a separate step for bazel build as bazel test will also build the code before
      # running the tests. This allows test building and test running to overlap and reduce total
      # build time.
      - name: Run Bazel tests
        run: |
          # Tests tagged with `manual` are dropped. Only using config `ci_tpu_nightly` and flag
          # `--test_tag_filters` to get tests tagged with `nonightly` is not enough as there are
          # some tests implicitly getting the `manual` tag from `notap` or `nolocal`.
          TEST_TARGETS=$(bazel query 'tests(//...) except attr("tags", "nonightly", tests(//...))' | tr '\n' ' ')
          bazel test --config=ci_tpu_nightly --run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" ${TEST_TARGETS}

# TODO(b/558939987): consider re-enabling failure notifications
# once OSS builds stabilize.
