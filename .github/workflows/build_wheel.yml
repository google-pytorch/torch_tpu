name: Build and Test Wheels

on:
  # Enable remote connections for workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: "Should this workflow run wait for a remote connection?"
        type: choice
        default: "no"
        options:
          - "yes"
          - "no"
      override_base_sha:
        description: 'Override Base SHA for bazel-diff (optional)'
        required: false
        type: string
      override_current_sha:
        description: 'Override Current SHA for bazel-diff (optional)'
        required: false
        type: string
  push:
    branches:
      - main
  # No base-branch filter: `branches:` matches the PR *base*, and stacked
  # pull requests target the layer below them, not main.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Prevent "overly broad permissions" Zizmor finding.
permissions:
  contents: read

# Cancel old jobs when they are replaced by new runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch
  cancel-in-progress: ${{ github.ref != 'main' }}

jobs:
  setup:
    name: "Set up Matrix"
    runs-on: ubuntu-latest
    outputs:
      # Keep cpu_versions and latest_python_version in sync with
      # bazel/supported_python_versions.bzl.
      cpu_versions: '["3.11", "3.12", "3.13", "3.14"]'
      tpu_versions: ${{ steps.set.outputs.tpu_versions }}
      default_python_version: "3.12"
      latest_python_version: "3.14"
    steps:
      - id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          HAS_TPU_NIGHTLY_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'tpu-nightly') }}
          HAS_RUN_ALL_VERSIONS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:run_all_versions') }}
          HAS_POSTSUBMIT_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:postsubmit') }}
        run: |
          DEFAULT_VER="3.12"
          TPU_VERS="[\"${DEFAULT_VER}\"]"
          if [[ "${EVENT_NAME}" == "schedule" ]] || \
             [[ "${EVENT_NAME}" == "push" ]] || \
             [[ "${HAS_TPU_NIGHTLY_LABEL}" == "true" ]] || \
             [[ "${HAS_RUN_ALL_VERSIONS_LABEL}" == "true" ]] || \
             [[ "${HAS_POSTSUBMIT_LABEL}" == "true" ]]; then
            TPU_VERS='["3.11", "3.12", "3.13", "3.14"]'
          fi
          echo "tpu_versions=${TPU_VERS}" >> $GITHUB_OUTPUT

  # TODO(pganssle): Migrate to cibuildwheel
  build_wheels:
    needs: setup
    name: "Build wheel on ${{ matrix.job_info.name || matrix.job_info.runner }} (Python ${{ matrix.python_version }})"
    strategy:
      matrix:
        job_info:
          [
            {
              name: "CPU",
              runner: "linux-x86-n4-16",
              container: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:480f397c57207671315a27173ccec790ea9c66ef030af96cbe6ac9b4a6613996",  # Tag infrastructure-public-image-2c74567ee8e0
            },
          ]
        python_version: ${{ fromJSON(needs.setup.outputs.cpu_versions) }}
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: ${{ matrix.job_info.container }}
    outputs:
      gcs_wheel_path: ${{ steps.build.outputs.gcs_wheel_path }}
      gcs_wheel_dir: ${{ steps.build.outputs.gcs_wheel_dir }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - name: Build and upload wheel
        id: build
        uses: ./.github/actions/build-wheel
        with:
          python_version: ${{ matrix.python_version }}
          # The oldest Python version builds the release wheel flavor (no
          # PyTorch-nightly glue), so both flavors are exercised in
          # presubmit; the nightly smoke tests only run against the default
          # Python's wheel, which keeps the nightly glue. Spelled as the raw
          # flag rather than --config=wheel_release: the shared script
          # already applies wheel_common, which wheel_release would expand a
          # second time (see the extra_bazel_args input).
          extra_bazel_args: ${{ matrix.python_version == '3.11' && '--//:include_nightly_glue=False' || '' }}

  test_wheels_cpu:
    name: "Test wheel on ${{ matrix.custom_name || 'CPU' }} (Python ${{ matrix.python_version }})"
    needs: [build_wheels, setup]
    strategy:
      # The postsubmit nightly variant below is a drift detector against the
      # latest PyTorch nightly, so it is expected to fail from time to time.
      # Let the rest of the matrix finish rather than cancelling every other
      # Python version's coverage along with it.
      fail-fast: false
      matrix:
        python_version: ${{ fromJSON(needs.setup.outputs.cpu_versions) }}
        wheel_version: ["standard"]
        include:
          - wheel_version: "standard"
            runner: linux-x86-n4-16
            config: "wheel_test_cpu"
            extra_flags: ""
          - python_version: ${{ needs.setup.outputs.default_python_version }}
            wheel_version: "cuda"
            custom_name: "CPU (CUDA wheel)"
            runner: linux-x86-n4-16
            nox_smoke_test: "cpu-cuda"
          - python_version: ${{ needs.setup.outputs.default_python_version }}
            wheel_version: "nightly"
            custom_name: "CPU (PyTorch Nightly)"
            runner: linux-x86-n4-16
            # Presubmit installs the exact nightly snapshot the wheel's
            # nightly glue was built against (requirements/
            # requirements_torch_nightly.txt), so the check is deterministic
            # and gates hard. Postsubmit installs the *latest* nightly, which
            # can drift ABI-incompatibly from that snapshot -- a failure
            # there is the signal to refresh the lock.
            nox_smoke_test: ${{ github.event_name == 'pull_request' && 'cpu-nightly-pinned' || 'cpu-nightly' }}
    runs-on: ${{ matrix.runner }}
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:480f397c57207671315a27173ccec790ea9c66ef030af96cbe6ac9b4a6613996  # Tag infrastructure-public-image-2c74567ee8e0
      options: --privileged
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          # Keep the current commit's first parent fetchable
          # to resolve bazel-diff base SHA below.
          fetch-depth: 2
      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories:
      # https://github.blog/open-source/git/git-security-vulnerability-announced/#cve-2022-24765.
      # Tell Git explicitly to trust the workspace `/__w/torch_tpu/torch_tpu` inside this ephemeral
      # container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download Wheel from GCS
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          GCS_WHEEL_DIR: ${{ needs.build_wheels.outputs.gcs_wheel_dir }}
        run: |
          mkdir dist
          PYTHON_VER_CLEAN=$(echo "${PYTHON_VERSION}" | tr -d '.')
          gcloud storage cp "${GCS_WHEEL_DIR}*cp${PYTHON_VER_CLEAN}*.whl" dist/
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      # For the alternate-torch wheel variants (CUDA, nightly), run a trimmed-
      # down smoke test instead of the bazel test suite: nox installs the built
      # wheel and the torch variant in a single uv resolution, then checks that
      # the backend autoloads.
      - name: Run smoke tests via nox
        if: matrix.nox_smoke_test
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          NOX_SMOKE_TEST: ${{ matrix.nox_smoke_test }}
        run: uvx nox --force-python "${PYTHON_VERSION}" -s "smoke_test(${NOX_SMOKE_TEST})"
      # Diff against the current commit's first parent, i.e. main branch tip at CI run time.
      # Intentionally do not use `github.event.pull_request.base.sha` as it is snapshotted upon
      # PR creation. See https://github.com/orgs/community/discussions/59677 for more details.
      - name: Resolve bazel-diff Base SHA
        id: resolve_bazel_diff_base_sha
        if: github.event_name == 'pull_request'
        run: |
          base="$(git rev-parse --verify "${GITHUB_SHA}^1")"
          echo "sha=${base}" >> "$GITHUB_OUTPUT"
      - name: Run Impacted Tests via bazel-diff
        if: ${{ !matrix.nox_smoke_test }}
        uses: ./.github/actions/bazel-diff
        with:
          base_sha: ${{ inputs.override_base_sha || steps.resolve_bazel_diff_base_sha.outputs.sha }}
          current_sha: ${{ inputs.override_current_sha || github.sha }}
          bazel_config: ${{ matrix.config }}
          extra_bazel_flags: ${{ matrix.extra_flags }} --repo_env=HERMETIC_PYTHON_VERSION=${{ matrix.python_version }} --define PYTHON_VERSION=${{ matrix.python_version }}
          disable_bazel_diff: ${{ contains(github.event.pull_request.labels.*.name, 'ci:disable-bazel-diff') }}

  # Confirm each intermediate PyTorch patch (one we ship no exact glue for) is
  # served by its same-minor glue: the nox session runs the CPU smoke tests
  # once per entry in INTERMEDIATE_PATCH_VERSIONS (bazel/pytorch_versions.bzl),
  # all within this single job. Nothing here is TPU-specific, so it runs on a
  # CPU runner against the default Python.
  test_wheel_intermediate_patches:
    name: "Test wheel on intermediate PyTorch patches (Python ${{ needs.setup.outputs.default_python_version }})"
    needs: [build_wheels, setup]
    runs-on: linux-x86-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:480f397c57207671315a27173ccec790ea9c66ef030af96cbe6ac9b4a6613996  # Tag infrastructure-public-image-2c74567ee8e0
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories:
      # https://github.blog/open-source/git/git-security-vulnerability-announced/#cve-2022-24765.
      # Tell Git explicitly to trust the workspace `/__w/torch_tpu/torch_tpu` inside this ephemeral
      # container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download Wheel from GCS
        env:
          PYTHON_VERSION: ${{ needs.setup.outputs.default_python_version }}
          GCS_WHEEL_DIR: ${{ needs.build_wheels.outputs.gcs_wheel_dir }}
        run: |
          mkdir dist
          PYTHON_VER_CLEAN=$(echo "${PYTHON_VERSION}" | tr -d '.')
          gcloud storage cp "${GCS_WHEEL_DIR}*cp${PYTHON_VER_CLEAN}*.whl" dist/
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run smoke tests against intermediate patches via nox
        env:
          PYTHON_VERSION: ${{ needs.setup.outputs.default_python_version }}
        run: uvx nox --force-python "${PYTHON_VERSION}" -s intermediate_patch_abi

  test_wheel_dep_upper_bounds:
    name: "Test wheel on dep upper bounds (Python ${{ needs.setup.outputs.latest_python_version }})"
    needs: [build_wheels, setup]
    runs-on: linux-x86-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:480f397c57207671315a27173ccec790ea9c66ef030af96cbe6ac9b4a6613996  # Tag infrastructure-public-image-2c74567ee8e0
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories:
      # https://github.blog/open-source/git/git-security-vulnerability-announced/#cve-2022-24765.
      # Tell Git explicitly to trust the workspace `/__w/torch_tpu/torch_tpu` inside this ephemeral
      # container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download Wheel from GCS
        env:
          PYTHON_VERSION: ${{ needs.setup.outputs.latest_python_version }}
          GCS_WHEEL_DIR: ${{ needs.build_wheels.outputs.gcs_wheel_dir }}
        run: |
          mkdir dist
          PYTHON_VER_CLEAN=$(echo "${PYTHON_VERSION}" | tr -d '.')
          gcloud storage cp "${GCS_WHEEL_DIR}*cp${PYTHON_VER_CLEAN}*.whl" dist/
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run smoke tests against upper bounds via nox
        env:
          PYTHON_VERSION: ${{ needs.setup.outputs.latest_python_version }}
        run: uvx nox --force-python "${PYTHON_VERSION}" -s dep_upper_bounds

  test_wheels_tpu:
    name: Test wheel on ${{ matrix.custom_name || 'TPU' }} (Python ${{ matrix.python_version }})
    needs: [build_wheels, setup]
    strategy:
      matrix:
        python_version: ${{ fromJSON(needs.setup.outputs.tpu_versions) }}
        wheel_version: ["standard", "v7"]
        include:
          # v7 1-Chip: Run Nox smoke tests on single-chip v7 and skip Bazel test suite.
          # v7 4-Chip: Run Nox smoke tests and full Bazel test suite.
          - wheel_version: "standard"
            runner: linux-x86-tpu7x-56-1tpu
            custom_name: "TPU v7 1-Chip"
          - wheel_version: "v7"
            runner: linux-x86-tpu7x-224-4tpu
            config: "wheel_test_tpu_v7"
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"'
            custom_name: "TPU v7"
    runs-on: ${{ matrix.runner || 'linux-x86-tpu7x-56-1tpu' }}
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:480f397c57207671315a27173ccec790ea9c66ef030af96cbe6ac9b4a6613996  # Tag infrastructure-public-image-2c74567ee8e0
      options: --privileged
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          # Keep the current commit's first parent fetchable
          # to resolve bazel-diff base SHA below.
          fetch-depth: 2
      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories:
      # https://github.blog/open-source/git/git-security-vulnerability-announced/#cve-2022-24765.
      # Tell Git explicitly to trust the workspace `/__w/torch_tpu/torch_tpu` inside this ephemeral
      # container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download Wheel from GCS
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          GCS_WHEEL_DIR: ${{ needs.build_wheels.outputs.gcs_wheel_dir }}
        run: |
          mkdir dist
          PYTHON_VER_CLEAN=$(echo "${PYTHON_VERSION}" | tr -d '.')
          gcloud storage cp "${GCS_WHEEL_DIR}*cp${PYTHON_VER_CLEAN}*.whl" dist/
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      # TODO(b/541808039): Refactor this file to consolidate build/test loops and optimize the
      # dependency graph (e.g., start tests as soon as their specific wheel finishes building).
      #
      # Unlike the bazel suite below (which runs from source), this exercises
      # the wheel exactly as users consume it: nox installs the built wheel
      # plus a pip torch in one uv resolution, then runs the TPU smoke tests
      # (autoload, execution modes, and a sync test that compiles) against the
      # versioned-glue dispatch on a real TPU.
      - name: Run smoke tests via nox
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
        run: uvx nox --force-python "${PYTHON_VERSION}" -s "smoke_test(tpu-cpu)"
      # Diff against the current commit's first parent, i.e. main branch tip at CI run time.
      # Intentionally do not use `github.event.pull_request.base.sha` as it is snapshotted upon
      # PR creation. See https://github.com/orgs/community/discussions/59677 for more details.
      - name: Resolve bazel-diff Base SHA
        id: resolve_bazel_diff_base_sha
        if: github.event_name == 'pull_request'
        run: |
          base="$(git rev-parse --verify "${GITHUB_SHA}^1")"
          echo "sha=${base}" >> "$GITHUB_OUTPUT"
      - name: Run Impacted Tests via bazel-diff
        if: matrix.config
        uses: ./.github/actions/bazel-diff
        with:
          base_sha: ${{ inputs.override_base_sha || steps.resolve_bazel_diff_base_sha.outputs.sha }}
          current_sha: ${{ inputs.override_current_sha || github.sha }}
          bazel_config: ${{ matrix.config }}
          extra_bazel_flags: ${{ matrix.extra_flags || '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"' }} --repo_env=HERMETIC_PYTHON_VERSION=${{ matrix.python_version }} --define PYTHON_VERSION=${{ matrix.python_version }}
          disable_bazel_diff: ${{ contains(github.event.pull_request.labels.*.name, 'ci:disable-bazel-diff') }}

  # Smoke-test the nightly glue on TPU: nox installs the built wheel plus a
  # PyTorch nightly in a single uv resolution and checks that the backend
  # autoloads. Presubmit installs the exact snapshot the glue was built
  # against (requirements/requirements_torch_nightly.txt), so the check is
  # deterministic and gates hard. Postsubmit installs the *latest* nightly,
  # which can drift ABI-incompatibly from that snapshot between lock
  # refreshes -- a failure there is the signal to refresh the lock, without
  # ever blocking presubmit on drift.
  test_wheel_tpu_nightly:
    name: "Test wheel on TPU v7 (PyTorch Nightly) (Python ${{ needs.setup.outputs.default_python_version }})"
    needs: [build_wheels, setup]
    runs-on: linux-x86-tpu7x-56-1tpu
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:480f397c57207671315a27173ccec790ea9c66ef030af96cbe6ac9b4a6613996  # Tag infrastructure-public-image-2c74567ee8e0
      options: --privileged
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories:
      # https://github.blog/open-source/git/git-security-vulnerability-announced/#cve-2022-24765.
      # Tell Git explicitly to trust the workspace `/__w/torch_tpu/torch_tpu` inside this ephemeral
      # container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download Wheel from GCS
        env:
          PYTHON_VERSION: ${{ needs.setup.outputs.default_python_version }}
          GCS_WHEEL_DIR: ${{ needs.build_wheels.outputs.gcs_wheel_dir }}
        run: |
          mkdir dist
          PYTHON_VER_CLEAN=$(echo "${PYTHON_VERSION}" | tr -d '.')
          gcloud storage cp "${GCS_WHEEL_DIR}*cp${PYTHON_VER_CLEAN}*.whl" dist/
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run the nightly smoke test via nox
        env:
          PYTHON_VERSION: ${{ needs.setup.outputs.default_python_version }}
          NOX_SMOKE_TEST: ${{ github.event_name == 'pull_request' && 'tpu-nightly-pinned' || 'tpu-nightly' }}
        run: uvx nox --force-python "${PYTHON_VERSION}" -s "smoke_test(${NOX_SMOKE_TEST})"
