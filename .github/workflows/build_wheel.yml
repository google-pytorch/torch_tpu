name: Build and Test Wheels

on:
  # Enable remote connections for workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: "Should this workflow run wait for a remote connection?"
        type: choice
        default: "no"
        options:
          - "yes"
          - "no"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 9 * * *' # 1 AM PST

# Cancel old jobs when they are replaced by new runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch
  cancel-in-progress: ${{ github.ref != 'main' }}


jobs:
  # TODO(pganssle): Migrate to cibuildwheel
  build_wheels:
    name: "Build wheel on linux-x86-n2-16${{ (matrix.mode != 'presubmit' && format(' ({0})', matrix.mode)) || '' }}"
    strategy:
      matrix:
        mode: ${{ github.event_name == 'schedule' && fromJSON('["nightly", "local_torch"]') || fromJSON('["presubmit"]') }}
    # Use self-hosted runners. For a Linux runner, a corresponding container image used for the
    # workflow is required.
    # See go/ml-github-actions/getting_started/using_runners.md#supported-runner-scale-set.
    runs-on: linux-x86-n2-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
    env:
      WHEEL_DIR: dist
    outputs:
      gcs_path: ${{ steps.vars.outputs.gcs_path }}
      mode: ${{ matrix.mode }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - id: vars
        run: echo "gcs_path=gs://torch-tpu-ci-transient/artifacts/${{ github.workflow }}/${{ github.run_number }}/${{ github.run_attempt }}" >> $GITHUB_OUTPUT
      - name: Build wheel
        run: |
          mkdir -p $WHEEL_DIR
          EXTRA_BAZEL_FLAGS=""

          if [[ ${{ matrix.mode }} == 'local_torch' ]]; then
            # pull nightly pytoch Wheel
            pip download --pre torch \
              --index-url https://download.pytorch.org/whl/nightly/cpu \
              -d $WHEEL_DIR
            EXTRA_BAZEL_FLAGS="--define TORCH_SOURCE=local \
              --repo_env=TORCH_SOURCE=$WHEEL_DIR/torch-*.whl"
          fi

          bazel build \
            --config=remote_caching_readonly \
            --config=remote_execution_readonly \
            //ci/wheel:torch_tpu_wheel \
            --define WHEEL_VERSION_EXTRAS=.dev$(date +%Y%m%d%H%M%S) $EXTRA_BAZEL_FLAGS

          cp bazel-bin/ci/wheel/torch_tpu-*.whl $WHEEL_DIR

      - name: Upload wheel to GCS for wheel testing
        run:  gcloud storage cp -r "$(pwd)/$WHEEL_DIR/*.whl" "gs://torch-tpu-ci-transient/artifacts/${{ github.workflow }}/${{ github.run_number }}/${{ github.run_attempt }}/${{ matrix.mode }}/"
      - name: Upload to Artifact Registry
        # Run only on main branch, once a day.
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && matrix.mode == 'nightly'
        shell: bash
        run: |
          # Install package needed to authenticate to artifactregistry for Python.
          # See https://cloud.google.com/artifact-registry/docs/python/authentication
          pip install keyrings.google-artifactregistry-auth

          # Configure pypirc for twine upload.
          pypirc_content=$(cat <<EOF
          [distutils]
          index-servers =
              torch-tpu-testing-repo

          [torch-tpu-testing-repo]
          repository = https://us-python.pkg.dev/ml-oss-artifacts-transient/torch-tpu-testing-registry/
          EOF
          )
          echo "$pypirc_content" > "$HOME"/.pypirc

          python3 -m twine upload --repository-url https://us-python.pkg.dev/ml-oss-artifacts-transient/torch-tpu-testing-registry $WHEEL_DIR/torch_tpu-*.whl

  test_wheels:
    name: "Test wheel on ${{ matrix.runner }}${{ (matrix.mode != 'presubmit' && format(' ({0})', matrix.mode)) || '' }}"
    needs: build_wheels
    strategy:
      matrix:
        mode: ${{ github.event_name == 'schedule' && fromJSON('["nightly", "local_torch"]') || fromJSON('["presubmit"]') }}
        runner: [linux-x86-n2-16, linux-x86-ct5lp-224-8tpu]
        include:
          - runner: linux-x86-n2-16
            extra_flags: "--config=wheel_test_cpu"
          - runner: linux-x86-ct5lp-224-8tpu
            extra_flags: '--config=wheel_test_tpu --run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"'
    runs-on: ${{ matrix.runner }}
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
      options: --privileged
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v5
      - name: Download Wheel from GCS
        run: |
          mkdir dist
          gcloud storage cp "${{ needs.build_wheels.outputs.gcs_path }}/${{ matrix.mode }}/*.whl" dist/
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@7f5ca0c263a81ed09ea276524c1b9192f1304e3c
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run tests
        shell: bash
        run: |
          EXTRA_BAZEL_FLAGS=""
          if [[ ${{ matrix.mode }} == 'local_torch' ]]; then
            EXTRA_BAZEL_FLAGS="--define TORCH_SOURCE=local \
              --repo_env=TORCH_SOURCE=dist/torch-*.whl"
          fi
          bazel test ${{ matrix.extra_flags }} $EXTRA_BAZEL_FLAGS //...
