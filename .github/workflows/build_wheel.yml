name: Build and Test Wheels

on:
  # Enable remote connections for workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: "Should this workflow run wait for a remote connection?"
        type: choice
        default: "no"
        options:
          - "yes"
          - "no"
      override_base_sha:
        description: 'Override Base SHA for bazel-diff (optional)'
        required: false
        type: string
      override_current_sha:
        description: 'Override Current SHA for bazel-diff (optional)'
        required: false
        type: string
  push:
    branches:
      - main
  # No base-branch filter: `branches:` matches the PR *base*, and stacked
  # pull requests target the layer below them, not main.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Prevent "overly broad permissions" Zizmor finding.
permissions:
  contents: read

# Cancel old jobs when they are replaced by new runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch. Note this must be
  # `github.ref_name`, not `github.ref`, which is `refs/heads/main` on main.
  # See https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#github-context for more details.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  setup:
    name: "Set up Matrix"
    runs-on: ubuntu-latest
    outputs:
      # Keep cpu_versions and latest_python_version in sync with
      # bazel/supported_python_versions.bzl.
      cpu_versions: ${{ steps.set.outputs.cpu_versions }}
      tpu_versions: ${{ steps.set.outputs.tpu_versions }}
      default_python_version: "3.14"
      latest_python_version: "3.14"
      should_build: ${{ steps.check_diff.outputs.should_build }}
      is_release_branch: ${{ startsWith(github.base_ref, 'release/') || startsWith(github.ref_name, 'release/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Keep the current commit's first parent fetchable
          # to resolve the base branch tip at CI runtime.
          fetch-depth: 2
      - name: Inspect PR diff for wheel-affecting changes
        id: check_diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ inputs.override_base_sha }}
          HEAD_SHA: ${{ inputs.override_current_sha || github.sha }}
          FORCE_BUILD: ${{ contains(github.event.pull_request.labels.*.name, 'ci:force-wheel-build') || contains(github.event.pull_request.labels.*.name, 'ci:disable-bazel-diff') }}
        run: ci/check_wheel_diff.sh
      - id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          HAS_TPU_NIGHTLY_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'tpu-nightly') }}
          HAS_RUN_ALL_VERSIONS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:run_all_versions') }}
          HAS_POSTSUBMIT_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:postsubmit') }}
        run: |
          DEFAULT_VER="3.14"
          CPU_VERS='["3.11", "3.14"]'
          TPU_VERS="[\"${DEFAULT_VER}\"]"
          if [[ "${EVENT_NAME}" == "schedule" ]] || \
             [[ "${EVENT_NAME}" == "push" ]] || \
             [[ "${HAS_TPU_NIGHTLY_LABEL}" == "true" ]] || \
             [[ "${HAS_RUN_ALL_VERSIONS_LABEL}" == "true" ]] || \
             [[ "${HAS_POSTSUBMIT_LABEL}" == "true" ]]; then
            CPU_VERS='["3.11", "3.12", "3.13", "3.14", "3.14t"]'
            TPU_VERS='["3.11", "3.12", "3.13", "3.14", "3.14t"]'
          fi
          echo "cpu_versions=${CPU_VERS}" >> "$GITHUB_OUTPUT"
          echo "tpu_versions=${TPU_VERS}" >> "$GITHUB_OUTPUT"

  # TODO(pganssle): Migrate to cibuildwheel
  build_wheels:
    needs: setup
    if: needs.setup.outputs.should_build == 'true'
    name: "Build wheel on ${{ matrix.job_info.name || matrix.job_info.runner }} (Python ${{ matrix.python_version }})"
    strategy:
      matrix:
        job_info:
          [
            {
              name: "CPU",
              runner: "linux-x86-n4-16",
              container: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:dddf008479144c57182b56a6d00bfc1f38f8f2ef206e2bc26ff6c0a401ded47e",  # Tag infrastructure-public-image-083516c6af6a (built 2026-10-13)
            },
          ]
        python_version: ${{ fromJSON(needs.setup.outputs.cpu_versions) }}
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: ${{ matrix.job_info.container }}
    outputs:
      gcs_wheel_path: ${{ steps.build.outputs.gcs_wheel_path }}
      gcs_wheel_dir: ${{ steps.build.outputs.gcs_wheel_dir }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build and upload wheel
        id: build
        uses: ./.github/actions/build-wheel
        with:
          python_version: ${{ matrix.python_version }}
          # The oldest Python version builds the release wheel flavor (no
          # PyTorch-nightly glue), so both flavors are exercised in
          # presubmit; the nightly smoke tests only run against the default
          # Python's wheel, which keeps the nightly glue. Release branches
          # build every wheel in release config.
          extra_bazel_args: ${{ (needs.setup.outputs.is_release_branch == 'true' || matrix.python_version == '3.11') && '--config=wheel_release' || '' }}

  test_wheels_cpu:
    name: "Test wheel on ${{ matrix.custom_name || 'CPU' }} (Python ${{ matrix.python_version }})"
    needs: [build_wheels, setup]
    if: needs.setup.outputs.should_build == 'true'
    strategy:
      # The postsubmit nightly variant below is a drift detector against the
      # latest PyTorch nightly, so it is expected to fail from time to time.
      # Let the rest of the matrix finish rather than cancelling every other
      # Python version's coverage along with it.
      fail-fast: false
      matrix:
        python_version: ${{ fromJSON(needs.setup.outputs.cpu_versions) }}
        wheel_version: ["standard"]
        include:
          - wheel_version: "standard"
            nox_smoke_test: "cpu-cpu"
          - python_version: ${{ needs.setup.outputs.default_python_version }}
            wheel_version: "cuda"
            custom_name: "CPU (CUDA wheel)"
            nox_smoke_test: "cpu-cuda"
          - python_version: ${{ needs.setup.outputs.default_python_version }}
            # On release branches, collapse into the existing standard entry so
            # no separate PyTorch Nightly job is scheduled.
            wheel_version: ${{ needs.setup.outputs.is_release_branch == 'true' && 'standard' || 'nightly' }}
            custom_name: ${{ needs.setup.outputs.is_release_branch != 'true' && 'CPU (PyTorch Nightly)' || '' }}
            # Presubmit installs the exact nightly snapshot the wheel's
            # nightly glue was built against (requirements/
            # requirements_torch_nightly.txt), so the check is deterministic
            # and gates hard. Postsubmit installs the *latest* nightly, which
            # can drift ABI-incompatibly from that snapshot -- a failure
            # there is the signal to refresh the lock.
            nox_smoke_test: ${{ needs.setup.outputs.is_release_branch == 'true' && 'cpu-cpu' || (github.event_name == 'pull_request' && 'cpu-nightly-pinned' || 'cpu-nightly') }}
    runs-on: linux-x86-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:dddf008479144c57182b56a6d00bfc1f38f8f2ef206e2bc26ff6c0a401ded47e  # Tag infrastructure-public-image-083516c6af6a (built 2026-10-13)
      options: --privileged
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories:
      # https://github.blog/open-source/git/git-security-vulnerability-announced/#cve-2022-24765.
      # Tell Git explicitly to trust the workspace `/__w/torch_tpu/torch_tpu` inside this ephemeral
      # container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download Wheel from GCS
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          GCS_WHEEL_DIR: ${{ needs.build_wheels.outputs.gcs_wheel_dir }}
        run: |
          mkdir dist
          PYTHON_VER_CLEAN=$(echo "${PYTHON_VERSION}" | tr -d '.')
          gcloud storage cp "${GCS_WHEEL_DIR}*-cp*-cp${PYTHON_VER_CLEAN}-*.whl" dist/
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      # Install the built wheel and target torch variant in a single uv
      # resolution, then check that the backend autoloads and passes smoke tests.
      - name: Run smoke tests via nox
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          NOX_SMOKE_TEST: ${{ matrix.nox_smoke_test }}
        run: uvx nox --force-python "${PYTHON_VERSION}" -s "smoke_test(${NOX_SMOKE_TEST})"
      - name: Run wheel characterization tests via nox
        if: matrix.wheel_version == 'standard'
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
        run: uvx nox --force-python "${PYTHON_VERSION}" -s wheel_test

  # Confirm each intermediate PyTorch patch (one we ship no exact glue for) is
  # served by its same-minor glue: the nox session runs the CPU smoke tests
  # once per entry in INTERMEDIATE_PATCH_VERSIONS (bazel/pytorch_versions.bzl),
  # all within this single job. Nothing here is TPU-specific, so it runs on a
  # CPU runner against the default Python.
  test_wheel_intermediate_patches:
    name: "Test wheel on intermediate PyTorch patches (Python ${{ needs.setup.outputs.default_python_version }})"
    needs: [build_wheels, setup]
    if: needs.setup.outputs.should_build == 'true'
    runs-on: linux-x86-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:dddf008479144c57182b56a6d00bfc1f38f8f2ef206e2bc26ff6c0a401ded47e  # Tag infrastructure-public-image-083516c6af6a (built 2026-10-13)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories:
      # https://github.blog/open-source/git/git-security-vulnerability-announced/#cve-2022-24765.
      # Tell Git explicitly to trust the workspace `/__w/torch_tpu/torch_tpu` inside this ephemeral
      # container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download Wheel from GCS
        env:
          PYTHON_VERSION: ${{ needs.setup.outputs.default_python_version }}
          GCS_WHEEL_DIR: ${{ needs.build_wheels.outputs.gcs_wheel_dir }}
        run: |
          mkdir dist
          PYTHON_VER_CLEAN=$(echo "${PYTHON_VERSION}" | tr -d '.')
          gcloud storage cp "${GCS_WHEEL_DIR}*-cp*-cp${PYTHON_VER_CLEAN}-*.whl" dist/
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run smoke tests against intermediate patches via nox
        env:
          PYTHON_VERSION: ${{ needs.setup.outputs.default_python_version }}
        run: uvx nox --force-python "${PYTHON_VERSION}" -s intermediate_patch_abi

  test_wheel_dep_upper_bounds:
    name: "Test wheel on dep upper bounds (Python ${{ needs.setup.outputs.default_python_version }})"
    needs: [build_wheels, setup]
    if: needs.setup.outputs.should_build == 'true'
    runs-on: linux-x86-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:dddf008479144c57182b56a6d00bfc1f38f8f2ef206e2bc26ff6c0a401ded47e  # Tag infrastructure-public-image-083516c6af6a (built 2026-10-13)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories:
      # https://github.blog/open-source/git/git-security-vulnerability-announced/#cve-2022-24765.
      # Tell Git explicitly to trust the workspace `/__w/torch_tpu/torch_tpu` inside this ephemeral
      # container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download Wheel from GCS
        env:
          PYTHON_VERSION: ${{ needs.setup.outputs.default_python_version }}
          GCS_WHEEL_DIR: ${{ needs.build_wheels.outputs.gcs_wheel_dir }}
        run: |
          mkdir dist
          PYTHON_VER_CLEAN=$(echo "${PYTHON_VERSION}" | tr -d '.')
          gcloud storage cp "${GCS_WHEEL_DIR}*-cp*-cp${PYTHON_VER_CLEAN}-*.whl" dist/
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run smoke tests against upper bounds via nox
        env:
          PYTHON_VERSION: ${{ needs.setup.outputs.default_python_version }}
        run: uvx nox --force-python "${PYTHON_VERSION}" -s dep_upper_bounds

  test_wheels_tpu:
    name: "Test wheel on TPU v7 1-Chip (Python ${{ matrix.python_version }})"
    needs: [build_wheels, setup]
    if: needs.setup.outputs.should_build == 'true'
    strategy:
      matrix:
        python_version: ${{ fromJSON(needs.setup.outputs.tpu_versions) }}
    runs-on: linux-x86-tpu7x-56-1tpu
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:dddf008479144c57182b56a6d00bfc1f38f8f2ef206e2bc26ff6c0a401ded47e  # Tag infrastructure-public-image-083516c6af6a (built 2026-10-13)
      options: --privileged
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories:
      # https://github.blog/open-source/git/git-security-vulnerability-announced/#cve-2022-24765.
      # Tell Git explicitly to trust the workspace `/__w/torch_tpu/torch_tpu` inside this ephemeral
      # container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download Wheel from GCS
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          GCS_WHEEL_DIR: ${{ needs.build_wheels.outputs.gcs_wheel_dir }}
        run: |
          mkdir dist
          PYTHON_VER_CLEAN=$(echo "${PYTHON_VERSION}" | tr -d '.')
          gcloud storage cp "${GCS_WHEEL_DIR}*-cp*-cp${PYTHON_VER_CLEAN}-*.whl" dist/
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      # TODO(b/541808039): Refactor this file to consolidate build/test loops and optimize the
      # dependency graph (e.g., start tests as soon as their specific wheel finishes building).
      #
      # Exercise the wheel as users consume it: nox installs the built wheel
      # plus a pip torch in one uv resolution, then runs the TPU smoke tests
      # (autoload, execution modes, and a sync test that compiles) against the
      # versioned-glue dispatch on a real TPU.
      - name: Run smoke tests via nox
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
        run: uvx nox --force-python "${PYTHON_VERSION}" -s "smoke_test(tpu-cpu)"

  # Smoke-test the nightly glue on TPU: nox installs the built wheel plus a
  # PyTorch nightly in a single uv resolution and checks that the backend
  # autoloads. Presubmit installs the exact snapshot the glue was built
  # against (requirements/requirements_torch_nightly.txt), so the check is
  # deterministic and gates hard. Postsubmit installs the *latest* nightly,
  # which can drift ABI-incompatibly from that snapshot between lock
  # refreshes -- a failure there is the signal to refresh the lock, without
  # ever blocking presubmit on drift.
  test_wheel_tpu_nightly:
    name: "Test wheel on TPU v7 (PyTorch Nightly) (Python ${{ needs.setup.outputs.default_python_version }})"
    needs: [build_wheels, setup]
    if: needs.setup.outputs.should_build == 'true' && needs.setup.outputs.is_release_branch != 'true'
    runs-on: linux-x86-tpu7x-56-1tpu
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:dddf008479144c57182b56a6d00bfc1f38f8f2ef206e2bc26ff6c0a401ded47e  # Tag infrastructure-public-image-083516c6af6a (built 2026-10-13)
      options: --privileged
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories:
      # https://github.blog/open-source/git/git-security-vulnerability-announced/#cve-2022-24765.
      # Tell Git explicitly to trust the workspace `/__w/torch_tpu/torch_tpu` inside this ephemeral
      # container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download Wheel from GCS
        env:
          PYTHON_VERSION: ${{ needs.setup.outputs.default_python_version }}
          GCS_WHEEL_DIR: ${{ needs.build_wheels.outputs.gcs_wheel_dir }}
        run: |
          mkdir dist
          PYTHON_VER_CLEAN=$(echo "${PYTHON_VERSION}" | tr -d '.')
          gcloud storage cp "${GCS_WHEEL_DIR}*-cp*-cp${PYTHON_VER_CLEAN}-*.whl" dist/
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run the nightly smoke test via nox
        env:
          PYTHON_VERSION: ${{ needs.setup.outputs.default_python_version }}
          NOX_SMOKE_TEST: ${{ github.event_name == 'pull_request' && 'tpu-nightly-pinned' || 'tpu-nightly' }}
        run: uvx nox --force-python "${PYTHON_VERSION}" -s "smoke_test(${NOX_SMOKE_TEST})"

  # Aggregator job checked by Copybara. When `should_build` is false (e.g. on
  # documentation-only PRs), GitHub Actions skips the downstream jobs above
  # before expanding `strategy.matrix` or interpolating `needs.*` in job names,
  # so the per-slice check run names are never created. Centralizing the check
  # in a single always-run job ensures Copybara always observes a concrete
  # result while gating on every wheel build and test job when `should_build`
  # is true.
  wheel_tests_passed:
    name: "Build and Test Wheels"
    needs:
      - setup
      - build_wheels
      - test_wheels_cpu
      - test_wheel_intermediate_patches
      - test_wheel_dep_upper_bounds
      - test_wheels_tpu
      - test_wheel_tpu_nightly
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check wheel workflow results
        env:
          SETUP_RESULT: ${{ needs.setup.result }}
          SHOULD_BUILD: ${{ needs.setup.outputs.should_build }}
          IS_RELEASE_BRANCH: ${{ needs.setup.outputs.is_release_branch }}
          BUILD_WHEELS_RESULT: ${{ needs.build_wheels.result }}
          TEST_WHEELS_CPU_RESULT: ${{ needs.test_wheels_cpu.result }}
          TEST_INTERMEDIATE_PATCHES_RESULT: ${{ needs.test_wheel_intermediate_patches.result }}
          TEST_DEP_UPPER_BOUNDS_RESULT: ${{ needs.test_wheel_dep_upper_bounds.result }}
          TEST_WHEELS_TPU_RESULT: ${{ needs.test_wheels_tpu.result }}
          TEST_TPU_NIGHTLY_RESULT: ${{ needs.test_wheel_tpu_nightly.result }}
        run: |
          if [[ "${SETUP_RESULT}" != "success" ]]; then
            echo "::error::setup job did not succeed (result: ${SETUP_RESULT})"
            exit 1
          fi

          if [[ "${SHOULD_BUILD}" == "false" ]]; then
            echo "Wheel build and tests skipped for documentation/metadata-only change."
            exit 0
          fi

          FAILED=0
          for entry in \
            "build_wheels:${BUILD_WHEELS_RESULT}" \
            "test_wheels_cpu:${TEST_WHEELS_CPU_RESULT}" \
            "test_wheel_intermediate_patches:${TEST_INTERMEDIATE_PATCHES_RESULT}" \
            "test_wheel_dep_upper_bounds:${TEST_DEP_UPPER_BOUNDS_RESULT}" \
            "test_wheels_tpu:${TEST_WHEELS_TPU_RESULT}" \
            "test_wheel_tpu_nightly:${TEST_TPU_NIGHTLY_RESULT}"; do
            job_name="${entry%%:*}"
            result="${entry#*:}"
            echo "${job_name}: ${result}"
            if [[ "${job_name}" == "test_wheel_tpu_nightly" && "${IS_RELEASE_BRANCH}" == "true" && "${result}" == "skipped" ]]; then
              continue
            fi
            if [[ "${result}" != "success" ]]; then
              echo "::error::${job_name} did not succeed (result: ${result})"
              FAILED=1
            fi
          done
          exit "${FAILED}"
