name: Build and Test Wheels

on:
  # Enable remote connections for workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: "Should this workflow run wait for a remote connection?"
        type: choice
        default: "no"
        options:
          - "yes"
          - "no"
      override_base_sha:
        description: 'Override Base SHA for bazel-diff (optional)'
        required: false
        type: string
      override_current_sha:
        description: 'Override Current SHA for bazel-diff (optional)'
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

# Cancel old jobs when they are replaced by new runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch
  cancel-in-progress: ${{ github.ref != 'main' }}

jobs:
  setup:
    name: "Set up Matrix"
    runs-on: ubuntu-latest
    outputs:
      cpu_versions: '["3.11", "3.12", "3.13", "3.14"]'
      tpu_versions: ${{ steps.set.outputs.tpu_versions }}
      default_python_version: "3.12"
    steps:
      - id: set
        run: |
          DEFAULT_VER="3.12"
          TPU_VERS="[\"${DEFAULT_VER}\"]"
          if [[ "${{ github.event_name }}" == "schedule" ]] || \
             [[ "${{ github.event_name }}" == "push" ]] || \
             [[ "${{ contains(github.event.pull_request.labels.*.name, 'tpu-nightly') }}" == "true" ]] || \
             [[ "${{ contains(github.event.pull_request.labels.*.name, 'ci:run_all_versions') }}" == "true" ]] || \
             [[ "${{ contains(github.event.pull_request.labels.*.name, 'ci:postsubmit') }}" == "true" ]]; then
            TPU_VERS='["3.11", "3.12", "3.13", "3.14"]'
          fi
          echo "tpu_versions=${TPU_VERS}" >> $GITHUB_OUTPUT

  # TODO(pganssle): Migrate to cibuildwheel
  build_wheels:
    needs: setup
    name: "Build wheel on ${{ matrix.job_info.name || matrix.job_info.runner }} (Python ${{ matrix.python_version }})"
    strategy:
      matrix:
        job_info:
          [
            {
              name: "CPU",
              runner: "linux-x86-n4-16",
              container: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest",
            },
          ]
        python_version: ${{ fromJSON(needs.setup.outputs.cpu_versions) }}
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: ${{ matrix.job_info.container }}
    outputs:
      gcs_wheel_path: ${{ steps.build.outputs.gcs_wheel_path }}
      gcs_wheel_dir: ${{ steps.build.outputs.gcs_wheel_dir }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Build and upload wheel
        id: build
        uses: ./.github/actions/build-wheel
        with:
          python_version: ${{ matrix.python_version }}
          # The oldest Python version builds with the release config (no
          # PyTorch-nightly glue), so both wheel flavors are exercised in
          # presubmit; the nightly smoke tests only run against the default
          # Python's wheel, which keeps the nightly glue.
          bazel_config: ${{ matrix.python_version == '3.11' && 'wheel_release' || 'wheel_common' }}

  test_wheels_cpu:
    name: "Test wheel on ${{ matrix.custom_name || 'CPU' }} (Python ${{ matrix.python_version }})"
    needs: [build_wheels, setup]
    strategy:
      matrix:
        python_version: ${{ fromJSON(needs.setup.outputs.cpu_versions) }}
        wheel_version: ["standard"]
        include:
          - wheel_version: "standard"
            runner: linux-x86-n4-16
            config: "wheel_test_cpu"
            allowed_to_fail: false
            extra_flags: ""
          - python_version: ${{ needs.setup.outputs.default_python_version }}
            wheel_version: "cuda"
            custom_name: "CPU (CUDA wheel)"
            runner: linux-x86-n4-16
            nox_smoke_test: "cpu-cuda"
            allowed_to_fail: false
          - python_version: ${{ needs.setup.outputs.default_python_version }}
            wheel_version: "nightly"
            custom_name: "CPU (PyTorch Nightly)"
            runner: linux-x86-n4-16
            nox_smoke_test: "cpu-nightly"
            # The wheel ships a nightly glue built against the dev snapshot
            # pinned in requirements/requirements_torch_nightly.txt, but this
            # installs the *latest* nightly, which can drift ABI-incompatibly
            # from that snapshot between lock refreshes -- so this stays a
            # soft failure.
            allowed_to_fail: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.allowed_to_fail }}
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
      options: --privileged
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v5
      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories:
      # https://github.blog/open-source/git/git-security-vulnerability-announced/#cve-2022-24765.
      # Tell Git explicitly to trust the workspace `/__w/torch_tpu/torch_tpu` inside this ephemeral
      # container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download Wheel from GCS
        run: |
          mkdir dist
          PYTHON_VER_CLEAN=$(echo "${{ matrix.python_version }}" | tr -d '.')
          gcloud storage cp "${{ needs.build_wheels.outputs.gcs_wheel_dir }}*cp${PYTHON_VER_CLEAN}*.whl" dist/
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      # For the alternate-torch wheel variants (CUDA, nightly), run a trimmed-
      # down smoke test instead of the bazel test suite: nox installs the built
      # wheel and the torch variant in a single uv resolution, then checks that
      # the backend autoloads. Soft-fail variants swallow the failure at the
      # step level (a job-level continue-on-error still shows a red X on the
      # PR) and surface it as a warning annotation instead.
      - name: Run smoke tests via nox
        id: nox_smoke
        if: matrix.nox_smoke_test
        continue-on-error: ${{ matrix.allowed_to_fail == true }}
        run: uvx nox --force-python ${{ matrix.python_version }} -s "smoke_test(${{ matrix.nox_smoke_test }})"
      - name: Surface soft-failed smoke tests as a warning
        if: matrix.nox_smoke_test && steps.nox_smoke.outcome == 'failure'
        run: echo "::warning title=${{ matrix.custom_name }} smoke test failed (allowed)::The ${{ matrix.wheel_version }} torch smoke test failed; this variant is allowed to fail until compatible glue ships."
      - name: Run Impacted Tests via bazel-diff
        if: ${{ !matrix.nox_smoke_test }}
        uses: ./.github/actions/bazel-diff
        with:
          base_sha: ${{ inputs.override_base_sha || github.event.pull_request.base.sha }}
          current_sha: ${{ inputs.override_current_sha || github.sha }}
          bazel_config: ${{ matrix.config }}
          extra_bazel_flags: ${{ matrix.extra_flags }} --repo_env=HERMETIC_PYTHON_VERSION=${{ matrix.python_version }} --define PYTHON_VERSION=${{ matrix.python_version }}
          disable_bazel_diff: ${{ contains(github.event.pull_request.labels.*.name, 'ci:disable-bazel-diff') }}

  # Confirm each intermediate PyTorch patch (one we ship no exact glue for) is
  # served by its same-minor glue: the nox session runs the CPU smoke tests
  # once per entry in INTERMEDIATE_PATCH_VERSIONS (bazel/pytorch_versions.bzl),
  # all within this single job. The glue is linked with `-z now`, so an
  # ABI-incompatible glue fails the autoload import outright. Nothing here is
  # TPU-specific, so it runs on a CPU runner against the default Python.
  test_wheel_intermediate_patches:
    name: "Test wheel on intermediate PyTorch patches (Python ${{ needs.setup.outputs.default_python_version }})"
    needs: [build_wheels, setup]
    runs-on: linux-x86-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories:
      # https://github.blog/open-source/git/git-security-vulnerability-announced/#cve-2022-24765.
      # Tell Git explicitly to trust the workspace `/__w/torch_tpu/torch_tpu` inside this ephemeral
      # container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download Wheel from GCS
        run: |
          mkdir dist
          PYTHON_VER_CLEAN=$(echo "${{ needs.setup.outputs.default_python_version }}" | tr -d '.')
          gcloud storage cp "${{ needs.build_wheels.outputs.gcs_wheel_dir }}*cp${PYTHON_VER_CLEAN}*.whl" dist/
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run smoke tests against intermediate patches via nox
        run: uvx nox --force-python ${{ needs.setup.outputs.default_python_version }} -s intermediate_patch_abi

  test_wheels_tpu:
    name: Test wheel on ${{ matrix.custom_name || 'TPU' }} (Python ${{ matrix.python_version }})
    needs: [build_wheels, setup]
    strategy:
      matrix:
        python_version: ${{ fromJSON(needs.setup.outputs.tpu_versions) }}
        wheel_version: ["standard", "v7"]
        include:
          - wheel_version: "standard"
            runner: linux-x86-ct5lp-224-8tpu
            config: "wheel_test_tpu_v5"
            custom_name: "TPU v5"
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"'
            allowed_to_fail: false
          - wheel_version: "v7"
            runner: linux-x86-tpu7x-224-4tpu
            config: "wheel_test_tpu_v7"
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"'
            custom_name: "TPU v7"
            allowed_to_fail: false
          - python_version: ${{ needs.setup.outputs.default_python_version }}
            wheel_version: "nightly"
            runner: linux-x86-ct5lp-224-8tpu
            custom_name: "TPU v5 (PyTorch Nightly)"
            nox_smoke_test: "tpu-nightly"
            # The wheel ships a nightly glue built against the dev snapshot
            # pinned in requirements/requirements_torch_nightly.txt, but this
            # installs the *latest* nightly, which can drift ABI-incompatibly
            # from that snapshot between lock refreshes -- so this stays a
            # soft failure.
            allowed_to_fail: true
    runs-on: ${{ matrix.runner || 'linux-x86-ct5lp-224-8tpu' }}
    continue-on-error: ${{ matrix.allowed_to_fail }}
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
      options: --privileged
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v5
      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories:
      # https://github.blog/open-source/git/git-security-vulnerability-announced/#cve-2022-24765.
      # Tell Git explicitly to trust the workspace `/__w/torch_tpu/torch_tpu` inside this ephemeral
      # container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download Wheel from GCS
        run: |
          mkdir dist
          PYTHON_VER_CLEAN=$(echo "${{ matrix.python_version }}" | tr -d '.')
          gcloud storage cp "${{ needs.build_wheels.outputs.gcs_wheel_dir }}*cp${PYTHON_VER_CLEAN}*.whl" dist/
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      # For the alternate-torch wheel variants (nightly), run a trimmed-down
      # smoke test instead of the bazel test suite: nox installs the built
      # wheel and the torch variant in a single uv resolution, then checks that
      # the backend autoloads. Soft-fail variants swallow the failure at the
      # step level (a job-level continue-on-error still shows a red X on the
      # PR) and surface it as a warning annotation instead.
      - name: Run smoke tests via nox
        id: nox_smoke
        if: matrix.nox_smoke_test
        continue-on-error: ${{ matrix.allowed_to_fail == true }}
        run: uvx nox --force-python ${{ matrix.python_version }} -s "smoke_test(${{ matrix.nox_smoke_test }})"
      - name: Surface soft-failed smoke tests as a warning
        if: matrix.nox_smoke_test && steps.nox_smoke.outcome == 'failure'
        run: echo "::warning title=${{ matrix.custom_name }} smoke test failed (allowed)::The ${{ matrix.wheel_version }} torch smoke test failed; this variant is allowed to fail until compatible glue ships."
      - name: Run Impacted Tests via bazel-diff
        if: ${{ !matrix.nox_smoke_test }}
        uses: ./.github/actions/bazel-diff
        with:
          base_sha: ${{ inputs.override_base_sha || github.event.pull_request.base.sha }}
          current_sha: ${{ inputs.override_current_sha || github.sha }}
          bazel_config: ${{ matrix.config }}
          extra_bazel_flags: ${{ matrix.extra_flags || '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"' }} --repo_env=HERMETIC_PYTHON_VERSION=${{ matrix.python_version }} --define PYTHON_VERSION=${{ matrix.python_version }}
          disable_bazel_diff: ${{ contains(github.event.pull_request.labels.*.name, 'ci:disable-bazel-diff') }}
