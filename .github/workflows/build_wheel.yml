name: Build and Test Wheels

on:
  # Enable remote connections for workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: "Should this workflow run wait for a remote connection?"
        type: choice
        default: "no"
        options:
          - "yes"
          - "no"
      override_base_sha:
        description: 'Override Base SHA for bazel-diff (optional)'
        required: false
        type: string
      override_current_sha:
        description: 'Override Current SHA for bazel-diff (optional)'
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 9 * * *' # 1 AM PST

# Cancel old jobs when they are replaced by new runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch
  cancel-in-progress: ${{ github.ref != 'main' }}

jobs:
  # TODO(pganssle): Migrate to cibuildwheel
  build_wheels:
    name: "Build wheel on ${{ matrix.job_info.name || matrix.job_info.runner }}"
    strategy:
      matrix:
        job_info:
          [
            {
              name: "CPU",
              runner: "linux-x86-n4-16",
              container: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest",
            },
          ]
    # Use self-hosted runners. For a Linux runner, a corresponding container image used for the
    # workflow is required.
    # See go/ml-github-actions/getting_started/using_runners.md#supported-runner-scale-set.
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: ${{ matrix.job_info.container }}
    env:
      WHEEL_DIR: dist
    outputs:
      # Full path to the wheel on GCS
      gcs-wheel-path: ${{ steps.upload.outputs.gcs_wheel_path }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Build wheel
        run: |
          WHEEL_VERSION_EXTRAS=".dev$(date +%Y%m%d%H%M%S)"
          bazel build -c opt //ci/wheel:torch_tpu_wheel --config=wheel_common --repo_env=WHEEL_VERSION_EXTRAS=$WHEEL_VERSION_EXTRAS
          mkdir $WHEEL_DIR
          cp bazel-bin/ci/wheel/*.whl $WHEEL_DIR
      - name: Check wheel metadata
        run: uv run --isolated --with twine twine check $WHEEL_DIR/*.whl
      - name: Upload wheel to GCS for wheel testing
        if: github.event_name != 'schedule'
        id: upload
        run: |
          WHEEL_PATH=$(ls $WHEEL_DIR/*.whl | head -n 1)
          WHEEL_FILENAME=$(basename "$WHEEL_PATH")
          GCS_PATH="gs://torch-tpu-ci-transient/artifacts/${{ github.workflow }}/${{ github.run_number }}/${{ github.run_attempt }}/$WHEEL_FILENAME"
          gcloud storage cp "$WHEEL_PATH" "$GCS_PATH"
          # We must store the full path to the wheel, not just the bucket, since
          # sometimes stale pre-existing wheels exist in the bucket, and we need
          # to know which one is the one this particular job uploaded.
          echo "gcs_wheel_path=$GCS_PATH" >> $GITHUB_OUTPUT
      - name: Upload to Artifact Registry
        # Run only on main branch, once a day.
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          # Install package needed to authenticate to artifactregistry for Python.
          # See https://cloud.google.com/artifact-registry/docs/python/authentication
          pip install keyrings.google-artifactregistry-auth

          # Configure pypirc for twine upload.
          pypirc_content=$(cat <<EOF
          [distutils]
          index-servers =
              torch-tpu-testing-repo

          [torch-tpu-testing-repo]
          repository = https://us-python.pkg.dev/ml-oss-artifacts-transient/torch-tpu-testing-registry/
          EOF
          )
          echo "$pypirc_content" > "$HOME"/.pypirc

          python3 -m twine upload --repository-url https://us-python.pkg.dev/ml-oss-artifacts-transient/torch-tpu-testing-registry $WHEEL_DIR/torch_tpu-*.whl

  test_wheels:
    name: Test wheel on ${{ matrix.custom_name || matrix.runner }}
    if: github.event_name != 'schedule'
    needs: build_wheels
    strategy:
      matrix:
        include:
          - name: CPU
            runner: linux-x86-n4-16
            config: "wheel_test_cpu"
            extra_flags: ""
            custom_name: CPU
          - name: TPU
            runner: linux-x86-ct5lp-224-8tpu
            config: "wheel_test_tpu"
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"'
          - name: "CPU (CUDA wheel)"
            runner: linux-x86-n4-16
            config: "wheel_test_cpu"
            extra_flags: ""
            wheel_version: "cuda"
            custom_name: "CPU (CUDA wheel)"
          - name: "CPU (PyTorch Nightly)"
            runner: linux-x86-n4-16
            config: "wheel_test_cpu"
            extra_flags: ""
            wheel_version: "nightly"
            custom_name: "CPU (PyTorch Nightly)"
          - name: "TPU (PyTorch Nightly)"
            runner: linux-x86-tpu7x-224-4tpu
            config: "wheel_test_tpu_on_v7"
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"'
            wheel_version: "nightly"
            custom_name: "TPU (PyTorch Nightly)"
    runs-on: ${{ matrix.runner }}
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
      options: --privileged
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v5
      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories:
      # https://github.blog/open-source/git/git-security-vulnerability-announced/#cve-2022-24765.
      # Tell Git explicitly to trust the workspace `/__w/torch_tpu/torch_tpu` inside this ephemeral
      # container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download Wheel from GCS
        run: |
          mkdir dist
          gcloud storage cp "${{ needs.build_wheels.outputs.gcs-wheel-path }}" dist/
      - name: Download a specific CUDA-enabled torch wheel to verify the override mechanism
        if: matrix.wheel_version == 'cuda'
        run: |
          pip download dist/*.whl -d dist/
      - name: Download PyTorch Nightly Wheel to verify the override mechanism
        if: matrix.wheel_version == 'nightly'
        run: |
          pip download --no-deps --pre torch --index-url https://download.pytorch.org/whl/nightly/cpu -d dist
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run Impacted Tests via bazel-diff
        uses: ./.github/actions/bazel-diff
        with:
          base_sha: ${{ inputs.override_base_sha || github.event.pull_request.base.sha }}
          current_sha: ${{ inputs.override_current_sha || github.sha }}
          bazel_config: ${{ matrix.config }}
          extra_bazel_flags: ${{ matrix.extra_flags }}
          disable_bazel_diff: ${{ contains(github.event.pull_request.labels.*.name, 'ci:disable-bazel-diff') }}
