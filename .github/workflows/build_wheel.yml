name: Build and Test Wheels

on:
  # Enable remote connections for workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: "Should this workflow run wait for a remote connection?"
        type: choice
        default: "no"
        options:
          - "yes"
          - "no"
      override_base_sha:
        description: 'Override Base SHA for bazel-diff (optional)'
        required: false
        type: string
      override_current_sha:
        description: 'Override Current SHA for bazel-diff (optional)'
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

# Cancel old jobs when they are replaced by new runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch
  cancel-in-progress: ${{ github.ref != 'main' }}

jobs:
  setup:
    name: "Set up Matrix"
    runs-on: ubuntu-latest
    outputs:
      cpu_versions: '["3.11", "3.12", "3.13", "3.14"]'
      tpu_versions: ${{ steps.set.outputs.tpu_versions }}
      default_python_version: "3.12"
    steps:
      - id: set
        run: |
          DEFAULT_VER="3.12"
          TPU_VERS="[\"${DEFAULT_VER}\"]"
          if [[ "${{ github.event_name }}" == "schedule" ]] || \
             [[ "${{ github.event_name }}" == "push" ]] || \
             [[ "${{ contains(github.event.pull_request.labels.*.name, 'tpu-nightly') }}" == "true" ]] || \
             [[ "${{ contains(github.event.pull_request.labels.*.name, 'ci:run_all_versions') }}" == "true" ]] || \
             [[ "${{ contains(github.event.pull_request.labels.*.name, 'ci:postsubmit') }}" == "true" ]]; then
            TPU_VERS='["3.11", "3.12", "3.13", "3.14"]'
          fi
          echo "tpu_versions=${TPU_VERS}" >> $GITHUB_OUTPUT

  # TODO(pganssle): Migrate to cibuildwheel
  build_wheels:
    needs: setup
    name: "Build wheel on ${{ matrix.job_info.name || matrix.job_info.runner }} (Python ${{ matrix.python_version }})"
    strategy:
      matrix:
        job_info:
          [
            {
              name: "CPU",
              runner: "linux-x86-n4-16",
              container: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest",
            },
          ]
        python_version: ${{ fromJSON(needs.setup.outputs.cpu_versions) }}
    # Use self-hosted runners. For a Linux runner, a corresponding container image used for the
    # workflow is required.
    # See go/ml-github-actions/getting_started/using_runners.md#supported-runner-scale-set.
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: ${{ matrix.job_info.container }}
    env:
      WHEEL_DIR: dist
    outputs:
      # Directory containing wheels on GCS
      gcs-wheel-dir: ${{ steps.upload.outputs.gcs_wheel_dir }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Build wheel
        run: |
          WHEEL_VERSION_EXTRAS=".dev$(date +%Y%m%d%H%M%S)"
          bazel build -c opt //ci/wheel:torch_tpu_wheel --config=wheel_common --repo_env=WHEEL_VERSION_EXTRAS=$WHEEL_VERSION_EXTRAS --repo_env=HERMETIC_PYTHON_VERSION=${{ matrix.python_version }} --define PYTHON_VERSION=${{ matrix.python_version }}
          mkdir $WHEEL_DIR
          cp bazel-bin/ci/wheel/*.whl $WHEEL_DIR
      - name: Show wheel sha256sum before upload
        run: |
          sha256sum dist/*.whl
      - name: Check wheel metadata
        run: uv run --isolated --with twine twine check $WHEEL_DIR/*.whl
      - name: Upload wheel to GCS for wheel testing
        id: upload
        run: |
          WHEEL_PATH=$(ls $WHEEL_DIR/*.whl | head -n 1)
          WHEEL_FILENAME=$(basename "$WHEEL_PATH")
          GCS_PATH="gs://torch-tpu-ci-transient/artifacts/${{ github.workflow }}/${{ github.run_number }}/${{ github.run_attempt }}/$WHEEL_FILENAME"
          gcloud storage cp "$WHEEL_PATH" "$GCS_PATH"
          # Pass the directory path to the next job
          echo "gcs_wheel_dir=gs://torch-tpu-ci-transient/artifacts/${{ github.workflow }}/${{ github.run_number }}/${{ github.run_attempt }}/" >> $GITHUB_OUTPUT

  test_wheels_cpu:
    name: "Test wheel on ${{ matrix.custom_name || 'CPU' }} (Python ${{ matrix.python_version }})"
    needs: [build_wheels, setup]
    strategy:
      matrix:
        python_version: ${{ fromJSON(needs.setup.outputs.cpu_versions) }}
        wheel_version: ["standard"]
        include:
          - wheel_version: "standard"
            runner: linux-x86-n4-16
            config: "wheel_test_cpu"
            allowed_to_fail: false
            extra_flags: ""
          - python_version: ${{ needs.setup.outputs.default_python_version }}
            wheel_version: "cuda"
            custom_name: "CPU (CUDA wheel)"
            runner: linux-x86-n4-16
            config: "wheel_test_cpu"
            extra_flags: '--define TORCH_SOURCE=local --repo_env=TORCH_SOURCE=$TORCH_SOURCE'
            allowed_to_fail: true
            expected_failure: true
          - python_version: ${{ needs.setup.outputs.default_python_version }}
            wheel_version: "nightly"
            custom_name: "CPU (PyTorch Nightly)"
            runner: linux-x86-n4-16
            config: "wheel_test_cpu"
            extra_flags: '--define TORCH_SOURCE=local --repo_env=TORCH_SOURCE=$TORCH_SOURCE'
            allowed_to_fail: true
            expected_failure: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.allowed_to_fail }}
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
      options: --privileged
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v5
      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories:
      # https://github.blog/open-source/git/git-security-vulnerability-announced/#cve-2022-24765.
      # Tell Git explicitly to trust the workspace `/__w/torch_tpu/torch_tpu` inside this ephemeral
      # container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download Wheel from GCS
        run: |
          mkdir dist
          PYTHON_VER_CLEAN=$(echo "${{ matrix.python_version }}" | tr -d '.')
          gcloud storage cp "${{ needs.build_wheels.outputs.gcs-wheel-dir }}*cp${PYTHON_VER_CLEAN}*.whl" dist/
      - name: Download a specific CUDA-enabled torch wheel to verify the override mechanism
        if: matrix.wheel_version == 'cuda'
        run: |
          pip download dist/*.whl -d dist/
          WHEEL_PATH=$(ls $(pwd)/dist/torch-*.whl | head -n 1)
          echo "TORCH_SOURCE=$WHEEL_PATH" >> $GITHUB_ENV
          echo "Exported TORCH_SOURCE=$WHEEL_PATH"
      - name: Download PyTorch Nightly Wheel to verify the override mechanism
        if: matrix.wheel_version == 'nightly'
        run: |
          pip download --no-deps --pre torch --index-url https://download.pytorch.org/whl/nightly/cpu -d dist
          WHEEL_PATH=$(ls $(pwd)/dist/torch-*.whl | head -n 1)
          echo "TORCH_SOURCE=$WHEEL_PATH" >> $GITHUB_ENV
          echo "Exported TORCH_SOURCE=$WHEEL_PATH"
      - name: Show wheel sha256sum after download
        run: |
          sha256sum dist/*.whl
      - name: Print PyTorch version used in wheel tests
        run: |
          bash ci/wheel/install_and_print_version.sh ${{ matrix.python_version }}
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run Impacted Tests via bazel-diff
        uses: ./.github/actions/bazel-diff
        continue-on-error: ${{ matrix.expected_failure == true }}
        with:
          base_sha: ${{ inputs.override_base_sha || github.event.pull_request.base.sha }}
          current_sha: ${{ inputs.override_current_sha || github.sha }}
          bazel_config: ${{ matrix.config }}
          extra_bazel_flags: ${{ matrix.extra_flags }} --repo_env=HERMETIC_PYTHON_VERSION=${{ matrix.python_version }} --define PYTHON_VERSION=${{ matrix.python_version }} --test_env=TORCH_TPU_PYTORCH_BUILD_VERSION

          disable_bazel_diff: ${{ contains(github.event.pull_request.labels.*.name, 'ci:disable-bazel-diff') }}

  test_wheels_tpu:
    name: Test wheel on ${{ matrix.custom_name || 'TPU' }} (Python ${{ matrix.python_version }})
    needs: [build_wheels, setup]
    strategy:
      matrix:
        python_version: ${{ fromJSON(needs.setup.outputs.tpu_versions) }}
        wheel_version: ["standard", "v7"]
        include:
          - wheel_version: "standard"
            runner: linux-x86-ct5lp-224-8tpu
            config: "wheel_test_tpu_v5"
            custom_name: "TPU v5"
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"'
            allowed_to_fail: false
          - wheel_version: "v7"
            runner: linux-x86-tpu7x-224-4tpu
            config: "wheel_test_tpu_v7"
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"'
            custom_name: "TPU v7"
            allowed_to_fail: false
          - python_version: ${{ needs.setup.outputs.default_python_version }}
            wheel_version: "nightly"
            runner: linux-x86-ct5lp-224-8tpu
            config: "wheel_test_tpu_v5"
            custom_name: "TPU v5 (PyTorch Nightly)"
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" --define TORCH_SOURCE=local --repo_env=TORCH_SOURCE=$TORCH_SOURCE'
            allowed_to_fail: true
            expected_failure: true
    runs-on: ${{ matrix.runner || 'linux-x86-ct5lp-224-8tpu' }}
    continue-on-error: ${{ matrix.allowed_to_fail }}
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
      options: --privileged
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v5
      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories:
      # https://github.blog/open-source/git/git-security-vulnerability-announced/#cve-2022-24765.
      # Tell Git explicitly to trust the workspace `/__w/torch_tpu/torch_tpu` inside this ephemeral
      # container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download Wheel from GCS
        run: |
          mkdir dist
          PYTHON_VER_CLEAN=$(echo "${{ matrix.python_version }}" | tr -d '.')
          gcloud storage cp "${{ needs.build_wheels.outputs.gcs-wheel-dir }}*cp${PYTHON_VER_CLEAN}*.whl" dist/
      - name: Download PyTorch Nightly Wheel to verify the override mechanism
        if: matrix.wheel_version == 'nightly'
        run: |
          pip download --no-deps --pre torch --index-url https://download.pytorch.org/whl/nightly/cpu -d dist
          WHEEL_PATH=$(ls $(pwd)/dist/torch-*.whl | head -n 1)
          echo "TORCH_SOURCE=$WHEEL_PATH" >> $GITHUB_ENV
          echo "Exported TORCH_SOURCE=$WHEEL_PATH"
      - name: Print PyTorch version used in wheel tests
        run: |
          bash ci/wheel/install_and_print_version.sh ${{ matrix.python_version }}
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run Impacted Tests via bazel-diff
        uses: ./.github/actions/bazel-diff
        continue-on-error: ${{ matrix.expected_failure == true }}
        with:
          base_sha: ${{ inputs.override_base_sha || github.event.pull_request.base.sha }}
          current_sha: ${{ inputs.override_current_sha || github.sha }}
          bazel_config: ${{ matrix.config }}
          extra_bazel_flags: ${{ matrix.extra_flags || '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"' }} --repo_env=HERMETIC_PYTHON_VERSION=${{ matrix.python_version }} --define PYTHON_VERSION=${{ matrix.python_version }} --test_env=TORCH_TPU_PYTORCH_BUILD_VERSION
          disable_bazel_diff: ${{ matrix.allowed_to_fail || contains(github.event.pull_request.labels.*.name, 'ci:disable-bazel-diff') }}

