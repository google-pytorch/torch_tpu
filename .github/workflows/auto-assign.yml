name: Auto-Assign Reviewers and Owners

"on":
  issues:
    types: [opened, reopened, transferred]
  # `pull_request_target` grants a write token to request reviewers on fork PRs.
  # Safe because `actions/checkout` checks out `main` (never PR code) and
  # `./tools/auto_assign.py` reads the event JSON file without shell expansion.
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, ready_for_review]

permissions: {}

concurrency:
  group: >-
    auto-assign-${{
      github.event.issue.number || github.event.pull_request.number
    }}
  cancel-in-progress: false

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read     # Check out tools/auto_assign.py and BUILD files.
      issues: write      # Assign owners on newly opened/reopened issues.
      pull-requests: write  # Request reviewers on non-draft PRs.
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Auto-assign reviewer or owner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          ./tools/auto_assign.py --exclude-file .github/auto_assign_excludes.txt
