# This workflow enforces license headers, commit message validation, and code linting checks
# (C++ clang-format and Python ruff) on Pull Requests.

name: "Lint checks"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  issues: read

# Cancel old jobs when they are replaced by new runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch
  cancel-in-progress: ${{ github.ref != 'main' }}


jobs:
  run_tests:
    name: "Lint check"
    runs-on: ubuntu-latest
    steps:
      - name: "Check out code"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - name: "Set up Go"
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00  # v6.0.0
        with:
          go-version: "1.24"
          cache: false
      - name: "Validate License Headers"
        shell: "bash"
        run: |
          go run github.com/google/addlicense@v1.1.1 -check -s=only .
      - name: "Validate Directory Layout"
        shell: "bash"
        run: |
          # TODO (b/554114867): Implement symlink-based src folder setup and remove this manifest check.

          # List of expected directories inside src/torch_tpu
          EXPECTED_SRC_DIRS=(
            "_internal"
            "eager"
            "ops"
          )

          # List of expected directories at repository root
          EXPECTED_ROOT_DIRS=(
            "bazel"
            "build_files"
            "ci"
            "csrc"
            "docker"
            "docs"
            "examples"
            "requirements"
            "shims"
            "src"
            "tests"
          )

          # Compare src/torch_tpu directories
          actual_src=$(ls -d src/torch_tpu/*/ 2>/dev/null | xargs -n1 basename 2>/dev/null | sort)
          expected_src=$(printf "%s\n" "${EXPECTED_SRC_DIRS[@]}" | sort)

          if [ "$actual_src" != "$expected_src" ]; then
            echo "::error::Unexpected directories found in src/torch_tpu/"
            echo "Expected:"
            echo "$expected_src"
            echo "Actual:"
            echo "$actual_src"
            echo "Please update EXPECTED_SRC_DIRS in .github/workflows/lint.yml if this is intentional."
            exit 1
          fi

          # Compare root directories (excluding hidden ones)
          actual_root=$(find . -maxdepth 1 -type d -not -name '.*' -not -name '.' | xargs -n1 basename | sort)
          expected_root=$(printf "%s\n" "${EXPECTED_ROOT_DIRS[@]}" | sort)

          if [ "$actual_root" != "$expected_root" ]; then
            echo "::error::Unexpected directories found at repository root"
            echo "Expected:"
            echo "$expected_root"
            echo "Actual:"
            echo "$actual_root"
            echo "Please update EXPECTED_ROOT_DIRS in .github/workflows/lint.yml if this is intentional."
            exit 1
          fi

          echo "Directory layout validated successfully."

      - name: "Validate Commit Messages"
        if: (success() || failure()) && github.event_name == 'pull_request'
        shell: "bash"
        run: |
          # Fix dubious ownership issue in Actions
          git config --global --add safe.directory '*'

          # Get the exact number of commits in the PR to minimize git fetch depth
          PR_COMMITS="${{ github.event.pull_request.commits }}"
          PR_COMMITS="${PR_COMMITS:-0}"

          # Fetch the PR branch head and the base commit to establish the commit range
          git fetch --no-tags --depth=$((PR_COMMITS + 1)) origin "${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"

          # Get commit messages between base and head of the pull request
          commit_msgs=$(git log "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --format=%B)

          if echo "$commit_msgs" | grep -qF "[NO DESCRIPTION SET]"; then
            echo "::error::Found '[NO DESCRIPTION SET]' in one or more commit messages."
            exit 1
          fi
          echo "Commit messages look good."

  run_code_linters:
    name: "Run code linters (C++ and Python)"
    runs-on: ubuntu-latest
    steps:
      - name: "Check out PR HEAD"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: "Fetch Base Commit"
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha || 'main' }}

      # uv is a blazing-fast, single-binary replacement for pip, pipx, and virtualenv written in
      # Rust.
      # Modern Linux runners (Ubuntu 23.04+) enforce PEP 668 ("Externally Managed Environments").
      # This blocks standard 'pip install' commands from modifying the global system Python
      # interpreter to prevent OS instability. 'uv' natively works around this safely and cleanly by
      # utilizing fully isolated virtual environments under the hood.
      - name: "Setup uv"
        uses: "astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b"  # v8.1.0
        with:
          enable-cache: true

      # Instead of installing 'nox' system-wide (which violates PEP 668), we use 'uvx' (uv's fast
      # tool-runner equivalent to pipx) to run it in a temporary, isolated sandbox environment
      # without touching or dirtying the host runner's global python paths.
      - name: "Run code linting checks via Nox"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uvx nox -s lint

