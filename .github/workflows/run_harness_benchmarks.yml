# Runs the full-scope torch benchmark harness sweep
# (examples/benchmarks/harness_benchmark_registry.pbtxt) on demand.
#
# This is kept separate from Run Benchmarks so that the sweep -- 16 shards on
# each of v7 TPU and B200 GPU -- can be brought up a shard at a time without
# joining the nightly suite. Metrics are not published: the harness does not
# write TensorBoard event files yet, so a run's result is judged from the
# workload logs.
name: Run Harness Benchmarks

on:
  workflow_dispatch:
    inputs:
      benchmark_filter:
        description: "Regex to filter by benchmark name (e.g. 'torch_benchmarks_shard_00.*')."
        required: false
        type: string
        default: ""
      environment_filter:
        description: "Regex to filter by environment configuration ID ('tpu-v7' or 'gpu-b200-1')."
        required: false
        type: string
        default: ""
      custom_metadata:
        description: "JSON string of metadata to append to the benchmark result."
        required: false
        type: string
        default: "{}"

permissions:
  contents: read
  pull-requests: write

jobs:
  run_benchmarks:
    name: Run TorchTPU harness benchmarks
    uses: google-ml-infra/bap/.github/workflows/run-benchmarks.yaml@aa854ba7bdb77966a9cc1a013417f1c1a208c4c0 # main
    with:
      registry_file: "examples/benchmarks/harness_benchmark_registry.pbtxt"
      bap_ref: "aa854ba7bdb77966a9cc1a013417f1c1a208c4c0"
      runner: "linux-x86-n4-16"
      benchmark_filter: ${{ inputs.benchmark_filter }}
      environment_filter: ${{ inputs.environment_filter }}
      custom_metadata: ${{ inputs.custom_metadata }}
