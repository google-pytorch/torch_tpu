# PyTorch Out-of-Tree (OOT) / Cross-Repo CI Relay (CRCR) Integration (L2 & L3)
#
# Runs on:
#   1. Daily schedule (`10:30 UTC`), building and running the full enabled
#      upstream PyTorch device-generic test suite (`//tests/torch:all`) against
#      the latest PyTorch nightly CPU wheel (`--config=local_torch`), warming
#      the RBE build (`tensorflow-testing`) and test (`ml-oss-rbe-testing`)
#      caches and reporting `event-type: nightly` to the PyTorch CRCR HUD.
#   2. Upstream `pytorch/pytorch` CRCR `repository_dispatch` (`push` to
#      `refs/heads/main` and opt-in `ciflow/crcr*` `pull_request` events),
#      reusing the day's PyTorch nightly CPU wheel (`TORCH_SOURCE`) and running
#      the curated `crcr-smoke` suite (reusing cached results from the nightly
#      run when `torch_tpu` and the test module are unchanged) plus any enabled
#      `//tests/torch:<target>` whose `test/<module>.py` file was modified in
#      the commit/PR (`--nocache_test_results --remote_upload_local_results=false`
#      so modified test files execute fresh without poisoning the shared nightly
#      test cache). Note: because Step 1 reuses the day's prebuilt nightly CPU
#      wheel, commits that simultaneously modify `torch/` library internals and
#      `test/` assertions are evaluated against the nightly wheel binary until
#      the next nightly wheel build.
#   3. Manual `workflow_dispatch` (supporting `auto`, `all`, or `smoke` scope)
#      or PRs labeled `ci:crcr-nightly` (full) or `ci:crcr-smoke` (smoke).

name: PyTorch Out-of-Tree Dispatch

on:
  repository_dispatch:
    types: [push, pull_request]
  workflow_dispatch:
    inputs:
      torch_pip_spec:
        description: "Optional pip requirement of the PyTorch nightly CPU wheel (defaults to latest unpinned nightly 'torch')"
        required: false
        default: "torch"
        type: string
      pytorch_sha:
        description: "Optional pytorch/pytorch commit SHA to checkout for test/ (defaults to wheel git_version)"
        required: false
        default: ""
        type: string
      test_scope:
        description: "Test suite scope: 'auto' ('all' on schedule, 'smoke' + diff-touched test modules on dispatch), 'all', or 'smoke'"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - all
          - smoke
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "30 10 * * *"  # Run once daily at 10:30 UTC.

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'repository_dispatch' &&
        format('dispatch-{0}-{1}', github.event.action,
               github.event.client_payload.payload.pull_request.number || github.run_id) ||
      github.head_ref ||
      format('{0}-{1}', github.event_name, github.ref)
    }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' ||
        (github.event_name == 'repository_dispatch' && github.event.action == 'pull_request') }}

permissions:
  contents: read

jobs:
  resolve_sha:
    if: >-
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'ci:crcr-nightly') ||
        contains(github.event.pull_request.labels.*.name, 'ci:crcr-smoke')
      )) ||
      (github.event_name == 'repository_dispatch' && (
        (github.event.action == 'push' && github.event.client_payload.payload.ref == 'refs/heads/main') ||
        (github.event.action == 'pull_request' && (
          contains(github.event.client_payload.payload.pull_request.labels.*.name, 'ciflow/crcr') ||
          contains(github.event.client_payload.payload.pull_request.labels.*.name, 'ciflow/crcr-torch_tpu') ||
          startsWith(github.event.client_payload.payload.label.name, 'ciflow/crcr')
        ))
      ))
    name: "Resolve upstream PyTorch nightly wheel and SHA"
    runs-on: ubuntu-latest
    outputs:
      pytorch_sha: ${{ steps.resolve_sha.outputs.pytorch_sha }}
      wheel_sha: ${{ steps.resolve_sha.outputs.wheel_sha }}
      diff_base_sha: ${{ steps.resolve_sha.outputs.diff_base_sha }}
      torch_pip_spec: ${{ steps.resolve_sha.outputs.torch_pip_spec }}
      python_version: ${{ steps.resolve_sha.outputs.python_version }}
      crcr_event_type: ${{ steps.resolve_sha.outputs.crcr_event_type }}
      delivery_id: ${{ steps.resolve_sha.outputs.delivery_id }}
      effective_scope: ${{ steps.resolve_sha.outputs.effective_scope }}
    steps:
      - name: Checkout TorchTPU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: bazel/supported_python_versions.bzl
          sparse-checkout-cone-mode: false

      - name: Resolve PyTorch nightly wheel and SHA
        id: resolve_sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          INPUT_PIP_SPEC: ${{ inputs.torch_pip_spec || 'torch' }}
          INPUT_PYTORCH_SHA: ${{ inputs.pytorch_sha }}
          INPUT_TEST_SCOPE: ${{ inputs.test_scope || 'auto' }}
          PR_HAS_SMOKE_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:crcr-smoke') && !contains(github.event.pull_request.labels.*.name, 'ci:crcr-nightly') }}
          DISPATCH_PUSH_SHA: ${{ github.event.client_payload.payload.after }}
          DISPATCH_PR_SHA: ${{ github.event.client_payload.payload.pull_request.head.sha }}
          DISPATCH_PR_BASE_SHA: ${{ github.event.client_payload.payload.pull_request.base.sha }}
          DISPATCH_DELIVERY_ID: ${{ github.event.client_payload.delivery_id }}
        run: |
          PYTHON_VERSION=$(awk -F'"' '/^DEFAULT_PYTHON_VERSION =/ {print $2}' bazel/supported_python_versions.bzl)
          pip download --no-deps --pre "${INPUT_PIP_SPEC}" \
            --index-url https://download.pytorch.org/whl/nightly/cpu \
            -d /tmp/torch_whl --python-version "${PYTHON_VERSION}" --only-binary=:all:

          VERSION_PY=$(unzip -p /tmp/torch_whl/torch-*.whl torch/version.py)
          WHEEL_VERSION=$(printf '%s\n' "${VERSION_PY}" | awk -F"'" '/^__version__/ {print $2}')
          WHEEL_SHA=$(printf '%s\n' "${VERSION_PY}" | awk -F"'" '/^git_version/ {print $2}')

          if [ -z "${WHEEL_VERSION}" ] || [ -z "${WHEEL_SHA}" ]; then
            echo "::error::Failed to resolve wheel version (${WHEEL_VERSION}) or wheel SHA (${WHEEL_SHA})."
            exit 1
          fi

          DIFF_BASE_SHA="${WHEEL_SHA}"
          if [ -n "${INPUT_PYTORCH_SHA}" ]; then
            PYTORCH_SHA="${INPUT_PYTORCH_SHA}"
          elif [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            PYTORCH_SHA="${DISPATCH_PR_SHA:-${DISPATCH_PUSH_SHA}}"
            if [ "${EVENT_ACTION}" = "pull_request" ] && [ -n "${DISPATCH_PR_BASE_SHA}" ]; then
              DIFF_BASE_SHA="${DISPATCH_PR_BASE_SHA}"
            fi
          else
            PYTORCH_SHA="${WHEEL_SHA}"
          fi

          if [ -z "${PYTORCH_SHA}" ]; then
            echo "::error::Failed to resolve target PyTorch checkout SHA."
            exit 1
          fi

          if [ "${INPUT_TEST_SCOPE}" = "all" ] || [ "${INPUT_TEST_SCOPE}" = "smoke" ]; then
            EFFECTIVE_SCOPE="${INPUT_TEST_SCOPE}"
          elif [ "${EVENT_NAME}" = "repository_dispatch" ] || [ "${PR_HAS_SMOKE_LABEL}" = "true" ]; then
            EFFECTIVE_SCOPE="smoke"
          else
            EFFECTIVE_SCOPE="all"
          fi

          if [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            if [ -z "${DISPATCH_DELIVERY_ID}" ]; then
              echo "::error::Missing client_payload.delivery_id on repository_dispatch."
              exit 1
            fi
            CRCR_EVENT_TYPE="${EVENT_ACTION}"
            DELIVERY_ID="${DISPATCH_DELIVERY_ID}"
          else
            CRCR_EVENT_TYPE="nightly"
            DELIVERY_ID="${PYTORCH_SHA}"
          fi

          echo "[INFO] Resolved wheel torch==${WHEEL_VERSION} (wheel_sha=${WHEEL_SHA}, diff_base_sha=${DIFF_BASE_SHA}, target_sha=${PYTORCH_SHA}, scope=${EFFECTIVE_SCOPE}, event_type=${CRCR_EVENT_TYPE})"
          {
            echo "python_version=${PYTHON_VERSION}"
            echo "torch_pip_spec=torch==${WHEEL_VERSION}"
            echo "wheel_sha=${WHEEL_SHA}"
            echo "diff_base_sha=${DIFF_BASE_SHA}"
            echo "pytorch_sha=${PYTORCH_SHA}"
            echo "crcr_event_type=${CRCR_EVENT_TYPE}"
            echo "delivery_id=${DELIVERY_ID}"
            echo "effective_scope=${EFFECTIVE_SCOPE}"
          } >> "$GITHUB_OUTPUT"

      - name: Report resolve failure to CRCR
        if: failure() && github.event_name == 'repository_dispatch' && github.event.client_payload.delivery_id != ''
        continue-on-error: true
        timeout-minutes: 5
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@28dee7456d0348d74a5faa85098bb028b263ee2b  # main
        with:
          status: completed
          conclusion: failure
          job-name: "Resolve upstream PyTorch nightly wheel and SHA"
          delivery-id: ${{ github.event.client_payload.delivery_id }}
          event-type: ${{ github.event.action }}

  run_tests:
    needs: resolve_sha
    name: "PyTorch tests on ${{ matrix.job_info.name || matrix.job_info.runner }}"
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        job_info: [
          {
            name: "TPU v5",
            runner: "linux-x86-ct5lp-224-8tpu",
            config: "ci_tpu_v5",
          },
          {
            name: "TPU v7x",
            runner: "linux-x86-tpu7x-224-4tpu",
            config: "ci_tpu_v7",
          },
        ]
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:dddf008479144c57182b56a6d00bfc1f38f8f2ef206e2bc26ff6c0a401ded47e"  # Tag infrastructure-public-image-083516c6af6a (built 2026-10-13)
      options: --ipc=host

    steps:
      - name: Map runner work directory in container
        continue-on-error: true
        run: |
          if [ -d "/home/runner/_work" ] && [ ! -L "/home/runner/_work" ]; then
            rmdir /home/runner/_work
          fi
          mkdir -p /home/runner
          ln -sfn /__w /home/runner/_work

      - name: Report in_progress to CRCR
        if: github.event_name == 'repository_dispatch'
        continue-on-error: true
        timeout-minutes: 5
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@28dee7456d0348d74a5faa85098bb028b263ee2b  # main
        with:
          status: in_progress
          job-name: "PyTorch tests on ${{ matrix.job_info.name || matrix.job_info.runner }}"
          delivery-id: ${{ needs.resolve_sha.outputs.delivery_id }}
          event-type: ${{ needs.resolve_sha.outputs.crcr_event_type }}

      - name: Checkout TorchTPU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout PyTorch at resolved SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pytorch/pytorch
          ref: ${{ needs.resolve_sha.outputs.pytorch_sha }}
          path: pytorch

      - name: Fix Git Workspace Ownership
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/pytorch"

      - name: Download and Validate PyTorch Nightly Wheel
        env:
          PYTHON_VERSION: ${{ needs.resolve_sha.outputs.python_version }}
          TORCH_PIP_SPEC: ${{ needs.resolve_sha.outputs.torch_pip_spec }}
          EXPECTED_WHEEL_SHA: ${{ needs.resolve_sha.outputs.wheel_sha }}
        run: |
          mkdir -p dist/local
          pip download --no-deps --pre "${TORCH_PIP_SPEC}" \
            --index-url https://download.pytorch.org/whl/nightly/cpu \
            -d dist/local --python-version "${PYTHON_VERSION}" --only-binary=:all:
          set -- "$PWD/dist/local/torch-"*.whl
          [ -f "$1" ] || { echo "::error::Wheel not found for ${TORCH_PIP_SPEC}"; exit 1; }
          unzip -p "$1" torch/version.py | grep -F "${EXPECTED_WHEEL_SHA}"
          echo "TORCH_SOURCE=$1" >> "$GITHUB_ENV"

      - name: Build PyTorch Device-Generic Tests
        id: build
        env:
          EFFECTIVE_SCOPE: ${{ needs.resolve_sha.outputs.effective_scope }}
          WHEEL_SHA: ${{ needs.resolve_sha.outputs.wheel_sha }}
          DIFF_BASE_SHA: ${{ needs.resolve_sha.outputs.diff_base_sha }}
          PYTORCH_SHA: ${{ needs.resolve_sha.outputs.pytorch_sha }}
        run: |
          SMOKE_TAG=$(python3 -c 'from ci.tools import torch_test_module_utils as u; print(u.SMOKE_TEST_TAG)')
          ALL_ENABLED_TARGETS=$(bazel query 'kind("py_test", //tests/torch:all) - attr(tags, "\bnotest\b", //tests/torch:all)' | tr '\n' ' ')
          SMOKE_TARGETS=$(bazel query "attr(tags, \"\\b${SMOKE_TAG}\\b\", kind(\"py_test\", //tests/torch:all) - attr(tags, \"\\bnotest\\b\", //tests/torch:all))" | tr '\n' ' ')
          if [ "${EFFECTIVE_SCOPE}" = "smoke" ]; then
            BASE_TARGETS="${SMOKE_TARGETS}"
          else
            BASE_TARGETS="${ALL_ENABLED_TARGETS}"
          fi

          TOUCHED_TARGETS=""
          HELPER_TOUCHED=false
          for base_sha in "${DIFF_BASE_SHA}" "${WHEEL_SHA}"; do
            if [ "${base_sha}" != "${PYTORCH_SHA}" ] && ! git -C pytorch cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              git -C pytorch fetch --depth=1 --filter=blob:none origin "${base_sha}"
              if ! git -C pytorch cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
                echo "::error::Failed to fetch base SHA ${base_sha}."
                exit 1
              fi
            fi
          done

          if [ "${DIFF_BASE_SHA}" != "${PYTORCH_SHA}" ]; then
            DIFF_TEST_FILES=$(git -C pytorch diff --name-only --diff-filter=d "${DIFF_BASE_SHA}" "${PYTORCH_SHA}" -- 'test/')
            for f in ${DIFF_TEST_FILES}; do
              case "${f}" in
                test/test_*.py|test/*/test_*.py)
                  if [ "${f}" = "test/inductor/test_torchinductor.py" ]; then
                    HELPER_TOUCHED=true
                  fi
                  mod="${f#test/}"
                  mod="${mod%.py}"
                  target_name=$(python3 -c 'import sys; from ci.tools import torch_test_module_utils as u; print(u.torch_test_target_name(sys.argv[1]))' "${mod}")
                  candidate="//tests/torch:${target_name}"
                  case " ${ALL_ENABLED_TARGETS} " in
                    *" ${candidate} "*)
                      case " ${TOUCHED_TARGETS} " in
                        *" ${candidate} "*) ;;
                        *) TOUCHED_TARGETS="${TOUCHED_TARGETS} ${candidate}" ;;
                      esac
                      ;;
                  esac
                  ;;
                *)
                  HELPER_TOUCHED=true
                  ;;
              esac
            done
          fi

          # When DIFF_BASE_SHA differs from WHEEL_SHA (e.g. a PR whose base.sha is
          # older or newer than the nightly wheel), also check WHEEL_SHA..PYTORCH_SHA
          # against BASE_TARGETS so no target in CACHED_TARGETS reuses a WHEEL_SHA
          # cache entry when its test file at PYTORCH_SHA differs from WHEEL_SHA.
          if [ "${WHEEL_SHA}" != "${DIFF_BASE_SHA}" ] && [ "${WHEEL_SHA}" != "${PYTORCH_SHA}" ]; then
            WHEEL_DIFF_FILES=$(git -C pytorch diff --name-only --diff-filter=d "${WHEEL_SHA}" "${PYTORCH_SHA}" -- 'test/')
            for f in ${WHEEL_DIFF_FILES}; do
              case "${f}" in
                test/test_*.py|test/*/test_*.py)
                  if [ "${f}" = "test/inductor/test_torchinductor.py" ]; then
                    HELPER_TOUCHED=true
                  fi
                  mod="${f#test/}"
                  mod="${mod%.py}"
                  target_name=$(python3 -c 'import sys; from ci.tools import torch_test_module_utils as u; print(u.torch_test_target_name(sys.argv[1]))' "${mod}")
                  candidate="//tests/torch:${target_name}"
                  case " ${BASE_TARGETS} " in
                    *" ${candidate} "*)
                      case " ${TOUCHED_TARGETS} " in
                        *" ${candidate} "*) ;;
                        *) TOUCHED_TARGETS="${TOUCHED_TARGETS} ${candidate}" ;;
                      esac
                      ;;
                  esac
                  ;;
                *)
                  HELPER_TOUCHED=true
                  ;;
              esac
            done
          fi

          if [ "${HELPER_TOUCHED}" = "true" ]; then
            echo "[INFO] Shared test helper modified under test/; forcing uncached execution of base targets."
            for t in ${BASE_TARGETS}; do
              case " ${TOUCHED_TARGETS} " in
                *" ${t} "*) ;;
                *) TOUCHED_TARGETS="${TOUCHED_TARGETS} ${t}" ;;
              esac
            done
          fi

          CACHED_TARGETS=""
          for t in ${BASE_TARGETS}; do
            case " ${TOUCHED_TARGETS} " in
              *" ${t} "*) ;;
              *) CACHED_TARGETS="${CACHED_TARGETS} ${t}" ;;
            esac
          done

          ALL_BUILD_TARGETS="${CACHED_TARGETS} ${TOUCHED_TARGETS}"
          BAZEL_COMMON_ARGS="--config=${{ matrix.job_info.config }} --config=local_torch --repo_env=TORCH_SOURCE=${TORCH_SOURCE} --run_under=${PWD}/ci/tools/parallel_accelerator_execute.sh --test_env=TORCH_TPU_INTERNAL_PYTORCH_TEST_DIR=${GITHUB_WORKSPACE}/pytorch/test --keep_going"
          {
            echo "BAZEL_COMMON_ARGS=${BAZEL_COMMON_ARGS}"
            echo "BASE_TARGETS=${BASE_TARGETS}"
            echo "CACHED_TARGETS=${CACHED_TARGETS}"
            echo "TOUCHED_TARGETS=${TOUCHED_TARGETS}"
          } >> "$GITHUB_ENV"
          echo "[INFO] Building targets (cached_scope=${CACHED_TARGETS}, diff_touched=${TOUCHED_TARGETS:-none})"
          # shellcheck disable=SC2086
          bazel build ${BAZEL_COMMON_ARGS} ${ALL_BUILD_TARGETS}

      - name: Report build to CRCR
        if: >-
          always() && !cancelled() && steps.build.outcome != 'skipped' &&
          (github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main'))
        continue-on-error: true
        timeout-minutes: 5
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@28dee7456d0348d74a5faa85098bb028b263ee2b  # main
        with:
          status: completed
          conclusion: ${{ steps.build.outcome }}
          job-name: "Build PyTorch tests on ${{ matrix.job_info.name || matrix.job_info.runner }}"
          delivery-id: ${{ needs.resolve_sha.outputs.delivery_id }}
          event-type: ${{ needs.resolve_sha.outputs.crcr_event_type }}

      - name: Run PyTorch Device-Generic Tests
        env:
          ALLOW_CACHE_UPLOAD: ${{ github.ref_name == 'main' && (github.event_name == 'schedule' || (github.event_name == 'repository_dispatch' && github.event.action == 'push') || (github.event_name == 'workflow_dispatch' && inputs.pytorch_sha == '')) }}
        run: |
          rc=0
          CACHED_UPLOAD_FLAG=""
          if [ "${ALLOW_CACHE_UPLOAD}" != "true" ]; then
            CACHED_UPLOAD_FLAG="--remote_upload_local_results=false"
          fi
          if [ -n "${CACHED_TARGETS}" ]; then
            # shellcheck disable=SC2086
            bazel test ${BAZEL_COMMON_ARGS} ${CACHED_UPLOAD_FLAG} ${CACHED_TARGETS} || rc=$?
          fi
          if [ -n "${TOUCHED_TARGETS}" ]; then
            echo "[INFO] Re-running diff-touched test targets without test cache: ${TOUCHED_TARGETS}"
            # shellcheck disable=SC2086
            bazel test ${BAZEL_COMMON_ARGS} --nocache_test_results --remote_upload_local_results=false ${TOUCHED_TARGETS} || rc=$?
          fi
          exit "${rc}"

      - name: Report completion to CRCR
        if: >-
          always() &&
          (github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main'))
        continue-on-error: true
        timeout-minutes: 5
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@28dee7456d0348d74a5faa85098bb028b263ee2b  # main
        with:
          status: completed
          conclusion: ${{ job.status }}
          job-name: "PyTorch tests on ${{ matrix.job_info.name || matrix.job_info.runner }}"
          delivery-id: ${{ needs.resolve_sha.outputs.delivery_id }}
          event-type: ${{ needs.resolve_sha.outputs.crcr_event_type }}
