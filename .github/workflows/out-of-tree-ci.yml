# PyTorch Out-of-Tree (OOT) Dispatch / CRCR Integration
#
# Origin: Based on the PyTorch CRCR (Cross-Repository Continuous Registration) template
# https://github.com/pytorch/crcr-test/blob/main/README.md#step-3-create-a-dispatch-receiver-workflow.
#
# Purpose: Triggers CI runs in response to upstream PyTorch https://github.com/pytorch/pytorch push
# events via repository_dispatch webhooks, running the TorchTPU native test suite against new
# upstream commits and reporting status back to the PyTorch CRCR relay.
#
# Expected Behaviors:
# 1. The PyTorch CRCR relay sends a `repository_dispatch` webhook of type `push` when commits land
#    in upstream `main` or when a `ciflow` tag is created.
# 2. This workflow triggers, checking out TorchTPU and the specific PyTorch SHA provided in the
#    webhook payload (`client_payload.payload.after`).
# 3. It reports `in_progress` to CRCR, runs the TorchTPU native test targets, and reports the final
#    job conclusion back to CRCR via `pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback`.
#
# Anti-pattern warning: No `workflow_dispatch` triggers or remote connection debugging steps to this
# workflow. See go/ml-github-actions:connect#enable-workflow-dispatch.
# This workflow relies entirely on the `client_payload` from the `repository_dispatch` webhook to
# determine which PyTorch SHA to check out. A manual `workflow_dispatch` run will lack this payload,
# causing the PyTorch checkout step to fail or silently fall back to `main`, defeating the purpose
# of debugging a specific failing commit.
#
# Test: Because GitHub strictly limits `repository_dispatch` events to the default branch `main`, we
# physically cannot trigger the workflow from a PR. To test modifications to this workflow in a PR
# before merging, follow these steps:
# 1. Temporarily swap the `on: repository_dispatch` block below for a PR trigger:
#      on:
#        pull_request:
#          branches:
#            - main
# 2. In the "Checkout PyTorch at dispatched SHA" step, temporarily replace the `ref:` variable with
#    a hardcoded, valid PyTorch SHA.
# 3. Trigger the workflow.
# 4. CRITICAL: Revert these temporary changes in steps 1 and 2 before submitting your PR.

name: PyTorch Out-of-Tree Dispatch

on:
  repository_dispatch:
    types:
      - push

run-name: >-
  Dispatch - ${{ github.event.client_payload.payload.ref }}

concurrency:
  group: >-
    oot-${{ github.event.client_payload.payload.repository.full_name }}-${{ github.event.client_payload.payload.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run_tests:
    # Only trigger on upstream main branch merges and filter out the massive firehose of ciflow
    # tags, ghstack branches, and developer pushes that the PyTorch CRCR relay blindly forwards.
    if: github.event.client_payload.payload.ref == 'refs/heads/main'
    name: "Presubmit on ${{ matrix.job_info.name || matrix.job_info.runner }} against dispatched PyTorch"
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        job_info: [
          {
            name: "CPU",
            runner: "linux-x86-n4-16",
            config: "ci_cpu_presubmit",
            extra_flags: "",
          },
          {
            runner: "linux-x86-tpu7x-224-4tpu",
            config: "ci_tpu_v7_presubmit",
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"',
          }
        ]
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:30a9cf2ed330736957b3256dd3df69a13a556ae46626e9ad2ba205fa7a3c0051"  # Tag infrastructure-public-image-f0ac56f68949 (built 2026-09-21)

    steps:
      # The k8s container hook mounts the runner's /home/runner/_work volume at
      # /__w inside the job container. Composite actions that expand
      # ${{ github.action_path }} in `run:` reference /home/runner/_work/_actions,
      # so symlink /home/runner/_work -> /__w before invoking external composite actions.
      - name: Map runner work directory in container
        continue-on-error: true
        run: |
          if [ -d "/home/runner/_work" ] && [ ! -L "/home/runner/_work" ]; then
            rmdir /home/runner/_work
          fi
          mkdir -p /home/runner
          ln -sfn /__w /home/runner/_work

      - name: Report in_progress to CRCR
        continue-on-error: true
        timeout-minutes: 5
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@28dee7456d0348d74a5faa85098bb028b263ee2b  # main
        with:
          status: in_progress
          job-name: "Presubmit on ${{ matrix.job_info.name || matrix.job_info.runner }}"

      - name: Checkout TorchTPU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout PyTorch at dispatched SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pytorch/pytorch
          ref: ${{ github.event.client_payload.payload.after }}
          path: pytorch

      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run TorchTPU Native Tests
        env:
          PYTORCH_SHA: ${{ github.event.client_payload.payload.after }}
        run: |
          echo "Testing against PyTorch SHA: ${PYTORCH_SHA}"

          set +e
          bazel test //... \
            --config=${{ matrix.job_info.config }} \
            --override_repository="pytorch=$GITHUB_WORKSPACE/pytorch" \
            ${{ matrix.job_info.extra_flags }}

          BAZEL_EXIT_CODE=$?
          set -e

          if [ $BAZEL_EXIT_CODE -eq 4 ]; then
            echo "No tests found (Exit Code 4). Treating as success."
            exit 0
          elif [ $BAZEL_EXIT_CODE -ne 0 ]; then
            echo "Bazel test failed with exit code $BAZEL_EXIT_CODE."
            exit $BAZEL_EXIT_CODE
          fi

      - name: Log event to step summary
        if: always()
        env:
          EVENT_JSON: ${{ toJson(github.event) }}
        run: |
          {
            echo '```json'
            echo "$EVENT_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report completion to CRCR
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@28dee7456d0348d74a5faa85098bb028b263ee2b  # main
        with:
          status: completed
          conclusion: ${{ job.status }}
          job-name: "Presubmit on ${{ matrix.job_info.name || matrix.job_info.runner }}"
