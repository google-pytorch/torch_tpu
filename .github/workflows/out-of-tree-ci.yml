# PyTorch Out-of-Tree (OOT) / CRCR Nightly Integration
#
# Origin: Based on the PyTorch CRCR (Cross-Repository CI Relay) nightly callback pattern
# https://github.com/pytorch/crcr-test/blob/main/README.md.
#
# Purpose: Runs daily on a scheduled cadence (or on demand via workflow_dispatch / the
# `ci:crcr-nightly` PR label), running the TorchTPU native test suite against upstream
# https://github.com/pytorch/pytorch `main` and reporting status back to the PyTorch CRCR HUD
# (`event-type: nightly`).
#
# Expected Behaviors:
# 1. Runs once daily via `schedule` (`cron: "30 10 * * *"`), on manual `workflow_dispatch`, or on
#    PRs labeled with `ci:crcr-nightly`.
# 2. Checks out TorchTPU and resolves the latest `pytorch/pytorch` `main` SHA (or the optional
#    `pytorch_sha` input from `workflow_dispatch`).
# 3. Runs the TorchTPU native test targets and reports the final job conclusion to the CRCR HUD
#    (`https://hud.pytorch.org/crcr/google-pytorch/torch_tpu?event=nightly`) via
#    `pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback`.

name: PyTorch Out-of-Tree Dispatch

on:
  workflow_dispatch:
    inputs:
      pytorch_sha:
        description: "Optional upstream PyTorch commit SHA to test (defaults to refs/heads/main)"
        required: false
        type: string
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Run once daily at 10:30 UTC.
    - cron: "30 10 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  resolve_sha:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci:crcr-nightly')
    name: "Resolve upstream PyTorch SHA"
    runs-on: ubuntu-latest
    outputs:
      pytorch_sha: ${{ steps.resolve_sha.outputs.pytorch_sha }}
    steps:
      - name: Resolve PyTorch SHA
        id: resolve_sha
        env:
          INPUT_SHA: ${{ inputs.pytorch_sha }}
        run: |
          if [ -n "${INPUT_SHA}" ]; then
            PYTORCH_SHA="${INPUT_SHA}"
          else
            PYTORCH_SHA=$(git ls-remote https://github.com/pytorch/pytorch.git refs/heads/main | awk '{print $1}')
          fi
          if [ -z "${PYTORCH_SHA}" ]; then
            echo "::error::Failed to resolve upstream PyTorch SHA."
            exit 1
          fi
          echo "Resolved PyTorch SHA: ${PYTORCH_SHA}"
          echo "pytorch_sha=${PYTORCH_SHA}" >> "$GITHUB_OUTPUT"

  run_tests:
    needs: resolve_sha
    name: "Presubmit on ${{ matrix.job_info.name || matrix.job_info.runner }} against dispatched PyTorch"
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        job_info: [
          {
            name: "CPU",
            runner: "linux-x86-n4-16",
            config: "ci_cpu_presubmit",
            extra_flags: "",
          },
          {
            runner: "linux-x86-ct5lp-224-8tpu",
            config: "ci_tpu_v5_presubmit",
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"',
          },
          {
            runner: "linux-x86-tpu7x-224-4tpu",
            config: "ci_tpu_v7_presubmit",
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"',
          }
        ]
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:dddf008479144c57182b56a6d00bfc1f38f8f2ef206e2bc26ff6c0a401ded47e"  # Tag infrastructure-public-image-083516c6af6a (built 2026-10-13)
      # Disable ipc isolation to prevent shm limit issues.
      options: --ipc=host

    steps:
      # The k8s container hook mounts the runner's /home/runner/_work volume at
      # /__w inside the job container. Composite actions that expand
      # ${{ github.action_path }} in `run:` reference /home/runner/_work/_actions,
      # so symlink /home/runner/_work -> /__w before invoking external composite actions.
      - name: Map runner work directory in container
        continue-on-error: true
        run: |
          if [ -d "/home/runner/_work" ] && [ ! -L "/home/runner/_work" ]; then
            rmdir /home/runner/_work
          fi
          mkdir -p /home/runner
          ln -sfn /__w /home/runner/_work

      - name: Checkout TorchTPU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout PyTorch at resolved SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pytorch/pytorch
          ref: ${{ needs.resolve_sha.outputs.pytorch_sha }}
          path: pytorch

      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run TorchTPU Native Tests
        env:
          PYTORCH_SHA: ${{ needs.resolve_sha.outputs.pytorch_sha }}
        run: |
          echo "Testing against PyTorch SHA: ${PYTORCH_SHA}"

          bazel build //... \
            --config=${{ matrix.job_info.config }} \
            --override_repository="pytorch=$GITHUB_WORKSPACE/pytorch" \
            ${{ matrix.job_info.extra_flags }}

          set +e
          bazel test //... \
            --config=${{ matrix.job_info.config }} \
            --override_repository="pytorch=$GITHUB_WORKSPACE/pytorch" \
            ${{ matrix.job_info.extra_flags }}

          BAZEL_EXIT_CODE=$?
          set -e

          if [ $BAZEL_EXIT_CODE -eq 4 ]; then
            echo "No tests found (Exit Code 4). Treating as success."
            exit 0
          elif [ $BAZEL_EXIT_CODE -ne 0 ]; then
            echo "Bazel test failed with exit code $BAZEL_EXIT_CODE."
            exit $BAZEL_EXIT_CODE
          fi

      - name: Report completion to CRCR
        if: >-
          always() && !cancelled() &&
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main'))
        continue-on-error: true
        timeout-minutes: 5
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@28dee7456d0348d74a5faa85098bb028b263ee2b  # main
        with:
          status: completed
          conclusion: ${{ job.status }}
          job-name: "Presubmit on ${{ matrix.job_info.name || matrix.job_info.runner }}"
          delivery-id: ${{ needs.resolve_sha.outputs.pytorch_sha }}
          event-type: nightly

      - name: Log event to step summary
        if: always()
        env:
          EVENT_JSON: ${{ toJson(github.event) }}
        run: |
          if [ -f /tmp/relay_response.json ]; then
            echo "CRCR Relay response body:"
            cat /tmp/relay_response.json
            echo ""
          fi
          {
            echo '```json'
            echo "$EVENT_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
