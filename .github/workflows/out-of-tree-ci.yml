# PyTorch Out-of-Tree (OOT) / Cross-Repo CI Relay (CRCR) Integration (L2 & L3)
#
# Runs on:
#   1. Daily schedule (`10:30 UTC`, `effective_scope=all`): skips the CPU diff
#      job and builds/runs all enabled upstream PyTorch device-generic tests
#      (`//tests/torch:all`) against the latest PyTorch nightly CPU wheel
#      (`--config=local_torch` + `@pytorch_test`), warming the RBE build
#      (`tensorflow-testing`) and test (`ml-oss-rbe-testing`) caches and
#      reporting `event-type: nightly` to the PyTorch CRCR HUD.
#   2. Upstream `pytorch/pytorch` CRCR `repository_dispatch` (`push` to
#      `refs/heads/main` and opt-in `ciflow/crcr*` `pull_request` events,
#      `effective_scope=diff`): runs `ci/tools/oot_impacted_targets.py`
#      (git-diff over `@pytorch_test` declared inputs) on `ubuntu-latest` first.
#      Note: diff mode tests upstream `test/` at the head SHA against the latest
#      nightly CPU wheel (`test_files_only` scope), so upstream library-only API
#      changes may fail due to wheel skew until the next nightly wheel is built;
#      daily `scope=all` runs provide the full-suite backstop.
#      When 0 TPU targets are impacted, TPU VMs are never claimed and
#      `completed` (`success`, 0 impacted) callbacks are posted to CRCR; if
#      `compute_impacted` fails at any step (including timeout), `run_tests`
#      fails closed by falling back to a full run across all TPU jobs.
#   3. Manual `workflow_dispatch` (`auto`, `diff`, or `all`) or `torch_tpu` PRs
#      labeled `ci:crcr-nightly` (`all`). Manual `workflow_dispatch` runs only
#      report to CRCR when `ref_name == 'main'` and `effective_scope == 'all'`
#      so manual `diff` runs cannot overwrite `nightly` HUD status.

name: PyTorch Out-of-Tree Dispatch

on:
  repository_dispatch:
    types: [push, pull_request]
  workflow_dispatch:
    inputs:
      torch_pip_spec:
        description: "Optional pip requirement of the PyTorch nightly CPU wheel (defaults to latest unpinned nightly 'torch')"
        required: false
        default: "torch"
        type: string
      base_pytorch_sha:
        description: "Optional base pytorch/pytorch commit SHA for diff pre-filter (defaults to nightly wheel SHA or PR merge-base)"
        required: false
        default: ""
        type: string
      pytorch_sha:
        description: "Optional target pytorch/pytorch commit SHA to test (defaults to wheel git_version)"
        required: false
        default: ""
        type: string
      test_scope:
        description: "Test suite scope: 'auto' ('all' on schedule, 'diff' via git-diff pre-filter on dispatch), 'diff', or 'all'"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - diff
          - all
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "30 10 * * *"  # Run once daily at 10:30 UTC.

env:
  # Single source of truth for TPU test targets, runners, and Bazel configs.
  TPU_JOBS_JSON: '[{"name":"TPU v5","runner":"linux-x86-ct5lp-224-8tpu","config":"ci_tpu_v5"},{"name":"TPU v7x","runner":"linux-x86-tpu7x-224-4tpu","config":"ci_tpu_v7"}]'

concurrency:
  # Upstream `push` events share a single-flight group (cancel-in-progress:
  # false) and diff against `WHEEL_SHA`, so coalesced pushes never drop
  # intermediate test edits while bounding TPU runner usage.
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'repository_dispatch' && github.event.action == 'push' &&
        'dispatch-push-main' ||
      github.event_name == 'repository_dispatch' &&
        format('dispatch-{0}-{1}', github.event.action,
               github.event.client_payload.payload.pull_request.number || github.run_id) ||
      github.head_ref ||
      format('{0}-{1}', github.event_name, github.ref)
    }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' ||
        (github.event_name == 'repository_dispatch' && github.event.action == 'pull_request') }}

permissions:
  contents: read

jobs:
  resolve_sha:
    if: >-
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'ci:crcr-nightly')) ||
      (github.event_name == 'repository_dispatch' && (
        (github.event.action == 'push' &&
         github.event.client_payload.payload.ref == 'refs/heads/main' &&
         vars.CRCR_DIFF_PUSH_ENABLED != 'false') ||
        (github.event.action == 'pull_request' &&
         github.event.client_payload.payload.action != 'unlabeled' && (
          contains(github.event.client_payload.payload.pull_request.labels.*.name, 'ciflow/crcr') ||
          contains(github.event.client_payload.payload.pull_request.labels.*.name, 'ciflow/crcr-torch_tpu')
        ))
      ))
    name: "Resolve upstream PyTorch nightly wheel and SHA"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for OIDC auth in `cross-repo-ci-relay-callback` on failure.
      id-token: write
    outputs:
      python_version: ${{ steps.resolve_sha.outputs.python_version }}
      torch_pip_spec: ${{ steps.resolve_sha.outputs.torch_pip_spec }}
      wheel_sha: ${{ steps.resolve_sha.outputs.wheel_sha }}
      diff_base_sha: ${{ steps.resolve_sha.outputs.diff_base_sha }}
      pytorch_sha: ${{ steps.resolve_sha.outputs.pytorch_sha }}
      effective_scope: ${{ steps.resolve_sha.outputs.effective_scope }}
      crcr_event_type: ${{ steps.resolve_sha.outputs.crcr_event_type }}
      delivery_id: ${{ steps.resolve_sha.outputs.delivery_id }}
      should_report_crcr: ${{ steps.resolve_sha.outputs.should_report_crcr }}
      all_jobs: ${{ steps.resolve_sha.outputs.all_jobs }}
    steps:
      - name: Checkout TorchTPU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: bazel/supported_python_versions.bzl
          sparse-checkout-cone-mode: false

      - name: Resolve PyTorch nightly wheel and SHA
        id: resolve_sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PIP_SPEC: ${{ inputs.torch_pip_spec || 'torch' }}
          INPUT_BASE_PYTORCH_SHA: ${{ inputs.base_pytorch_sha }}
          INPUT_PYTORCH_SHA: ${{ inputs.pytorch_sha }}
          INPUT_TEST_SCOPE: ${{ inputs.test_scope || 'auto' }}
          DISPATCH_PUSH_SHA: ${{ github.event.client_payload.payload.after }}
          DISPATCH_PR_BASE_SHA: ${{ github.event.client_payload.payload.pull_request.base.sha }}
          DISPATCH_PR_SHA: ${{ github.event.client_payload.payload.pull_request.head.sha }}
          DISPATCH_DELIVERY_ID: ${{ github.event.client_payload.delivery_id }}
        run: |
          PYTHON_VERSION=$(awk -F'"' '/^DEFAULT_PYTHON_VERSION =/ {print $2}' bazel/supported_python_versions.bzl)
          pip download --no-deps --pre "${INPUT_PIP_SPEC}" \
            --index-url https://download.pytorch.org/whl/nightly/cpu \
            -d /tmp/torch_whl --python-version "${PYTHON_VERSION}" --only-binary=:all:

          VERSION_PY=$(unzip -p /tmp/torch_whl/torch-*.whl torch/version.py)
          WHEEL_VERSION=$(printf '%s\n' "${VERSION_PY}" | awk -F"'" '/^__version__/ {print $2}')
          WHEEL_SHA=$(printf '%s\n' "${VERSION_PY}" | awk -F"'" '/^git_version/ {print $2}')

          if [ -z "${WHEEL_VERSION}" ] || [ -z "${WHEEL_SHA}" ]; then
            echo "::error::Failed to resolve wheel version (${WHEEL_VERSION}) or wheel SHA (${WHEEL_SHA})."
            exit 1
          fi

          if [ -n "${INPUT_PYTORCH_SHA}" ]; then
            PYTORCH_SHA="${INPUT_PYTORCH_SHA}"
          elif [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            PYTORCH_SHA="${DISPATCH_PR_SHA:-${DISPATCH_PUSH_SHA}}"
          else
            PYTORCH_SHA="${WHEEL_SHA}"
          fi

          if [[ ! "${PYTORCH_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid or missing target PyTorch SHA: '${PYTORCH_SHA}'."
            exit 1
          fi

          if [ "${INPUT_TEST_SCOPE}" = "all" ] || [ "${INPUT_TEST_SCOPE}" = "diff" ]; then
            EFFECTIVE_SCOPE="${INPUT_TEST_SCOPE}"
          elif [ "${EVENT_NAME}" = "repository_dispatch" ] || [ -n "${INPUT_PYTORCH_SHA}" ] || [ -n "${INPUT_BASE_PYTORCH_SHA}" ]; then
            EFFECTIVE_SCOPE="diff"
          else
            EFFECTIVE_SCOPE="all"
          fi

          DIFF_BASE_SHA=""
          if [ -n "${INPUT_BASE_PYTORCH_SHA}" ]; then
            DIFF_BASE_SHA="${INPUT_BASE_PYTORCH_SHA}"
          elif [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            if [ "${EVENT_ACTION}" = "pull_request" ] && [ -n "${DISPATCH_PR_BASE_SHA}" ]; then
              DIFF_BASE_SHA="${DISPATCH_PR_BASE_SHA}"
            else
              # On `push`, diff against `WHEEL_SHA` so single-flight coalesced
              # runs never skip tests touched by intermediate pushes.
              DIFF_BASE_SHA="${WHEEL_SHA}"
            fi
          elif [ "${PYTORCH_SHA}" != "${WHEEL_SHA}" ]; then
            DIFF_BASE_SHA="${WHEEL_SHA}"
          fi

          if [ -n "${DIFF_BASE_SHA}" ] && [[ ! "${DIFF_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid base PyTorch SHA: '${DIFF_BASE_SHA}'."
            exit 1
          fi

          if [ "${EFFECTIVE_SCOPE}" = "diff" ] && [ -z "${DIFF_BASE_SHA}" ]; then
            echo "::warning::test_scope=diff requested without a distinct base SHA; falling back to effective_scope=all."
            EFFECTIVE_SCOPE="all"
          fi

          if [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            if [ -z "${DISPATCH_DELIVERY_ID}" ]; then
              echo "::error::Missing client_payload.delivery_id on repository_dispatch."
              exit 1
            fi
            CRCR_EVENT_TYPE="${EVENT_ACTION}"
            DELIVERY_ID="${DISPATCH_DELIVERY_ID}"
            SHOULD_REPORT_CRCR="true"
          elif [ "${EVENT_NAME}" = "schedule" ] || { [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${REF_NAME}" = "main" ] && [ "${EFFECTIVE_SCOPE}" = "all" ]; }; then
            CRCR_EVENT_TYPE="nightly"
            DELIVERY_ID="${PYTORCH_SHA}"
            SHOULD_REPORT_CRCR="true"
          else
            CRCR_EVENT_TYPE="nightly"
            DELIVERY_ID="${PYTORCH_SHA}"
            SHOULD_REPORT_CRCR="false"
          fi

          echo "[INFO] Resolved wheel torch==${WHEEL_VERSION} (wheel_sha=${WHEEL_SHA}, diff_base_sha=${DIFF_BASE_SHA:-none}, target_sha=${PYTORCH_SHA}, scope=${EFFECTIVE_SCOPE}, event_type=${CRCR_EVENT_TYPE}, report_crcr=${SHOULD_REPORT_CRCR})"
          {
            echo "python_version=${PYTHON_VERSION}"
            echo "torch_pip_spec=torch==${WHEEL_VERSION}"
            echo "wheel_sha=${WHEEL_SHA}"
            echo "diff_base_sha=${DIFF_BASE_SHA}"
            echo "pytorch_sha=${PYTORCH_SHA}"
            echo "effective_scope=${EFFECTIVE_SCOPE}"
            echo "crcr_event_type=${CRCR_EVENT_TYPE}"
            echo "delivery_id=${DELIVERY_ID}"
            echo "should_report_crcr=${SHOULD_REPORT_CRCR}"
            echo "all_jobs=${TPU_JOBS_JSON}"
          } >> "$GITHUB_OUTPUT"

      - name: Report resolve failure to CRCR
        if: failure() && github.event_name == 'repository_dispatch' && github.event.client_payload.delivery_id != ''
        continue-on-error: true
        timeout-minutes: 5
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@28dee7456d0348d74a5faa85098bb028b263ee2b  # main
        with:
          status: completed
          conclusion: failure
          job-name: "Resolve upstream PyTorch nightly wheel and SHA"
          delivery-id: ${{ github.event.client_payload.delivery_id }}
          event-type: ${{ github.event.action }}

  compute_impacted:
    needs: resolve_sha
    # Skip launching the CPU pre-filter altogether for full-suite (`all`) runs.
    if: needs.resolve_sha.outputs.effective_scope != 'all'
    name: "Compute impacted PyTorch TPU tests on CPU"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      is_full_run: ${{ steps.plan.outputs.is_full_run }}
      has_impacted_targets: ${{ steps.plan.outputs.has_impacted_targets }}
      has_skipped_jobs: ${{ steps.plan.outputs.has_skipped_jobs }}
      active_jobs: ${{ steps.plan.outputs.active_jobs }}
      skipped_jobs: ${{ steps.plan.outputs.skipped_jobs }}
    steps:
      - name: Checkout TorchTPU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            bazel/pytorch_test_repo.bzl
            ci/tools/oot_impacted_targets.py
            tests/torch/BUILD
          sparse-checkout-cone-mode: false

      - name: Initialize blobless PyTorch repository
        run: |
          git init -q "$GITHUB_WORKSPACE/pytorch"
          git -C "$GITHUB_WORKSPACE/pytorch" remote add origin https://github.com/pytorch/pytorch.git

      - name: Calculate impacted TPU tests
        id: diff
        # Fail closed: if the pre-filter errors (or if this job fails/times out
        # at any step), `run_tests` falls back to running the full suite.
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          DIFF_BASE_SHA: ${{ needs.resolve_sha.outputs.diff_base_sha }}
          PYTORCH_SHA: ${{ needs.resolve_sha.outputs.pytorch_sha }}
        run: |
          python3 --version
          EFFECTIVE_BASE_SHA="${DIFF_BASE_SHA}"
          if [ "${EVENT_NAME}" = "repository_dispatch" ] && [ "${EVENT_ACTION}" = "pull_request" ]; then
            # Use merge-base for PRs so stale PR branches do not over-select
            # tests modified on `main` after the PR branched.
            git -C "$GITHUB_WORKSPACE/pytorch" fetch --no-tags --filter=blob:none origin "${DIFF_BASE_SHA}" "${PYTORCH_SHA}" || true
            MERGE_BASE=$(git -C "$GITHUB_WORKSPACE/pytorch" merge-base "${DIFF_BASE_SHA}" "${PYTORCH_SHA}" 2>/dev/null || true)
            if [ -n "${MERGE_BASE}" ]; then
              echo "[INFO] Resolved PR merge-base: ${MERGE_BASE} (was ${DIFF_BASE_SHA})"
              EFFECTIVE_BASE_SHA="${MERGE_BASE}"
            fi
          fi
          SUMMARY_FILE="${GITHUB_STEP_SUMMARY:-/tmp/oot_step_summary.md}"
          python3 ci/tools/oot_impacted_targets.py \
            --workspace-dir "$GITHUB_WORKSPACE" \
            --pytorch-dir "$GITHUB_WORKSPACE/pytorch" \
            --base-sha "${EFFECTIVE_BASE_SHA}" \
            --head-sha "${PYTORCH_SHA}" \
            --impacted-targets-output "$GITHUB_WORKSPACE/impacted_targets.txt" \
            --markdown-output "${SUMMARY_FILE}" \
            --json-output "$GITHUB_WORKSPACE/oot_impact.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Consolidate execution plan
        id: plan
        env:
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
        run: |
          python3 - << 'EOF' >> "$GITHUB_OUTPUT"
          import json
          import os
          import pathlib
          import sys

          all_jobs = json.loads(os.environ["TPU_JOBS_JSON"])
          if os.environ.get("DIFF_OUTCOME") != "success":
            print(
                "::warning::Impacted target pre-filter failed; falling back to full TPU suite.",
                file=sys.stderr,
            )
            print("is_full_run=true")
            print("has_impacted_targets=true")
            print("has_skipped_jobs=false")
            print(f"active_jobs={json.dumps(all_jobs, separators=(',', ':'))}")
            print("skipped_jobs=[]")
            sys.exit(0)

          target_file = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "impacted_targets.txt"
          has_targets = target_file.is_file() and bool(
              target_file.read_text(encoding="utf-8").strip()
          )
          active = all_jobs if has_targets else []
          skipped = [] if has_targets else all_jobs

          print("is_full_run=false")
          print(f"has_impacted_targets={str(bool(active)).lower()}")
          print(f"has_skipped_jobs={str(bool(skipped)).lower()}")
          print(f"active_jobs={json.dumps(active, separators=(',', ':'))}")
          print(f"skipped_jobs={json.dumps(skipped, separators=(',', ':'))}")
          EOF

      - name: Upload impacted targets artifact
        if: steps.plan.outputs.is_full_run != 'true' && steps.plan.outputs.has_impacted_targets == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: impacted-targets
          path: impacted_targets.txt
          retention-days: 7
          overwrite: true

  report_zero_impact:
    needs: [resolve_sha, compute_impacted]
    if: >-
      needs.resolve_sha.outputs.should_report_crcr == 'true' &&
      needs.compute_impacted.result == 'success' &&
      needs.compute_impacted.outputs.is_full_run != 'true' &&
      needs.compute_impacted.outputs.has_skipped_jobs == 'true'
    name: "Report 0-impacted ${{ matrix.job_info.name }} to CRCR"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for OIDC auth in `cross-repo-ci-relay-callback`.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        job_info: ${{ fromJSON(needs.compute_impacted.outputs.skipped_jobs) }}
    steps:
      - name: Report 0-impacted build as success to CRCR
        continue-on-error: true
        timeout-minutes: 5
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@28dee7456d0348d74a5faa85098bb028b263ee2b  # main
        with:
          status: completed
          conclusion: success
          job-name: "Build PyTorch tests on ${{ matrix.job_info.name || matrix.job_info.runner }}"
          delivery-id: ${{ needs.resolve_sha.outputs.delivery_id }}
          event-type: ${{ needs.resolve_sha.outputs.crcr_event_type }}

      - name: Report 0-impacted tests as success to CRCR
        continue-on-error: true
        timeout-minutes: 5
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@28dee7456d0348d74a5faa85098bb028b263ee2b  # main
        with:
          status: completed
          conclusion: success
          job-name: "PyTorch tests on ${{ matrix.job_info.name || matrix.job_info.runner }}"
          delivery-id: ${{ needs.resolve_sha.outputs.delivery_id }}
          event-type: ${{ needs.resolve_sha.outputs.crcr_event_type }}

  run_tests:
    needs: [resolve_sha, compute_impacted]
    # Fail closed: run the full suite if `effective_scope == 'all'` OR if
    # `compute_impacted` failed at any step (including timeout).
    if: >-
      always() && !cancelled() &&
      needs.resolve_sha.result == 'success' &&
      (needs.resolve_sha.outputs.effective_scope == 'all' ||
       needs.compute_impacted.result == 'failure' ||
       (needs.compute_impacted.result == 'success' &&
        needs.compute_impacted.outputs.has_impacted_targets == 'true'))
    name: "PyTorch tests on ${{ matrix.job_info.name || matrix.job_info.runner }}"
    permissions:
      contents: read
      # GitHub Actions permissions are job-scoped; required here for CRCR OIDC
      # callbacks and RBE auth on ephemeral TPU runners.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        job_info: >-
          ${{ fromJSON((needs.resolve_sha.outputs.effective_scope == 'all' ||
                        needs.compute_impacted.result == 'failure') &&
                       needs.resolve_sha.outputs.all_jobs ||
                       needs.compute_impacted.outputs.active_jobs) }}
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:dddf008479144c57182b56a6d00bfc1f38f8f2ef206e2bc26ff6c0a401ded47e"  # Tag infrastructure-public-image-083516c6af6a (built 2026-10-13)
      options: --ipc=host

    steps:
      - name: Map runner work directory in container
        continue-on-error: true
        run: |
          if [ -d "/home/runner/_work" ] && [ ! -L "/home/runner/_work" ]; then
            rmdir /home/runner/_work
          fi
          mkdir -p /home/runner
          ln -sfn /__w /home/runner/_work

      - name: Report in_progress to CRCR
        if: github.event_name == 'repository_dispatch'
        continue-on-error: true
        timeout-minutes: 5
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@28dee7456d0348d74a5faa85098bb028b263ee2b  # main
        with:
          status: in_progress
          job-name: "PyTorch tests on ${{ matrix.job_info.name || matrix.job_info.runner }}"
          delivery-id: ${{ needs.resolve_sha.outputs.delivery_id }}
          event-type: ${{ needs.resolve_sha.outputs.crcr_event_type }}

      - name: Checkout TorchTPU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout PyTorch test/ at resolved SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pytorch/pytorch
          ref: ${{ needs.resolve_sha.outputs.pytorch_sha }}
          path: pytorch
          sparse-checkout: test

      - name: Fix Git Workspace Ownership
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/pytorch"

      - name: Download and Validate PyTorch Nightly Wheel
        env:
          PYTHON_VERSION: ${{ needs.resolve_sha.outputs.python_version }}
          TORCH_PIP_SPEC: ${{ needs.resolve_sha.outputs.torch_pip_spec }}
          EXPECTED_WHEEL_SHA: ${{ needs.resolve_sha.outputs.wheel_sha }}
        run: |
          mkdir -p dist/local
          pip download --no-deps --pre "${TORCH_PIP_SPEC}" \
            --index-url https://download.pytorch.org/whl/nightly/cpu \
            -d dist/local --python-version "${PYTHON_VERSION}" --only-binary=:all:
          set -- "$PWD/dist/local/torch-"*.whl
          [ -f "$1" ] || { echo "::error::Wheel not found for ${TORCH_PIP_SPEC}"; exit 1; }
          unzip -p "$1" torch/version.py | grep -F "${EXPECTED_WHEEL_SHA}"
          echo "TORCH_SOURCE=$1" >> "$GITHUB_ENV"

      - name: Download impacted targets artifact
        if: >-
          needs.resolve_sha.outputs.effective_scope != 'all' &&
          needs.compute_impacted.result == 'success' &&
          needs.compute_impacted.outputs.is_full_run != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: impacted-targets
          path: .

      - name: Build PyTorch Device-Generic Tests
        id: build
        env:
          IS_FULL_RUN: >-
            ${{ needs.resolve_sha.outputs.effective_scope == 'all' ||
                needs.compute_impacted.result == 'failure' ||
                needs.compute_impacted.outputs.is_full_run == 'true' }}
          BAZEL_CONFIG: ${{ matrix.job_info.config }}
          ALLOW_CACHE_UPLOAD: >-
            ${{ github.ref_name == 'main' &&
                (github.event_name == 'schedule' ||
                 (github.event_name == 'repository_dispatch' && github.event.action == 'push') ||
                 (github.event_name == 'workflow_dispatch' && inputs.pytorch_sha == '')) }}
        run: |
          if [ "${IS_FULL_RUN}" = "true" ]; then
            # `--test_tag_filters=-notest,-nobuild` applies only to `bazel test`,
            # so subtract `notest` and `nobuild` explicitly for `bazel build`.
            TARGET_ARGS=$(bazel query --repo_env=TORCH_TPU_INTERNAL_PYTORCH_TEST_DIR="${GITHUB_WORKSPACE}/pytorch/test" 'kind("py_test", //tests/torch:all) - attr(tags, "\b(notest|nobuild)\b", //tests/torch:all)' | tr '\n' ' ')
          else
            IMPACTED_FILE="impacted_targets.txt"
            echo "[INFO] Impacted targets for ${BAZEL_CONFIG}:"
            cat "${IMPACTED_FILE}"
            TARGET_ARGS="--skip_incompatible_explicit_targets --target_pattern_file=${IMPACTED_FILE}"
          fi
          CACHE_UPLOAD_FLAG=""
          if [ "${ALLOW_CACHE_UPLOAD}" != "true" ]; then
            CACHE_UPLOAD_FLAG="--remote_upload_local_results=false"
          fi
          BAZEL_CRCR_ARGS="--config=${BAZEL_CONFIG} --config=local_torch --repo_env=TORCH_SOURCE=${TORCH_SOURCE} --repo_env=TORCH_TPU_INTERNAL_PYTORCH_TEST_DIR=${GITHUB_WORKSPACE}/pytorch/test --run_under=${PWD}/ci/tools/parallel_accelerator_execute.sh --keep_going ${CACHE_UPLOAD_FLAG} ${TARGET_ARGS}"
          echo "BAZEL_CRCR_ARGS=${BAZEL_CRCR_ARGS}" >> "$GITHUB_ENV"
          # shellcheck disable=SC2086
          bazel build ${BAZEL_CRCR_ARGS}

      - name: Report build to CRCR
        # Skip CRCR reporting when cancelled so superseded PR runs are not
        # reported as failures.
        if: >-
          always() && !cancelled() && steps.build.outcome != 'skipped' &&
          needs.resolve_sha.outputs.should_report_crcr == 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@28dee7456d0348d74a5faa85098bb028b263ee2b  # main
        with:
          status: completed
          conclusion: ${{ steps.build.outcome }}
          job-name: "Build PyTorch tests on ${{ matrix.job_info.name || matrix.job_info.runner }}"
          delivery-id: ${{ needs.resolve_sha.outputs.delivery_id }}
          event-type: ${{ needs.resolve_sha.outputs.crcr_event_type }}

      - name: Run PyTorch Device-Generic Tests
        run: |
          # shellcheck disable=SC2086
          bazel test ${BAZEL_CRCR_ARGS}

      - name: Report completion to CRCR
        # Skip CRCR reporting when cancelled so superseded PR runs are not
        # reported as failures.
        if: >-
          always() && !cancelled() &&
          needs.resolve_sha.outputs.should_report_crcr == 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@28dee7456d0348d74a5faa85098bb028b263ee2b  # main
        with:
          status: completed
          conclusion: ${{ job.status }}
          job-name: "PyTorch tests on ${{ matrix.job_info.name || matrix.job_info.runner }}"
          delivery-id: ${{ needs.resolve_sha.outputs.delivery_id }}
          event-type: ${{ needs.resolve_sha.outputs.crcr_event_type }}
