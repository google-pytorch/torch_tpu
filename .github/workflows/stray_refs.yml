# Archives branches/tags that are based on the pre-rewrite (2026-10-07) git
# history and notifies whoever pushed them. See tools/stray_refs.py for the
# full contract.
#
# Every run scans *all* refs, so a run triggered by one push also catches
# anything an earlier run missed; the schedule is only a backstop for pushes
# whose workflow run was skipped (e.g. pushes made with a GITHUB_TOKEN).
name: Stray Refs

"on":
  push:
    # All branches and tags. Pushes made by this workflow itself (archive refs,
    # deletions) use GITHUB_TOKEN and therefore never re-trigger it.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Plan and git push --dry-run without changing anything"
        type: boolean
        default: true

permissions: {}

# Two runs racing on the same ref would trip each other's --force-with-lease;
# harmless, but queue them instead of cancelling so nothing is left half done.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sweep:
    name: Archive stray pre-rewrite refs
    runs-on: ubuntu-latest
    # Deleting a ref cannot introduce stray history.
    if: github.event_name != 'push' || !github.event.deleted
    timeout-minutes: 15
    permissions:
      contents: write        # git push refs/archive/*, delete branches/tags.
      issues: write          # Notify via issue.
      pull-requests: write   # Notify via PR comment.
    steps:
      # Always check out the default branch, never the pushed ref: the pushed
      # ref may be the 2 GiB pre-rewrite history this workflow exists to keep
      # out of clones.
      - name: Checkout sweeper script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: tools
          fetch-depth: 1
          persist-credentials: false

      - name: Sweep
        env:
          # A fine-grained PAT / app token stored as STRAY_REFS_TOKEN lets the
          # sweeper also undo stale force-pushes to protected branches; the
          # default token handles everything else.
          GITHUB_TOKEN: ${{ secrets.STRAY_REFS_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          STRAY_REFS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: ./tools/stray_refs.py
