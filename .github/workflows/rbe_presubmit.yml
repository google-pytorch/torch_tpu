name: CI - Presubmit on RBE

on:
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
      override_base_sha:
        description: 'Override Base SHA for bazel-diff (optional)'
        required: false
        type: string
      override_current_sha:
        description: 'Override Current SHA for bazel-diff (optional)'
        required: false
        type: string
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

# Cancel old jobs when they are replaced by new runs.
# When an unrelated label is added, isolate concurrency via run_id so we do not
# cancel any active in-flight runs.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.head_ref || github.ref }}-${{
      github.event.action == 'labeled'
      && !contains(fromJSON('["run-rbe"]'), github.event.label.name)
      && github.run_id || 'main'
    }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  rbe_presubmit:
    name: "Presubmit on RBE"
    # Trust model: same-repo PRs run PR-controlled code with the shared RBE mTLS
    # key available, and their actions can write to the shared Buildbarn cache.
    # This assumes everyone with push access is trusted. See the "Trust model"
    # section of docs/developers/native_rbe_architecture.md.
    if: >-
      (
        github.event_name != 'pull_request'
        || github.event.action != 'labeled'
        || contains(fromJSON('["run-rbe"]'), github.event.label.name)
      ) && (
        github.event_name == 'workflow_dispatch'
        || contains(github.event.pull_request.labels.*.name, 'run-rbe')
      ) && (
        github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository
      )
    timeout-minutes: 120
    runs-on: linux-x86-n4-16
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:30a9cf2ed330736957b3256dd3df69a13a556ae46626e9ad2ba205fa7a3c0051"  # Tag infrastructure-public-image-f0ac56f68949 (built 2026-09-21)
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}

      - name: Configure RBE mTLS Credentials
        env:
          RBE_CA_CERT: ${{ secrets.RBE_CA_CERT }}
          RBE_CLIENT_CERT: ${{ secrets.RBE_CLIENT_CERT }}
          RBE_CLIENT_KEY: ${{ secrets.RBE_CLIENT_KEY }}
        run: |
          umask 077
          mkdir -p /tmp/rbe-certs
          printf '%s\n' "$RBE_CA_CERT" > /tmp/rbe-certs/rbe_ca.crt
          printf '%s\n' "$RBE_CLIENT_CERT" > /tmp/rbe-certs/rbe_client.crt
          printf '%s\n' "$RBE_CLIENT_KEY" > /tmp/rbe-certs/rbe_client.key

      - name: Run Impacted Tests via bazel-diff
        uses: ./.github/actions/bazel-diff
        with:
          base_sha: ${{ inputs.override_base_sha }}
          current_sha: ${{ inputs.override_current_sha || github.sha }}
          bazel_config: "ci_rbe_presubmit"
          test_all: ${{ contains(github.event.pull_request.labels.*.name, 'ci:disable-bazel-diff') }}
