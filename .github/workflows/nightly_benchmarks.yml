name: Nightly Benchmarks

on:
  # Allow manual runs from the Actions tab and MLCompass autobisect dispatches.
  workflow_dispatch:
    inputs:
      benchmark_filter:
        description: "Regex to filter by benchmark name (e.g., 'torch_benchmarks_shard_00_of_16')."
        required: false
        type: string
        default: ""
      environment_filter:
        description: "Regex to filter by environment configuration ID (must contain 'tpu' or 'gpu' and target only one of them, e.g., 'tpu-v7.*' or 'gpu-b200')."
        required: false
        type: string
        default: ""
      custom_metadata:
        description: "JSON string of metadata to append to the benchmark result. Overwrites static metadata from the registry but is overwritten by dynamic metadata from the workload."
        required: false
        type: string
        default: ""
      experiment_ref:
        description: "Git ref (SHA, branch, or tag) of the user repository to run benchmarks against."
        required: false
        type: string
        default: ""

  schedule:
    - cron: "0 0 * * *"           # Daily 00:00 UTC: full TPU + GPU baseline
    - cron: "0 4,8,12,16,20 * * *" # Every 4h (except 00:00 UTC): fast compiled TPU lane

permissions:
  contents: read

jobs:
  build_wheel:
    name: Build torch_tpu wheel
    runs-on: linux-x86-n4-16
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:dddf008479144c57182b56a6d00bfc1f38f8f2ef206e2bc26ff6c0a401ded47e"  # Tag infrastructure-public-image-083516c6af6a (built 2026-10-13)
      # Disable ipc isolation to prevent shm limit issues.
      options: --ipc=host
    permissions:
      contents: read
    outputs:
      gcs_wheel_path: ${{ steps.build.outputs.gcs_wheel_path }}
      resolved_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout TorchTPU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.experiment_ref || github.ref_name }}
      - name: Resolve commit SHA
        id: resolve
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and upload wheel
        id: build
        uses: ./.github/actions/build-wheel
        with:
          python_version: 3.12

  run_tpu_benchmarks:
    name: Run TorchTPU TPU benchmarks
    needs: [build_wheel]
    if: ${{ !inputs.environment_filter || contains(inputs.environment_filter, 'tpu') }}
    permissions:
      contents: read
      pull-requests: write
    uses: google-ml-infra/bap/.github/workflows/run-benchmarks.yaml@ff212b97420bf479bd492d64e4b549534c22cd91 # main
    with:
      registry_file: "perflab/benchmark_registry.pbtxt"
      bap_ref: "ff212b97420bf479bd492d64e4b549534c22cd91"
      benchmark_filter: ${{ inputs.benchmark_filter }}
      environment_filter: ${{ inputs.environment_filter || 'tpu-v7' }}
      # experiment_ref is pinned to a commit SHA, so BAP would otherwise record
      # the SHA as the result's branch. When experiment_ref is unset, default
      # custom_metadata to the workflow branch so MLCompass ingest reads
      # metadata["branch"] without labelling ad-hoc experiment_ref runs.
      custom_metadata: ${{ inputs.custom_metadata || (!inputs.experiment_ref && format('{{"branch":"{0}"}}', github.ref_name)) || '{}' }}
      experiment_ref: ${{ needs.build_wheel.outputs.resolved_sha }}
      publish_metrics: true
      pub_sub_gcp_project_id: "ml-oss-benchmarking-production"
      pub_sub_gcp_topic_id: "private-torch-tpu-prod"
      runner: "linux-x86-n4-16"
      # absltest rejects a TEST_RANDOMIZE_ORDERING_SEED that is not a positive
      # integer, so the run ID rather than the commit SHA seeds the test order.
      custom_env_vars: |
        TORCH_TPU_WHEEL=${{ needs.build_wheel.outputs.gcs_wheel_path }}
        TORCH_TPU_PYTHON_VERSION=3.12
        TORCH_TPU_BENCHMARK_ORDER_SEED=${{ needs.build_wheel.outputs.resolved_sha }}
        TEST_RANDOMIZE_ORDERING_SEED=${{ github.run_id }}
        TESTBRIDGE_TEST_ONLY=${{ (github.event_name == 'schedule' && github.event.schedule != '0 0 * * *') && '*_compiled' || '' }}

  run_gpu_benchmarks:
    name: Run GPU baseline benchmarks
    # The GPU benchmarks also import torch_tpu, so they need the wheel too.
    needs: [build_wheel]
    if: ${{ (github.event_name == 'workflow_dispatch' && (!inputs.environment_filter || contains(inputs.environment_filter, 'gpu'))) || github.event.schedule == '0 0 * * *' }}
    permissions:
      contents: read
      pull-requests: write
    uses: google-ml-infra/bap/.github/workflows/run-benchmarks.yaml@ff212b97420bf479bd492d64e4b549534c22cd91 # main
    with:
      registry_file: "perflab/benchmark_registry.pbtxt"
      bap_ref: "ff212b97420bf479bd492d64e4b549534c22cd91"
      benchmark_filter: ${{ inputs.benchmark_filter }}
      environment_filter: ${{ inputs.environment_filter || 'gpu-b200' }}
      # experiment_ref is pinned to a commit SHA, so BAP would otherwise record
      # the SHA as the result's branch. When experiment_ref is unset, default
      # custom_metadata to the workflow branch so MLCompass ingest reads
      # metadata["branch"] without labelling ad-hoc experiment_ref runs.
      custom_metadata: ${{ inputs.custom_metadata || (!inputs.experiment_ref && format('{{"branch":"{0}"}}', github.ref_name)) || '{}' }}
      experiment_ref: ${{ needs.build_wheel.outputs.resolved_sha }}
      publish_metrics: true
      pub_sub_gcp_project_id: "ml-oss-benchmarking-production"
      pub_sub_gcp_topic_id: "private-torch-tpu-prod"
      runner: "linux-x86-n4-16"
      # TEST_RANDOMIZE_ORDERING_SEED must be a positive integer; see
      # run_tpu_benchmarks.
      custom_env_vars: |
        TORCH_TPU_WHEEL=${{ needs.build_wheel.outputs.gcs_wheel_path }}
        TORCH_TPU_PYTHON_VERSION=3.12
        TORCH_TPU_BENCHMARK_ORDER_SEED=${{ needs.build_wheel.outputs.resolved_sha }}
        TEST_RANDOMIZE_ORDERING_SEED=${{ github.run_id }}
