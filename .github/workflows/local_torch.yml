name: Build and Test Wheel against Local PyTorch

on:
  # Enable remote connections. Add a workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Stagger the schedule by 30 minutes to reduce contention with other nightly workflows.
    # Run every 4 hours every day in UTC (starts at 00:30, 04:30, etc.).
    - cron: "30 */4 * * *"

permissions:
  contents: read
  pull-requests: read
  issues: read

# Cancel old jobs when they are replaced by new runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch.
  cancel-in-progress: ${{ github.ref != 'main' }}

jobs:
  # Presubmit coverage for the local-torch build: build the wheel against a
  # local PyTorch and run the wheel smoke tests on every PR, so breakage in
  # the local-torch configuration (historically only exercised by the
  # schedule / the ci:local-torch label, and therefore invisible in
  # presubmit) surfaces before merge. The full bazel test suite still runs
  # only under the old conditions below.
  presubmit_build_and_smoke:
    name: "Presubmit Local Torch Build and Smoke Test"
    # The full job below already covers labeled PRs.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'ci:local-torch')
    # A CPU runner, deliberately: the job exists to catch local-torch *build
    # and ABI* breakage, which the CPU smoke tests (against the xla_cpu
    # backend) already surface, and TPU runner capacity is scarce. The full
    # job below still exercises the local-torch build on real TPUs.
    runs-on: linux-x86-n4-16
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:480f397c57207671315a27173ccec790ea9c66ef030af96cbe6ac9b4a6613996"  # Tag infrastructure-public-image-2c74567ee8e0
    steps:
      - name: Checkout TorchTPU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Wait for Connection
        uses: google-ml-infra/actions/ci_connection@9f8d7d8d9954430d0fef4a8cce2cb4e3844c200d
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Download PyTorch Nightly Wheel
        run: |
          # dist/local is reserved for the torch wheel this flow builds
          # against: the cpu-local nox session below picks the wheel up from
          # there, and a dedicated directory guarantees it was put there by
          # this process rather than being a leftover in the standard dist/
          # location.
          mkdir -p dist/local
          # Presubmit builds against the exact nightly snapshot pinned in
          # requirements/requirements_torch_nightly.txt (the same pin the
          # wheel's nightly glue and the nightly-pinned smoke tests use), so
          # the check is deterministic: upstream nightlies drift
          # C++-signature-incompatibly between snapshots, and chasing that
          # drift is the unpinned scheduled job's role below, not
          # presubmit's.
          TORCH_PIN=$(grep '^torch==' requirements/requirements_torch_nightly.txt)
          pip download --no-deps --pre "${TORCH_PIN}" --index-url https://download.pytorch.org/whl/nightly/cpu -d dist/local
          ls -lh dist/local/

          # These steps run under `sh`, which has no arrays: the self-hosted
          # runners execute `run:` blocks through the k8s container hook.
          # `set --` puts the glob matches in the positional parameters, so
          # "$1" is the wheel pip just downloaded.
          set -- "${PWD}"/dist/local/torch-*.whl
          WHEEL_PATH="$1"
          echo "TORCH_SOURCE=$WHEEL_PATH" >> "$GITHUB_ENV"
          echo "Exported TORCH_SOURCE=$WHEEL_PATH"
      - name: Build TorchTPU wheel
        run: |
          bazel build -c opt //ci/wheel:torch_tpu_wheel \
            --config=wheel_common \
            --config=local_torch \
            --color=yes --curses=no \
            --repo_env=TORCH_SOURCE="$TORCH_SOURCE"

          cp bazel-bin/ci/wheel/torch_tpu-*.whl dist/
      # The smoke tests install the freshly built wheel together with the
      # local torch wheel it was built against and exercise it on the CPU.
      - name: Run smoke tests via nox
        run: uvx nox --force-python 3.12 -s "smoke_test(cpu-local)"

  build_and_test_wheel:
    name: "Build and Test Wheel on ${{ matrix.job_info.runner }}"
    # Run nightly, or on PRs explicitly tagged with 'ci:local-torch'.
    if: >-
      github.event_name == 'schedule' ||
      contains(github.event.pull_request.labels.*.name, 'ci:local-torch')
    strategy:
      matrix:
        job_info: [
          {
            runner: "linux-x86-ct5lp-224-8tpu",
            source_test_config: "ci_tpu_v5",
            wheel_test_config: "wheel_test_tpu_v5",
          },
          {
            runner: "linux-x86-ct6e-180-8tpu",
            source_test_config: "ci_tpu_v6",
            wheel_test_config: "wheel_test_tpu_v6",
          },
          {
            runner: "linux-x86-tpu7x-224-4tpu",
            source_test_config: "ci_tpu_v7",
            wheel_test_config: "wheel_test_tpu_v7",
          }
        ]
    # Use self-hosted runners. For a Linux runner, a corresponding container image used for the
    # workflow is required.
    # See go/ml-github-actions/getting_started/using_runners.md#supported-runner-scale-set.
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:480f397c57207671315a27173ccec790ea9c66ef030af96cbe6ac9b4a6613996"  # Tag infrastructure-public-image-2c74567ee8e0
    steps:
      # Checkout torch_tpu into its own subdirectory: ${{ github.workspace }}/torch_tpu
      - name: Checkout TorchTPU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: torch_tpu

      # Enable remote connections. Add a waiting step.
      # See go/ml-github-actions:connect#add-waiting-step.
      - name: Wait for Connection
        uses: google-ml-infra/actions/ci_connection@9f8d7d8d9954430d0fef4a8cce2cb4e3844c200d
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}

      - name: Download PyTorch Nightly Wheel
        working-directory: ${{ github.workspace }}/torch_tpu
        run: |
          mkdir -p dist
          # Both rules_python and torch_local_repo will automatically ingest it from here.
          pip download --no-deps --pre torch --index-url https://download.pytorch.org/whl/nightly/cpu -d dist
          ls -lh dist/

          set -- "${PWD}"/dist/torch-*.whl
          WHEEL_PATH="$1"
          echo "TORCH_SOURCE=$WHEEL_PATH" >> "$GITHUB_ENV"
          echo "Exported TORCH_SOURCE=$WHEEL_PATH"

      # Build the TorchTPU wheel against the local PyTorch
      - name: Build TorchTPU wheel
        working-directory: ${{ github.workspace }}/torch_tpu
        run: |
          bazel build -c opt //ci/wheel:torch_tpu_wheel \
            --config=wheel_common \
            --config=local_torch \
            --color=yes --curses=no \
            --repo_env=TORCH_SOURCE="$TORCH_SOURCE"

          cp bazel-bin/ci/wheel/torch_tpu-*.whl dist/

      # Verify the TorchTPU wheel installs correctly in isolation.
      # Installing the wheel into an ephemeral and isolated virtual environment to prove the wheel
      # is valid without polluting the global environment and shadowing the source code during Bazel
      # tests.
      - name: Verify Wheel Installation
        working-directory: ${{ github.workspace }}/torch_tpu
        run: |
          uv run --isolated \
            --with dist/torch-*.whl \
            --with bazel-bin/ci/wheel/torch_tpu-*.whl \
            python -c "import torch_tpu; print('Successfully installed TorchTPU against local nightly PyTorch!')"

      - name: Test TorchTPU against Local PyTorch
        working-directory: ${{ github.workspace }}/torch_tpu
        run: |
          bazel test //... \
            --config=${{ matrix.job_info.source_test_config }} \
            --config=no_rbe \
            --google_default_credentials=true \
            --run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" \
            --config=local_torch \
            --repo_env=TORCH_SOURCE="$TORCH_SOURCE"

      - name: Test TorchTPU Wheel
        working-directory: ${{ github.workspace }}/torch_tpu
        run: |
          bazel test //... \
            --config=${{ matrix.job_info.wheel_test_config }} \
            --config=no_rbe \
            --google_default_credentials=true \
            --run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" \
            --config=local_torch \
            --repo_env=TORCH_SOURCE="$TORCH_SOURCE"

# TODO(b/558939987): consider re-enabling failure notifications
# once OSS builds stabilize.
