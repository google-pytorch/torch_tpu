name: CI - Nightly Unpinned Dependencies

on:
  # Enable remote connections. Add a workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Run automatically every day at 2:00 AM PDT (9:00 AM UTC)
    - cron: "0 9 * * *"

permissions:
  contents: read
  pull-requests: read

# Cancel old jobs when they are replaced by new runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch. Note this must be
  # `github.ref_name`, not `github.ref`, which is `refs/heads/main` on main.
  # See https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#github-context for more details.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  run_tests:
    name: "Nightly with Unpinned Dependencies on ${{ matrix.job_info.name || matrix.job_info.runner }} (Python ${{ matrix.python_version }})"
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci:unpinned-deps')
    strategy:
      fail-fast: false
      matrix:
        # When updating SUPPORTED_PYTHON_VERSIONS (or the latest supported version), also update:
        # - bazel/supported_python_versions.bzl
        python_version: [
          "3.11",
          "3.12",
          "3.13",
          "3.14",
          "3.15",
        ]
        job_info: [
          {
            name: "CPU",
            runner: "linux-x86-n4-16",
            config: "ci_cpu_nightly",
          }
        ]
        include:
          - python_version: "3.14"
            job_info:
              runner: "linux-x86-tpu7x-224-4tpu"
              config: "ci_tpu_v7_nightly"
    # Use self-hosted runners. For a Linux runner, a corresponding container image used for the
    # workflow is required.
    # See go/ml-github-actions/getting_started/using_runners.md#supported-runner-scale-set.
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:dddf008479144c57182b56a6d00bfc1f38f8f2ef206e2bc26ff6c0a401ded47e"  # Tag infrastructure-public-image-083516c6af6a (built 2026-10-13)
      # Disable ipc isolation to prevent shm limit issues.
      options: --ipc=host

    steps:
      # Clone the GitHub repository to runner's environment $GITHUB_WORKSPACE, making its files
      # accessible for workflow to use.
      - name: Checkout TorchTPU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Enable remote connections. Add a waiting step.
      # See go/ml-github-actions:connect#add-waiting-step.
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}

      # Alert when upstream packages start publishing wheels for newer Python
      # versions so we can remove the corresponding dependency workarounds.
      - name: Check Dependency Caveats
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
        run: |
          python3 ./ci/tools/check_dependency_caveats.py \
            --python-version "${PYTHON_VERSION}"

      # Resolve unpinned/highest upper bounds dependencies. Update the existing
      # requirements.txt with the newly resolved dependencies.
      - name: Resolve Unpinned Dependencies
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
        run: |
          PYTHON_VERSION_UND=$(echo "${PYTHON_VERSION}" | tr '.' '_')
          EXTRA_ARGS=()
          if [ "${PYTHON_VERSION}" = "3.15" ]; then
            # grain and array-record (a required Linux dependency of
            # tensorflow-datasets) do not publish source distributions or
            # Python 3.15 wheels on PyPI, and flax (via tensorstore/uvloop) and
            # dm-tree do not yet publish Python 3.15 binary wheels for their
            # C/C++ extensions. PyTorch < 2.15 blocks torch.compile on Python
            # 3.15, and torchax<=0.0.13 accesses torch.ops.aten.qr (removed in
            # PyTorch 2.15), so resolve torchax>=0.0.14.dev20261002 until
            # torchax 0.0.14 is released.
            EXTRA_ARGS+=(
              --overrides
              <(printf "grain ; python_version < '3.15'\ntensorflow-datasets ; python_version < '3.15'\nflax ; python_version < '3.15'\ndm-tree ; python_version < '3.15'\ntorchax>=0.0.14.dev20261002\n")
            )
          fi
          uv pip compile pyproject.toml \
            --all-extras \
            --python-version "${PYTHON_VERSION}" \
            --python-platform x86_64-manylinux_2_31 \
            --resolution highest \
            --generate-hashes \
            "${EXTRA_ARGS[@]}" \
            --output-file "requirements/requirements_${PYTHON_VERSION_UND}.txt"


      # Run the full test suite on CPU with Bazel using unpinned dependencies.
      - name: Run Bazel Tests
        if: matrix.job_info.config != 'ci_tpu_v7_nightly'
        run: |
          bazel test //... \
            --config=${{ matrix.job_info.config }} \
            --repo_env=HERMETIC_PYTHON_VERSION=${{ matrix.python_version }}

      # Run the full nightly TPU test suite with Bazel using unpinned dependencies.
      - name: Run Bazel TPU Tests
        if: matrix.job_info.config == 'ci_tpu_v7_nightly'
        run: |
          ALL_TESTS="//""..."
          TEST_TARGETS=$(bazel query "tests(${ALL_TESTS}) except attr(\"tags\", \"nonightly\", tests(${ALL_TESTS}))" | tr '\n' ' ')
          # shellcheck disable=SC2086
          bazel build \
            --config=${{ matrix.job_info.config }} \
            --repo_env=HERMETIC_PYTHON_VERSION=${{ matrix.python_version }} \
            --run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" \
            ${TEST_TARGETS}
          # shellcheck disable=SC2086
          bazel test \
            --config=${{ matrix.job_info.config }} \
            --repo_env=HERMETIC_PYTHON_VERSION=${{ matrix.python_version }} \
            --run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" \
            ${TEST_TARGETS}

      # Upload test logs on failure for triage.
      - name: Upload Test Logs on Failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: bazel-testlogs-${{ matrix.job_info.runner }}-${{ matrix.python_version }}
          path: bazel-testlogs/
          retention-days: 7

# TODO(b/558939987): consider re-enabling failure notifications
# once OSS builds stabilize.
