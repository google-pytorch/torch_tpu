name: On PR Close

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cancel_runs:
    name: Cancel In-flight PR Runs
    runs-on: ubuntu-latest
    permissions:
      actions: write  # Cancel workflow runs.
    steps:
      # Closing a PR creates a fresh batch of `pull_request` runs on the head
      # branch at the same instant as this one. Most of them are gated off and
      # settle as `skipped` within 7-18s, but the Mergify action lists runs ~5s
      # in and POSTs /cancel a couple of seconds later, so it races them and
      # dies on a 409. Wait for that batch to finalize first.
      #
      # 15s clears it with margin. Do not raise this much past 20s: the
      # `GitHub Actions Scan` run is also a cancellation target and finishes on
      # its own 21-65s in, so a longer wait just races that one instead.
      - name: Wait for PR-closure actions to finalize
        run: sleep 15

      - name: Cancel runs using upstream Mergify action
        uses: Mergifyio/gha-cancel-workflow-runs-on-pr-close@b6f38e95a59c8a14403d9a77da0908dbe2d78136  # 1.0.0

  cleanup_runs:
    name: Delete Cancelled PR Runs
    runs-on: ubuntu-latest
    needs: cancel_runs
    # A job `if:` with no status-check function gets `success()` ANDed in, so
    # without `always()` this job would be skipped whenever `cancel_runs` fails
    # (e.g. the Mergify action losing the 409 race described above), which is
    # exactly when there are cancelled runs left to delete. `always()` refers
    # to this workflow run's own status, not to the runs being cleaned up.
    #
    # Skip PRs from forks. GitHub gives those a read-only token, ignoring the
    # `actions: write` requested below, so every delete would 403 and fail the
    # job.
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write  # Delete workflow runs.
      contents: read  # Check out delete_cancelled_pr_runs.py.
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Delete cancelled PR runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 ./ci/tools/delete_cancelled_pr_runs.py \
            --head-ref "${HEAD_REF}" \
            --current-run-id "${CURRENT_RUN_ID}" \
            --repository "${REPOSITORY}"
