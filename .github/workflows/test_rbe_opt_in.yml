# Runs the presubmit test suite on Cloud TPU v5e hardware via native
# Remote Build Execution (Buildbarn REAPI v2).
#
# Opt in per PR with label:
#   ci:replace-tpu-v5   Runs the full-RBE path on standing Cloud TPU v5e workers.
#   ci:relay-tpu-v5     Alternative label alias for the RBE path.
#   run-rbe             Legacy label alias.

name: RBE Hardware TPU Tests (Opt-In)

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to execute'
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'tpu_v5e_only'
          - 'cpu_only'
      test_targets:
        description: 'Bazel test target(s) to run'
        type: string
        default: '//tests/pallas:pallas_test //tests:ops_test_tpu-v5lite'

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.head_ref || github.ref }}${{
    github.event.action == 'labeled'
    && !contains(fromJSON('["ci:replace-tpu-v5", "ci:relay-tpu-v5", "run-rbe"]'), github.event.label.name)
    && format('-ignored-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  RBE_BAZEL_FLAGS: --bes_backend=
  RBE_EXCLUDED_TARGETS: >-
    -//tests:fp4_test
    -//tests:ops_unit_test_tpu-v5lite
    -//tests:ops_unit_test_tpu-v6e
    -//tests:async_transfer_test
    -//tests:ops_unit_test_tier3_cache
    -//tests:ops_unit_test_tier3_cache_no_backup
    -//tests/compile:activation_checkpointing_mem_test
    -//tests/distributed:single_tpu_pg_test

jobs:
  run_tests:
    name: "${{ matrix.job_info.name }}"
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'ci:replace-tpu-v5')
      || contains(github.event.pull_request.labels.*.name, 'ci:relay-tpu-v5')
      || contains(github.event.pull_request.labels.*.name, 'run-rbe')
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        job_info:
          - name: "TPU v5e Tests (Full RBE)"
            runner: "linux-x86-n4-16"
            machine_type: "TPU v5e (RBE)"
            config: "ci_tpu_v5_full_rbe"
            suite: "tpu_v5e_only"
            extra_flags: "--test_tag_filters=presubmit-v5,-fails-on-tpu-v5,-nopresubmit,-notest,-nobuild"
    runs-on: linux-x86-n4-16
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:480f397c57207671315a27173ccec790ea9c66ef030af96cbe6ac9b4a6613996"
      options: --ipc=host
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Test Suite
        if: >-
          inputs.test_suite == null
          || inputs.test_suite == 'all'
          || inputs.test_suite == matrix.job_info.suite
        env:
          BAZEL_CONFIG: ${{ matrix.job_info.config }}
          EXTRA_FLAGS: ${{ matrix.job_info.extra_flags }}
        run: |
          if [ "${BAZEL_CONFIG}" = "ci_tpu_v5_full_rbe" ]; then
            echo "Runner VM Service Account: $(curl -s -H 'Metadata-Flavor: Google' http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/email || true)"
            echo "Active gcloud account: $(gcloud config get-value account 2>/dev/null || true)"
            gcloud auth list || true

            echo "Starting background IAP tunnel to Buildbarn frontend..."
            run_tunnel() {
              while true; do
                gcloud compute start-iap-tunnel \
                  rbe-tunnel-gateway 8980 \
                  --local-host-port=localhost:8980 \
                  --zone=us-east5-a \
                  --project=rbe-tpu-oss \
                  --iap-tunnel-disable-connection-check >> /tmp/iap_tunnel.log 2>&1 < /dev/null || true
                sleep 1
              done
            }
            run_tunnel &
            TUNNEL_PID=$!

            trap 'kill "$TUNNEL_PID" 2>/dev/null || true; pkill -f start-iap-tunnel 2>/dev/null || true; cat /tmp/iap_tunnel.log | tail -n 50 || true' EXIT

            CONNECTED=0
            for _ in {1..30}; do
              if (echo > /dev/tcp/127.0.0.1/8980) >/dev/null 2>&1; then
                echo "Buildbarn RBE frontend reachable on 127.0.0.1:8980 via IAP tunnel."
                CONNECTED=1
                break
              fi
              sleep 1
            done

            if [ "$CONNECTED" -ne 1 ]; then
              echo "ERROR: Failed to establish IAP tunnel to Buildbarn frontend on 127.0.0.1:8980"
              cat /tmp/iap_tunnel.log || true
              exit 1
            fi
          fi

          TARGETS="${{ inputs.test_targets || '//tests/pallas:pallas_test //tests:ops_test_tpu-v5lite' }}"

          # shellcheck disable=SC2086
          bazel test \
            "--config=${BAZEL_CONFIG}" \
            --nocache_test_results \
            --test_output=errors \
            ${RBE_BAZEL_FLAGS} \
            ${EXTRA_FLAGS} \
            -- ${TARGETS}
