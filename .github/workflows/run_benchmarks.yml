name: Run Benchmarks

on:
  # Allow manual runs from the Actions tab for testing
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"  # Runs at 00:00 UTC every day
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  run_benchmarks:
    name: Run TorchTPU benchmarks
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci:benchmarks')
    uses: google-ml-infra/actions/.github/workflows/run-benchmarks.yaml@39838909a83f01eb2d61de181ea843bb48ee9269
    with:
      registry_file: "examples/benchmarks/benchmark_registry.pbtxt"
      ml_actions_ref: "39838909a83f01eb2d61de181ea843bb48ee9269"
