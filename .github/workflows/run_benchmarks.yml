name: Run Benchmarks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark_filter:
        description: "Regex to filter by benchmark name (e.g., 'test_qwen3.*')."
        required: false
        type: string
        default: ""
      environment_filter:
        description: "Regex to filter by environment configuration ID (e.g., 'tpu-v7.*')."
        required: false
        type: string
        default: ""
      custom_metadata:
        description: "JSON string of metadata to append to the benchmark result."
        required: false
        type: string
        default: "{}"
      torch_tpu_wheel:
        description: "gs:// path to an already-built torch_tpu wheel to benchmark."
        required: false
        type: string
        default: ""
      python_version:
        description: "Python version."
        required: false
        type: choice
        default: "3.14"
        options:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

permissions:
  contents: read
  pull-requests: write

jobs:
  build_wheel:
    name: Build torch_tpu wheel
    if: ${{ !inputs.torch_tpu_wheel }}
    runs-on: linux-x86-n4-16
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:30a9cf2ed330736957b3256dd3df69a13a556ae46626e9ad2ba205fa7a3c0051"
      options: --ipc=host
    permissions:
      contents: read
    outputs:
      gcs_wheel_path: ${{ steps.build.outputs.gcs_wheel_path }}
    steps:
      - name: Checkout TorchTPU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build and upload wheel
        id: build
        uses: ./.github/actions/build-wheel
        with:
          python_version: ${{ inputs.python_version || '3.14' }}
  run_benchmarks:
    name: Run TorchTPU benchmarks
    needs: [build_wheel]
    if: >-
      !cancelled() &&
      (needs.build_wheel.result == 'success' ||
       needs.build_wheel.result == 'skipped')
    uses: google-ml-infra/bap/.github/workflows/run-benchmarks.yaml@ff212b97420bf479bd492d64e4b549534c22cd91
    with:
      registry_file: "examples/benchmarks/e2e/harness/benchmark_registry.pbtxt"
      bap_ref: "ff212b97420bf479bd492d64e4b549534c22cd91"
      runner: "linux-x86-n4-16"
      benchmark_filter: ${{ inputs.benchmark_filter || '(model_benchmarks|layer_benchmarks)_(with_cl|without_cl)_.*' }}
      environment_filter: ${{ inputs.environment_filter || 'tpu-v7' }}
      publish_metrics: true
      pub_sub_gcp_project_id: "ml-oss-benchmarking-production"
      pub_sub_gcp_topic_id: "private-torch-tpu-prod"
      custom_metadata: >-
        ${{ inputs.custom_metadata || format('{{"pr_number": "{0}", "sha": "{1}", "mlcompass_execution_mode": "cbuild"}}', github.event.pull_request.number, github.sha) }}
      custom_env_vars: |
        TORCH_TPU_WHEEL=${{ inputs.torch_tpu_wheel || needs.build_wheel.outputs.gcs_wheel_path }}
        TORCH_TPU_PYTHON_VERSION=${{ inputs.python_version || '3.14' }}
