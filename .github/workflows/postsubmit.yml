name: CI - Postsubmit

on:
  schedule:
    # Run periodic heavy evaluations every 4 hours
    - cron: '0 */4 * * *'
  # Enable remote connections. Add a workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: read

# Concurrency for postsubmit:
# Differentiate push runs from schedule runs so heavy 4-hour benchmark runs don't block push postsubmits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run_tests:
    name: "Postsubmit on ${{ matrix.job_info.name || matrix.job_info.runner }}"
    if: >-
      (github.event_name == 'push' && github.ref_name == 'main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:postsubmit'))
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        job_info: [
          {
            name: "CPU",
            runner: "linux-x86-n4-16",
            bazel_config: "ci_cpu",
            extra_flags: "",
          },
          {
            runner: "linux-x86-ct5lp-224-8tpu",
            bazel_config: "ci_tpu_v5",
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"',
          },
          {
            runner: "linux-x86-ct6e-180-8tpu",
            bazel_config: "ci_tpu_v6",
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"',
          },
          {
            runner: "linux-x86-tpu7x-224-4tpu",
            bazel_config: "ci_tpu_v7",
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh"',
          }
        ]
    # Use self-hosted runners. See go/tt-devguide#test-machines for more details about the runners.
    # For a Linux runner, a corresponding container image used for the workflow is required.
    # See go/ml-github-actions/getting_started/using_runners.md#supported-runner-scale-set.
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:480f397c57207671315a27173ccec790ea9c66ef030af96cbe6ac9b4a6613996"  # Tag infrastructure-public-image-2c74567ee8e0
    steps:
      - run: echo "Start running tests."
      # Clone the GitHub repository to runner's environment $GITHUB_WORKSPACE, making its files
      # accessible for workflow to use. Otherwise, the workflow cannot find the files (e.g. ls -lR
      # will return "total 0").
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories:
      # https://github.blog/open-source/git/git-security-vulnerability-announced/#cve-2022-24765.
      # Tell Git explicitly to trust the workspace `/__w/torch_tpu/torch_tpu` inside this ephemeral
      # container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Skip execution on outdated intermediate push events if a newer commit has landed on main.
      - name: Skip if superseded by newer main HEAD
        id: check_superseded
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main --quiet
          LATEST_SHA=$(git rev-parse origin/main)
          if [ "$GITHUB_SHA" != "$LATEST_SHA" ]; then
            echo "::notice::Commit $GITHUB_SHA is superseded by latest main HEAD ($LATEST_SHA). Exiting early to process latest HEAD."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # Enable remote connections. Add a waiting step.
      # See go/ml-github-actions:connect#add-waiting-step.
      - name: Wait For Connection
        if: steps.check_superseded.outputs.skip != 'true'
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      # We don't need a separate step for bazel build as bazel test will also build the code before
      # running the tests. This allows test building and test running to overlap and reduce total
      # build time.
      - name: Run Bazel Test
        if: steps.check_superseded.outputs.skip != 'true'
        run: bazel test --config=${{ matrix.job_info.bazel_config }} ${{ matrix.job_info.extra_flags }} //...
      - name: Upload Test Logs on Failure
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392  # v4.0.0
        if: failure()
        with:
          name: bazel-testlogs-${{ matrix.job_info.runner }}
          path: bazel-testlogs/
          retention-days: 7

  build_wheels:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: linux-x86-n4-16
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:480f397c57207671315a27173ccec790ea9c66ef030af96cbe6ac9b4a6613996"  # Tag infrastructure-public-image-2c74567ee8e0
    outputs:
      gcs_wheel_path: ${{ steps.build.outputs.gcs_wheel_path }}
      gcs_wheel_dir: ${{ steps.build.outputs.gcs_wheel_dir }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - name: Build and upload wheel
        id: build
        uses: ./.github/actions/build-wheel
        with:
          python_version: "3.12"

  vllm_perf_eval:
    name: "vLLM Perf Eval"
    needs: [build_wheels]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: linux-x86-tpu7x-224-4tpu
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:480f397c57207671315a27173ccec790ea9c66ef030af96cbe6ac9b4a6613996"  # Tag infrastructure-public-image-2c74567ee8e0
    timeout-minutes: 180

    env:
      FORCE_COLOR: "1"
      UV_NO_CACHE: "1"
      TQDM_MININTERVAL: "30"

    steps:
      - name: Redirect torch_tpu cache off /dev/shm
        run: |
          mkdir -p /tmp/torch_tpu_cache
          ln -sfn /tmp/torch_tpu_cache /dev/shm/torch_tpu_cache

      - name: Checkout torch_tpu
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Install SSH
        run: |
          apt-get update && apt-get install -y openssh-client || true

      - name: Checkout torchtpu-vllm
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          repository: google-pytorch/torchtpu-vllm
          path: torchtpu-vllm
          ref: main
          ssh-key: ${{ secrets.TORCHTPU_VLLM_DEPLOY_KEY }}

      - name: Setup uv
        uses: astral-sh/setup-uv@2af22b5b2dcfc0729ee842c635f300f1fc5a9e9a  # v5.0.0

      - name: Setup Virtual Environment
        run: |
          uv venv
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Download wheel from GCS
        shell: bash
        env:
          GCS_WHEEL_PATH: ${{ needs.build_wheels.outputs.gcs_wheel_path }}
        run: |
          mkdir dist
          gcloud storage cp "${GCS_WHEEL_PATH}" dist/

      - name: Install torchtpu-vllm with local wheel override
        run: |
          cd torchtpu-vllm

          WHEEL_FILE=$(ls ../dist/*.whl | head -n 1)
          if [ -z "$WHEEL_FILE" ]; then
            echo "Error: No wheel found in ../dist/"
            exit 1
          fi
          WHEEL_ABS_PATH=$(realpath "$WHEEL_FILE")
          echo "torch_tpu @ file://$WHEEL_ABS_PATH" > overrides.txt

          uv --no-config pip install .[test,benchmarking] \
            --override overrides.txt --prerelease allow

      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}

      - name: Run perf and eval guard configs
        shell: bash
        env:
          MODEL_IMPL_TYPE: vllm
          BENCHMARK_WARMUP_RUNS: "1"
        run: |
          cd torchtpu-vllm
          ./scripts/vllm/benchmarking/run_benchmarks.sh --config qwen3-coder-30b-fp8-tp8-ep --results-dir /tmp/perf_eval_qwen3
          python3 scripts/vllm/benchmarking/check_regression.py --mode perf --results-dir /tmp/perf_eval_qwen3 --baseline scripts/vllm/benchmarking/baselines/perf/qwen3-coder-30b-fp8-tp8-ep.baseline.json

  notify_failure:
    name: Notify Failed Runs
    needs: [run_tests, build_wheels, vllm_perf_eval]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Get current date
        id: date
        if: (contains(needs.run_tests.result, 'failure') || contains(needs.build_wheels.result, 'failure') || contains(needs.vllm_perf_eval.result, 'failure')) && github.event_name != 'pull_request'
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - name: Check whether one of the jobs failed
        if: (contains(needs.run_tests.result, 'failure') || contains(needs.build_wheels.result, 'failure') || contains(needs.vllm_perf_eval.result, 'failure')) && github.event_name != 'pull_request'
        uses: jayqi/failed-build-issue-action@1a893bbf43ef1c2a8705e2b115cd4f0fe3c5649b  # v1.2.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-name: "ci:tpu-postsubmit-failed"
          title-template: "Failed Postsubmit on TPU (${{ steps.date.outputs.date }})"
