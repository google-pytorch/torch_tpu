name: CI - Upstream PyTorch Tests

on:
  # Enable remote connections. Add a workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
      pytorch-git-ref:
        description: 'Git ref to checkout pytorch/pytorch'
        type: string
        default: 'ff30875f25530b355ab830bbde00b7a5363bafa4'
      torch-pip-spec:
        description: 'The pip requirement of the torch wheel'
        type: string
        default: 'torch==2.16.0.dev20261012+cpu'
      torch-pip-index:
        description: 'The pip index URL to download the torch wheel from'
        type: string
        default: 'https://download.pytorch.org/whl/nightly/cpu'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 7 * * *'  # Run automatically every day at 0:00 AM PDT

permissions:
  contents: read
  pull-requests: read
  issues: read

# Cancel old jobs when they are replaced by new runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch. Note this must be
  # `github.ref_name`, not `github.ref`, which is `refs/heads/main` on main.
  # See https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#github-context for more details.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  run_tests:
    name: "PyTorch tests on ${{ matrix.job_info.name || matrix.job_info.runner }}"
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci:torch-tests')
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        job_info: [
          {
            name: "TPU v5",
            runner: "linux-x86-ct5lp-224-8tpu",
            config: "ci_tpu_v5",
          },
          {
            name: "TPU v7x",
            runner: "linux-x86-tpu7x-224-4tpu",
            config: "ci_tpu_v7",
          },
        ]
    # Use self-hosted runners. For a Linux runner, a corresponding container image used for the
    # workflow is required.
    # See go/ml-github-actions/getting_started/using_runners.md#supported-runner-scale-set.
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:dddf008479144c57182b56a6d00bfc1f38f8f2ef206e2bc26ff6c0a401ded47e"  # Tag infrastructure-public-image-083516c6af6a (built 2026-10-13)
      # Disable ipc isolation to prevent shm limit issues.
      options: --ipc=host

    steps:
      # The k8s container hook mounts the runner's /home/runner/_work volume at
      # /__w inside the job container. Composite actions that expand
      # ${{ github.action_path }} in `run:` reference /home/runner/_work/_actions,
      # so symlink /home/runner/_work -> /__w before invoking external composite actions.
      - name: Map runner work directory in container
        continue-on-error: true
        run: |
          if [ -d "/home/runner/_work" ] && [ ! -L "/home/runner/_work" ]; then
            rmdir /home/runner/_work
          fi
          mkdir -p /home/runner
          ln -sfn /__w /home/runner/_work

      - name: Checkout TorchTPU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Enable remote connections. Add a waiting step.
      # See go/ml-github-actions:connect#add-waiting-step.
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}

      - name: Checkout PyTorch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pytorch/pytorch
          path: pytorch
          ref: ${{ inputs.pytorch-git-ref || 'ff30875f25530b355ab830bbde00b7a5363bafa4' }}

      - name: Fix Git Workspace Ownership
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/pytorch"

      - name: Resolve PyTorch SHA
        id: resolve_sha
        run: |
          PYTORCH_SHA=$(git -C "$GITHUB_WORKSPACE/pytorch" rev-parse HEAD)
          if [ -z "${PYTORCH_SHA}" ]; then
            echo "::error::Failed to resolve checked-out PyTorch commit SHA."
            exit 1
          fi
          echo "[INFO] Resolved PyTorch SHA: ${PYTORCH_SHA}"
          echo "pytorch_sha=${PYTORCH_SHA}" >> "$GITHUB_OUTPUT"

      - name: Extract Default Python Version
        run: |
          PYTHON_VERSION=$(grep '^DEFAULT_PYTHON_VERSION =' bazel/supported_python_versions.bzl | cut -d '"' -f2)
          echo "PYTHON_VERSION=${PYTHON_VERSION}" >> "$GITHUB_ENV"
          echo "[INFO] Extracted default Python version: ${PYTHON_VERSION}"

      - name: Download PyTorch Wheel
        env:
          TORCH_PIP_SPEC: ${{ inputs.torch-pip-spec || 'torch==2.16.0.dev20261012+cpu' }}
          TORCH_PIP_INDEX: ${{ inputs.torch-pip-index || 'https://download.pytorch.org/whl/nightly/cpu' }}
          EXPECTED_PYTORCH_SHA: ${{ steps.resolve_sha.outputs.pytorch_sha }}
        run: |
          mkdir -p dist/local
          pip download --no-deps --pre "${TORCH_PIP_SPEC}" \
            --index-url "${TORCH_PIP_INDEX}" -d dist/local \
            --python-version "${PYTHON_VERSION}" --only-binary=:all:
          set -- "$PWD/dist/local/torch-"*.whl
          if [ ! -f "$1" ]; then
            echo "::error::Failed to download PyTorch wheel for ${TORCH_PIP_SPEC}."
            exit 1
          fi
          export TORCH_SOURCE="$1"
          echo "TORCH_SOURCE=${TORCH_SOURCE}" >> "$GITHUB_ENV"
          echo "[INFO] Downloaded PyTorch wheel to: ${TORCH_SOURCE}"

          python3 - << 'EOF'
          import os, sys, zipfile
          wheel_path = os.environ["TORCH_SOURCE"]
          expected_sha = os.environ["EXPECTED_PYTORCH_SHA"]
          pip_spec = os.environ["TORCH_PIP_SPEC"]
          ns = {}
          with zipfile.ZipFile(wheel_path) as zf:
            exec(zf.read("torch/version.py").decode("utf-8"), ns)
          wheel_version = ns.get("__version__", "")
          wheel_sha = ns.get("git_version", "")
          print(f"[INFO] Validated wheel metadata: __version__={wheel_version}, git_version={wheel_sha}")
          if pip_spec.startswith("torch=="):
            expected_version = pip_spec.split("==", 1)[1]
            if wheel_version != expected_version:
              sys.exit(f"ERROR: Wheel __version__ ({wheel_version}) does not match TORCH_PIP_SPEC ({expected_version}).")
          if wheel_sha != expected_sha:
            sys.exit(f"ERROR: Wheel git_version ({wheel_sha}) does not match checked-out PyTorch SHA ({expected_sha}).")
          EOF

      - name: Build Bazel Targets
        id: build
        env:
          EXPECTED_PYTORCH_SHA: ${{ steps.resolve_sha.outputs.pytorch_sha }}
        run: |
          TORCH_TEST_TARGETS=$(bazel query 'kind("py_test", //tests/torch:all)' | tr '\n' ' ')
          echo "TORCH_TEST_TARGETS=${TORCH_TEST_TARGETS}" >> "$GITHUB_ENV"
          echo "[INFO] Building test targets: ${TORCH_TEST_TARGETS}"

          # Leave ${TORCH_TEST_TARGETS} unquoted so space-separated targets expand.
          # shellcheck disable=SC2086
          bazel build \
            --config=${{ matrix.job_info.config }} \
            --config=local_torch \
            --repo_env=TORCH_SOURCE="$TORCH_SOURCE" \
            --run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" \
            --test_env=TORCH_TPU_INTERNAL_PYTORCH_TEST_DIR="$GITHUB_WORKSPACE/pytorch/test" \
            --keep_going \
            ${TORCH_TEST_TARGETS}

          LOCAL_TORCH_VERSION_PY="$(bazel info output_base)/external/+_repo_rules+local_torch/site-packages/torch/version.py"
          if [ ! -f "${LOCAL_TORCH_VERSION_PY}" ]; then
            echo "::error::@local_torch repository did not extract torch/version.py at ${LOCAL_TORCH_VERSION_PY}."
            exit 1
          fi
          grep -F "${EXPECTED_PYTORCH_SHA}" "${LOCAL_TORCH_VERSION_PY}"
          echo "[INFO] Verified @local_torch extracted wheel matching SHA ${EXPECTED_PYTORCH_SHA}:"
          cat "${LOCAL_TORCH_VERSION_PY}"

      - name: Report build to CRCR
        # TODO(b/566301487): CRITICAL - Temporary PR allowance to verify CRCR HUD reporting before submitting.
        # Restore `(github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main'))` before landing.
        if: always() && !cancelled() && steps.build.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 5
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@28dee7456d0348d74a5faa85098bb028b263ee2b  # main
        with:
          status: completed
          conclusion: ${{ steps.build.outcome }}
          job-name: "Build PyTorch tests on ${{ matrix.job_info.name || matrix.job_info.runner }}"
          delivery-id: ${{ steps.resolve_sha.outputs.pytorch_sha }}
          event-type: nightly

      - name: Run Bazel Test
        run: |
          echo "[INFO] Running test targets: ${TORCH_TEST_TARGETS}"

          # Leave ${TORCH_TEST_TARGETS} unquoted so space-separated targets expand.
          # shellcheck disable=SC2086
          bazel test \
            --config=${{ matrix.job_info.config }} \
            --config=local_torch \
            --repo_env=TORCH_SOURCE="$TORCH_SOURCE" \
            --run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" \
            --test_env=TORCH_TPU_INTERNAL_PYTORCH_TEST_DIR="$GITHUB_WORKSPACE/pytorch/test" \
            --keep_going \
            ${TORCH_TEST_TARGETS}

      - name: Report completion to CRCR
        # TODO(b/566301487): CRITICAL - Temporary PR allowance to verify CRCR HUD reporting before submitting.
        # Restore `(github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main'))` before landing.
        if: always() && !cancelled()
        continue-on-error: true
        timeout-minutes: 5
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@28dee7456d0348d74a5faa85098bb028b263ee2b  # main
        with:
          status: completed
          conclusion: ${{ job.status }}
          job-name: "PyTorch tests on ${{ matrix.job_info.name || matrix.job_info.runner }}"
          delivery-id: ${{ steps.resolve_sha.outputs.pytorch_sha }}
          event-type: nightly
