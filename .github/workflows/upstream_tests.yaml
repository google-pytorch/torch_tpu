name: CI - Upstream PyTorch Tests

on:
  # Enable remote connections. Add a workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
      pytorch-ref:
        description: 'pytorch/pytorch git ref for the test sources (tag, branch, or "main" for nightly-tracking runs)'
        type: string
        default: 'v2.13.0'
      torch-version:
        description: 'torch wheel to run against (--//:_torch_version); keep matching pytorch-ref. E.g. 2.13.0, or 2.15.0 for the nightly channel.'
        type: string
        default: '2.13.0'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 7 * * *'  # Run automatically every day at 0:00 AM PDT

permissions:
  contents: read
  pull-requests: read
  issues: read

# Cancel old jobs when they are replaced by new runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch
  cancel-in-progress: ${{ github.ref != 'main' }}

jobs:
  run_tests:
    name: "PyTorch tests on ${{ matrix.job_info.name || matrix.job_info.runner }}"
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci:upstream-tests')
    strategy:
      fail-fast: false
      matrix:
        job_info: [
          {
            name: "TPU v7",
            runner: "linux-x86-tpu7x-224-4tpu",
            config: "ci_tpu_v7",
            # parallel_accelerator_execute.sh assigns each concurrent test
            # (shard) its own TPU chip, so override the config's
            # --local_test_jobs=1 to use all 4 chips. --test_timeout raises
            # the per-shard ceiling for the large upstream suites (targets
            # declare timeout="long"). --keep_going surfaces every failing
            # suite instead of stopping at the first one. The generated
            # targets carry the "nobuild" tag (suppresses build_test
            # companions and keeps them out of the ordinary TPU CI configs),
            # so this dedicated workflow must override the config's tag
            # filters (last flag wins) to actually run them.
            extra_flags: '--run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" --local_test_jobs=4 --test_timeout=3600 --keep_going --build_tag_filters= --test_tag_filters=-notest --test_env=TORCH_TPU_INTERNAL_PYTORCH_TEST_DIR=$GITHUB_WORKSPACE/pytorch/test',
            target: "//tests/torch:all",
          },
        ]
    # Use self-hosted runners. For a Linux runner, a corresponding container image used for the
    # workflow is required.
    # See go/ml-github-actions/getting_started/using_runners.md#supported-runner-scale-set.
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:480f397c57207671315a27173ccec790ea9c66ef030af96cbe6ac9b4a6613996"  # Tag infrastructure-public-image-2c74567ee8e0

    steps:
      - name: Checkout TorchTPU
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0
        with:
          persist-credentials: false

      # Enable remote connections. Add a waiting step.
      # See go/ml-github-actions:connect#add-waiting-step.
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}

      # The tested PyTorch version is configured here (not in Bazel): the
      # sources come from this checkout ref, and the matching torch wheel is
      # selected with --//:_torch_version. Dispatch with pytorch-ref=main +
      # torch-version=<nightly channel> to exercise the newest upstream
      # tests against the nightly wheel.
      - name: Checkout PyTorch
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0
        with:
          repository: pytorch/pytorch
          path: pytorch
          ref: ${{ inputs.pytorch-ref || 'v2.13.0' }}
          persist-credentials: false

      # Collect-everything-then-exclude: probe the checkout for every module
      # that instantiates device-generic tests for the tpu backend and
      # generate one torch_tpu_oss_torch_test target each into
      # tests/torch/BUILD (customizations live in tests/torch_test_targets.py).
      - name: Generate upstream test targets
        env:
          TORCH_VERSION: ${{ inputs.torch-version || '2.13.0' }}
        run: >-
          bazel run --config=${{ matrix.job_info.config }}
          --//:_torch_version="$TORCH_VERSION"
          //tests:gen_torch_tests --
          --pytorch_test_dir="$GITHUB_WORKSPACE/pytorch/test"

      - name: Run Bazel Test
        env:
          TORCH_VERSION: ${{ inputs.torch-version || '2.13.0' }}
        run: >-
          bazel test --config=${{ matrix.job_info.config }}
          --//:_torch_version="$TORCH_VERSION"
          ${{ matrix.job_info.extra_flags }} ${{ matrix.job_info.target }}
