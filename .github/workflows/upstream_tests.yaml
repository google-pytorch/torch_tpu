name: CI - Upstream PyTorch Tests

on:
  # Enable remote connections. Add a workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
      pytorch-git-ref:
        description: 'Git ref to checkout pytorch/pytorch'
        type: string
        default: 'ff30875f25530b355ab830bbde00b7a5363bafa4'
      torch-pip-spec:
        description: 'The pip requirement of the torch wheel'
        type: string
        default: 'torch==2.16.0.dev20261012+cpu'
      torch-pip-index:
        description: 'The pip index URL to download the torch wheel from'
        type: string
        default: 'https://download.pytorch.org/whl/nightly/cpu'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 7 * * *'  # Run automatically every day at 0:00 AM PDT

permissions:
  contents: read
  pull-requests: read
  issues: read

# Cancel old jobs when they are replaced by new runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch. Note this must be
  # `github.ref_name`, not `github.ref`, which is `refs/heads/main` on main.
  # See https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#github-context for more details.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  run_tests:
    name: "PyTorch tests on ${{ matrix.job_info.name || matrix.job_info.runner }}"
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci:torch-tests')
    strategy:
      fail-fast: false
      matrix:
        job_info: [
          {
            name: "TPU v5",
            runner: "linux-x86-ct5lp-224-8tpu",
            config: "ci_tpu_v5",
          },
        ]
    # Use self-hosted runners. For a Linux runner, a corresponding container image used for the
    # workflow is required.
    # See go/ml-github-actions/getting_started/using_runners.md#supported-runner-scale-set.
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:dddf008479144c57182b56a6d00bfc1f38f8f2ef206e2bc26ff6c0a401ded47e"  # Tag infrastructure-public-image-083516c6af6a (built 2026-10-13)

    steps:
      - name: Checkout TorchTPU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Enable remote connections. Add a waiting step.
      # See go/ml-github-actions:connect#add-waiting-step.
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}

      - name: Checkout PyTorch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pytorch/pytorch
          path: pytorch
          ref: ${{ inputs.pytorch-git-ref || 'ff30875f25530b355ab830bbde00b7a5363bafa4' }}

      - name: Extract Default Python Version
        run: |
          PYTHON_VERSION=$(grep '^DEFAULT_PYTHON_VERSION =' bazel/supported_python_versions.bzl | cut -d '"' -f2)
          echo "PYTHON_VERSION=${PYTHON_VERSION}" >> "$GITHUB_ENV"
          echo "[INFO] Extracted default Python version: ${PYTHON_VERSION}"

      - name: Download PyTorch Wheel
        env:
          TORCH_PIP_SPEC: ${{ inputs.torch-pip-spec || 'torch==2.16.0.dev20261012+cpu' }}
          TORCH_PIP_INDEX: ${{ inputs.torch-pip-index || 'https://download.pytorch.org/whl/nightly/cpu' }}
        run: |
          mkdir -p dist/local
          pip download --no-deps --pre "${TORCH_PIP_SPEC}" \
            --index-url "${TORCH_PIP_INDEX}" -d dist/local \
            --python-version "${PYTHON_VERSION}" --only-binary=:all:
          set -- "$PWD/dist/local/torch-"*.whl
          echo "TORCH_SOURCE=$1" >> "$GITHUB_ENV"
          echo "[INFO] Downloaded PyTorch wheel to: $1"

      - name: Run Bazel Test
        run: |
          TORCH_TEST_TARGETS=$(bazel query 'kind("py_test", //tests/torch:all)' | tr '\n' ' ')
          echo "[INFO] Running test targets: ${TORCH_TEST_TARGETS}"

          # Leave ${TORCH_TEST_TARGETS} unquoted so space-separated targets expand.
          # shellcheck disable=SC2086
          bazel build \
            --config=${{ matrix.job_info.config }} \
            --config=local_torch \
            --repo_env=TORCH_SOURCE="$TORCH_SOURCE" \
            --run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" \
            --test_env=TORCH_TPU_INTERNAL_PYTORCH_TEST_DIR="$GITHUB_WORKSPACE/pytorch/test" \
            --keep_going \
            ${TORCH_TEST_TARGETS}
          # shellcheck disable=SC2086
          bazel test \
            --config=${{ matrix.job_info.config }} \
            --config=local_torch \
            --repo_env=TORCH_SOURCE="$TORCH_SOURCE" \
            --run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" \
            --test_env=TORCH_TPU_INTERNAL_PYTORCH_TEST_DIR="$GITHUB_WORKSPACE/pytorch/test" \
            --keep_going \
            ${TORCH_TEST_TARGETS}
