name: 'Run tests with bazel-diff'
description: 'Calculates impacted Bazel targets using bazel-diff and runs them.'
inputs:
  base_sha:
    description: >-
      Base commit SHA for diff comparison. Optional.
      If omitted or running on a PR synthetic merge commit, the base SHA is
      automatically resolved to the CI-runtime parent commit (CURRENT_SHA^1).
    required: false
    default: ''
  current_sha:
    description: 'Current commit SHA'
    required: true
  bazel_config:
    description: 'Bazel --config flag to use'
    required: true
  extra_bazel_flags:
    description: 'Additional flags for the Bazel test command'
    required: false
    default: ''
  disable_bazel_diff:
    description: 'Set to true to completely bypass bazel-diff'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Execute bazel-diff script
      run: bash $GITHUB_WORKSPACE/.github/actions/bazel-diff/run_bazel_diff.sh "$GITHUB_WORKSPACE" "${{ inputs.base_sha }}" "${{ inputs.current_sha }}" "${{ inputs.bazel_config }}" "${{ inputs.extra_bazel_flags }}" "${{ inputs.disable_bazel_diff }}"
      shell: bash
