# Activates the CI network policy for the rest of the job. Add it right after
# the first actions/checkout step of every job; ci/tools/network_policy_test.py
# enforces that. The policy itself lives in ci/tools/network_policy/policy.env;
# see ci/README.md.
name: Activate CI network policy
description: >-
  Exports the retry and timeout policy from ci/tools/network_policy/policy.env
  to every later step of the job (uv, pip and curl).

runs:
  using: composite
  steps:
    - name: Activate CI network policy
      shell: bash
      run: "$GITHUB_ACTION_PATH/../../../ci/tools/network_policy/activate.sh"
