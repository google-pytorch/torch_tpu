name: "Build and Upload Wheel"

description: "Builds a torch_tpu wheel, runs twine checks, and uploads to GCS"
inputs:
  python_version:
    description: "Python version to build for"
    required: true
  extra_bazel_args:
    description: >-
      Extra bazel arguments appended to the shared build script's invocation
      (e.g. --//:include_nightly_glue=False for the release wheel flavor
      without the PyTorch-nightly glue). Raw flags only -- do not pass
      --config=wheel_common or --config=wheel_release here: the script
      already applies wheel_common, and expanding it a second time repeats
      its --remote_default_exec_properties entries, which crashes bazel with
      a duplicate-key error.
    required: false
    default: ""
outputs:
  gcs_wheel_path:
    description: "The GCS path to the built wheel file"
    value: ${{ steps.upload.outputs.gcs_wheel_path }}
  gcs_wheel_dir:
    description: "The GCS directory containing the built wheel"
    value: ${{ steps.upload.outputs.gcs_wheel_dir }}
runs:
  using: "composite"
  steps:
    # The build itself lives in the shared ci/build_wheels.sh -- the same
    # script the Kokoro publisher runs -- so the wheel CI tests is built
    # exactly like the wheel that gets published.
    - name: Build wheel
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python_version }}
        EXTRA_BAZEL_ARGS: ${{ inputs.extra_bazel_args }}
      run: |
        read -ra EXTRA_ARGS <<< "${EXTRA_BAZEL_ARGS}"
        ci/build_wheels.sh --output-dir dist "${PYTHON_VERSION}" -- \
          --color=yes --curses=no ${EXTRA_ARGS[@]+"${EXTRA_ARGS[@]}"}
    - name: Check wheel metadata
      shell: bash
      run: |
        WHEEL_DIR=dist
        uv run --isolated --with twine twine check $WHEEL_DIR/*.whl
    - name: Upload wheel to GCS
      id: upload
      shell: bash
      run: |
        WHEEL_DIR=dist
        WHEEL_PATH=$(ls $WHEEL_DIR/*.whl | head -n 1)
        WHEEL_FILENAME=$(basename "$WHEEL_PATH")
        GCS_PATH="gs://torch-tpu-ci-transient/artifacts/${{ github.workflow }}/${{ github.run_number }}/${{ github.run_attempt }}/$WHEEL_FILENAME"
        gcloud storage cp "$WHEEL_PATH" "$GCS_PATH"
        echo "gcs_wheel_path=$GCS_PATH" >> $GITHUB_OUTPUT
        echo "gcs_wheel_dir=gs://torch-tpu-ci-transient/artifacts/${{ github.workflow }}/${{ github.run_number }}/${{ github.run_attempt }}/" >> $GITHUB_OUTPUT
