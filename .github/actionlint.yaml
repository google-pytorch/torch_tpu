# Configuration for actionlint (https://github.com/rhysd/actionlint) used in
# ci/tools/actionlint.sh. actionlint only understands GitHub-hosted labels, so
# every self-hosted runner pool has to be declared, otherwise `runs-on:` fails
# the `runner-label` rule.
#
# Please add a label below when a new runner pool is introduced.
self-hosted-runner:
  labels:
    - linux-x86-ct5lp-224-8tpu
    - linux-x86-ct6e-180-8tpu
    - linux-x86-n4-16
    - linux-x86-tpu7x-56-1tpu
    - linux-x86-tpu7x-224-4tpu
