# OSS build. Keep dependencies in sync with the google3 BUILD file.
[package]
name = "custom_linter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Fast, VCS-agnostic linter for regex-based content rules"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "custom_linter"
path = "src/main.rs"

[dependencies]
regex = "1"
